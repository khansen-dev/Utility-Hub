<style>
  :root{
    --bg:#EEF1F2; --panel:#FFFFFF; --ink:#1B2733; --ink-soft:#5C6B77;
    --line:#D8DEE2; --accent:#0078FF; --accent-dark:#0052CC; --accent-bg:#E4F0FF;
    --good:#3E7C59; --good-bg:#E6F0EA; --danger:#B3432B; --danger-bg:#F7E5DF;
    --formbox-bg:#F5F7F8;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --topbar-bg:linear-gradient(135deg,#FFFFFF,#F3F6FA 65%,#EEF3FA);
    --topbar-text:#0B1020; --topbar-text-soft:#5C6B77;
    --topbar-tab-inactive:#5C6B77; --topbar-tab-active:#0B1020; --topbar-tab-hover:#1B2733;
    --topbar-btn-bg:#FFFFFF; --topbar-btn-border:#D8DEE2; --topbar-btn-text:#1B2733; --topbar-btn-bg-hover:#F3F6FA;
    --topbar-shadow:0 1px 3px rgba(11,16,32,.08);
    --topbar-badge-local-bg:#EEF1F2; --topbar-badge-local-text:#5C6B77; --topbar-badge-local-border:#D8DEE2;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.42;}
  header.topbar{background:var(--topbar-bg);padding:16px 16px 0;position:sticky;top:0;z-index:10;box-shadow:var(--topbar-shadow);transition:background .2s;}
  .brand{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px;max-width:820px;margin:0 auto;}
  .brand svg{display:block;}
  .brand .uh-word{font-weight:800;color:var(--topbar-text);letter-spacing:.2px;}
  #taglineText{color:var(--topbar-text-soft);}
  .brand .uh-word span{background:linear-gradient(90deg,#4FC3FF,#0052CC);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand span{color:var(--accent-dark);font-weight:600;}
  .brand small{font-weight:400;color:var(--ink-soft);font-size:12px;margin-left:4px;}
  nav.tabs{display:flex;gap:4px;margin:14px auto 0;max-width:820px;border-bottom:1px solid var(--topbar-btn-border);}
  nav.tabs button{background:none;border:none;padding:9px 10px;font-size:13px;font-weight:600;color:var(--topbar-tab-inactive);cursor:pointer;border-bottom:2px solid transparent;font-family:var(--sans);transition:color .15s;}
  nav.tabs button.active{color:var(--topbar-tab-active);border-image:linear-gradient(90deg,#4FC3FF,#0052CC) 1;border-bottom-width:2px;border-bottom-style:solid;}
  nav.tabs button.active[data-tab="document"]{border-image:linear-gradient(90deg,#4FC3FF,#0052CC) 1;}
  nav.tabs button.active[data-tab="datasheet"]{border-image:linear-gradient(90deg,#3DDCC7,#0E8C7F) 1;}
  nav.tabs button.active[data-tab="doc"]{border-image:linear-gradient(90deg,#FFB84D,#D9770A) 1;}
  nav.tabs button.active[data-tab="hydcalc"]{border-image:linear-gradient(90deg,#9D7BFF,#5A3DD1) 1;}
  #tab-hydcalc button.primary{background:linear-gradient(135deg,#9D7BFF,#5A3DD1);box-shadow:0 1px 2px rgba(90,61,209,.25);}
  #tab-datasheet button.primary{background:linear-gradient(135deg,#3DDCC7,#0E8C7F);box-shadow:0 1px 2px rgba(14,140,127,.25);}
  #tab-doc button.primary{background:linear-gradient(135deg,#FFB84D,#D9770A);box-shadow:0 1px 2px rgba(217,119,10,.25);}
  nav.tabs button:hover:not(.active){color:var(--topbar-tab-hover);}
  .langrow{display:flex;justify-content:flex-end;margin:8px auto 0;max-width:820px;flex-wrap:wrap;gap:6px;padding-bottom:14px;}
  header.topbar button.secondary,header.topbar #langToggle{background:var(--topbar-btn-bg);border:1px solid var(--topbar-btn-border);color:var(--topbar-btn-text);}
  header.topbar button.secondary:hover,header.topbar #langToggle:hover{background:var(--topbar-btn-bg-hover);}
  header.topbar button{transition:transform .1s ease,background .15s;}
  header.topbar button:active{transform:scale(.96);}
  #langToggle{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  main{padding:14px 12px 60px;max-width:820px;margin:0 auto;}
  .panel{display:none;}
  @keyframes panelFadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .panel.active{animation:panelFadeIn .28s ease;}
  .panel.active{display:block;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(11,16,32,.04),0 4px 12px rgba(11,16,32,.05);}
  .card h3{margin:0 0 10px;font-size:14px;font-weight:600;}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .muted{color:var(--ink-soft);font-size:12.5px;}
  .tagno{font-family:var(--mono);font-weight:600;color:var(--accent-dark);background:var(--accent-bg);padding:2px 7px;border-radius:5px;font-size:12.5px;}
  button.primary{background:linear-gradient(135deg,#0091FF,#0052CC);color:#fff;border:none;border-radius:7px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans);box-shadow:0 1px 2px rgba(0,82,204,.25);transition:filter .15s,transform .1s ease;}
  button.primary:hover{filter:brightness(1.06);}
  button.primary:active{filter:brightness(.95);transform:scale(.96);}
  button.secondary{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:transform .1s ease,background .15s;}
  button.secondary:active{transform:scale(.96);background:var(--bg);}
  button.ghost{background:none;border:none;color:var(--ink-soft);font-size:12px;cursor:pointer;text-decoration:underline;padding:2px 0;font-family:var(--sans);transition:opacity .1s ease;}
  button.ghost:active{opacity:.55;}
  button.danger-btn{background:none;border:none;color:var(--danger);font-size:12px;cursor:pointer;padding:2px 0;font-family:var(--sans);transition:opacity .1s ease;}
  button.danger-btn:active{opacity:.55;}
  input,select,textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 9px;font-size:13px;font-family:var(--sans);background:#fff;color:var(--ink);}
  body.dark-mode{
    --bg:#0F1420; --panel:#171D28; --ink:#E8EBF0; --ink-soft:#93A0B0;
    --line:#2B3340; --accent:#4FC3FF; --accent-dark:#8FDBFF; --accent-bg:#16283D;
    --good:#5FCB8C; --good-bg:#17301F; --danger:#FF8266; --danger-bg:#3A1D16;
    --topbar-bg:linear-gradient(135deg,#0B1020,#131B30 55%,#0F1830);
    --topbar-text:#EDF2FA; --topbar-text-soft:#7C8CAE;
    --topbar-tab-inactive:#8AA0C0; --topbar-tab-active:#EDF2FA; --topbar-tab-hover:#C3D0E5;
    --topbar-btn-bg:rgba(255,255,255,.07); --topbar-btn-border:rgba(255,255,255,.14); --topbar-btn-text:#DCE6F5; --topbar-btn-bg-hover:rgba(255,255,255,.13);
    --topbar-shadow:0 4px 16px rgba(11,16,32,.18);
    --topbar-badge-local-bg:rgba(255,255,255,.08); --topbar-badge-local-text:#8AA0C0; --topbar-badge-local-border:rgba(255,255,255,.14);
    --formbox-bg:#1E2635;
  }
  body.dark-mode input,body.dark-mode select,body.dark-mode textarea{background:#1C2330;border-color:var(--line);color:var(--ink);}
  body.dark-mode .paper-sheet{
    --bg:#EEF1F2; --panel:#FFFFFF; --ink:#1B2733; --ink-soft:#5C6B77; --line:#D8DEE2;
  }
  body.dark-mode .paper-sheet, body.dark-mode .paper-sheet *{color:#1B2733 !important;}
  body.dark-mode .paper-sheet .muted{color:#5C6B77 !important;}
  body.dark-mode .paper-sheet table.doc th{background:#EEF1F2 !important;}
  body.dark-mode .paper-sheet table.doc td,body.dark-mode .paper-sheet table.doc th{border-color:#D8DEE2 !important;}
  body.dark-mode .paper-sheet .dochead{border-bottom-color:#1B2733 !important;}
  body.dark-mode .paper-sheet table.docmeta td.k{background:#EEF1F2 !important;color:#5C6B77 !important;}
  .app-footer{margin-top:24px;padding:24px 12px 32px;text-align:center;border-top:1px solid var(--line);}
  .footer-values{display:flex;justify-content:center;gap:6px;margin-bottom:6px;}
  .footer-value{display:flex;flex-direction:column;align-items:center;gap:4px;width:25%;max-width:82px;}
  .footer-value svg{width:22px;height:22px;}
  .footer-value div{font-size:9px;font-weight:600;color:var(--ink-soft);line-height:1.25;}
  #btnSupport{cursor:pointer;}
  .footer-disclaimer{max-width:440px;margin:16px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;}
  .footer-disclaimer a{color:var(--accent-dark);font-size:12.5px;text-decoration:underline;}
  .footer-disclaimer p{font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin:8px 0 0;}
  .footer-copyright{margin-top:14px;font-size:11px;color:var(--ink-soft);}
  input[type=number]{font-family:var(--mono);}
  label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin:8px 0 3px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px;}
  @media(max-width:420px){.grid4{grid-template-columns:1fr 1fr;}}
  .hydline{border-top:1px solid var(--line);padding:10px 0;}
  .hydline-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block;}
  .hydline-eval-label{font-size:10px;color:var(--ink-soft);font-weight:700;display:block;margin-bottom:2px;}
  select.hyd-source-assumed{border-color:#C4670A;border-width:2px;background:#FFF4E0;color:#9A6209;font-weight:700;}
  body.dark-mode select.hyd-source-assumed{background:#3A2E14;color:#FFC86B;border-color:#C4670A;}
  .grid2>div,.grid3>div{min-width:0;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .formbox{border:1px dashed var(--line);border-radius:8px;padding:12px;margin-top:10px;background:var(--formbox-bg);}
  .formbtns{display:flex;gap:8px;margin-top:12px;}
  .line-item{border-top:1px solid var(--line);padding:6px 0;font-size:12.5px;font-variant-numeric:tabular-nums;}
  .paper-stage{background:var(--bg);border-radius:10px;padding:20px 14px 26px;margin-bottom:10px;box-shadow:inset 0 1px 3px rgba(11,16,32,.06);}
  body.dark-mode .paper-stage{background:#0A0E17;box-shadow:inset 0 1px 6px rgba(0,0,0,.5);}
  .paper-sheet{background:#ffffff;color:#1B2733;padding:20px 18px;border-radius:2px;

/* ---------- HYDRAULIC CALCULATOR MODULE ---------- */
/* Arkitektur-rammeverk for regelbasert beregningsmotor.
   Reglene merket "[DEMO]" er bevisste plassholdere for å bevise at motoren
   fungerer ende-til-ende.
   Reglene under DET er ekte, universelle rørhydraulikk-formler (Reynolds-tall,
   strømningstilstand, Darcy-Weisbach trykkfall) — standard lærebokfysikk med
   navngitt kilde, IKKE komponentspesifikk eller selskapsspesifikk data.
   Alle inputfelt forventes i SI-enheter (m, m³/s, kg/m³, m²/s) — se hint i UI. */

/* -------- Enhetskonverteringslag (§6) --------
   Visningsenheter: L/min, mm, kg/m³, Pa·s, cSt, bar, °C.
   Beregningsmotoren jobber alltid i SI internt. Hver funksjon er
   en ren, testbar konvertering — ingen skjulte antagelser. */
var HydUnits={
  LminToM3s:function(Q){return Q/60000;},
  M3sToLmin:function(Q){return Q*60000;},
  mmToM:function(D){return D/1000;},
  mToMm:function(D){return D*1000;},
  barToPa:function(p){return p*100000;},
  PaToBar:function(p){return p/100000;},
  cStToM2s:function(v){return v*0.000001;},
  M2sToCst:function(v){return v/0.000001;},
  /* Dynamisk viskositet fra kinematisk viskositet og tetthet: μ = ν × ρ */
  kinematicToDynamicViscosity:function(nu_m2s,rho_kgm3){return nu_m2s*rho_kgm3;},
  dynamicToKinematicViscosity:function(mu_Pas,rho_kgm3){return rho_kgm3?mu_Pas/rho_kgm3:null;}
};

/* -------- Fluid Library / ASTM D341 --------
   Formulering: Walther-likningen, verifisert mot oppgitt referansecase
   (ISO VG 32, 20°C → 78.1365866034734 cSt, avvik < 1e-12).
   Y = log10(log10(ν+C)), X = log10(T_K), Y = A - B×X, C = 0.7 (ASTM D341-korreksjonskonstant).
   ALDRI skjulte globale konstanter for oljeprodukter — kun C og
   Kelvin-konverteringen er faste (de er del av selve ASTM-metoden,
   ikke oljedata). Alle ν40/ν100/tetthet-verdier er versjonsstyrte
   Fluid Library-poster brukeren selv legger inn/importerer. */
var ASTM_D341_C=0.7;
var ASTM_D341_VERSION="1.0";

function astmD341Kinematic(nu40_cSt,nu100_cSt,tempC){
  var T1=40+273.15,T2=100+273.15,T=tempC+273.15;
  var X1=Math.log10(T1),X2=Math.log10(T2),Xt=Math.log10(T);
  var Y1=Math.log10(Math.log10(nu40_cSt+ASTM_D341_C));
  var Y2=Math.log10(Math.log10(nu100_cSt+ASTM_D341_C));
  var B=(Y1-Y2)/(X2-X1);
  var A=Y1+B*X1;
  var Yt=A-B*Xt;
  return Math.pow(10,Math.pow(10,Yt))-ASTM_D341_C;
}

/* -------- Friksjonsfaktor (§10, validert mot referansepakke) --------
   Laminær: f=64/Re (eksakt). Blasius: f=0.3164/Re^0.25 (glatte rør,
   ca. Re<10^5). Haaland: eksplisitt tilnærming til Colebrook-White,
   inkluderer relativ ruhet. Auto-metoden er bekreftet numerisk mot
   referansepakken: Re<2300 → laminær, Re≥2300 → Haaland. */
function hydFrictionLaminar(Re){return 64/Re;}
function hydFrictionBlasius(Re){return 0.3164/Math.pow(Re,0.25);}
function hydFrictionHaaland(Re,relRough){return Math.pow(-1.8*Math.log10(Math.pow(relRough/3.7,1.11)+6.9/Re),-2);}
function hydFrictionAuto(Re,relRough){return Re<2300?hydFrictionLaminar(Re):hydFrictionHaaland(Re,relRough);}
function hydFrictionSelect(method,Re,relRough){
  return {laminar:hydFrictionLaminar(Re),blasius:hydFrictionBlasius(Re),
    haaland:hydFrictionHaaland(Re,relRough),auto:hydFrictionAuto(Re,relRough)}[method]||hydFrictionAuto(Re,relRough);
}

/* -------- Regresjonstestsuite mot eksisterende Excel-metodikk --------
   Kjører hver referansecase fra valideringspakken gjennom appens EGNE
   funksjoner (ikke en frittstående kopi av formlene) og sammenligner
   mot oppgitte fasitverdier. Vises alltid synlig i UI — ingen skjulte
   eller forfalskede resultater (§20, §25). */
function hydRegressionCase(id,got,expected,tolAbs){
  var absDev=Math.abs(got-expected);
  var pctDev=expected!==0?(absDev/Math.abs(expected))*100:0;
  return {testId:id,got:got,expected:expected,absDev:absDev,pctDev:pctDev,pass:absDev<=(tolAbs||1e-6)};
}

function hydRunRegressionSuite(){
  var results=[];
  var rho=870,mu=0.067978830345021862;

  results.push(hydRegressionCase("HYD-GEOMETRY-001 (velocity)",v,5.26132043278993,1e-9));

  // Linje 6/7: Reynolds + friksjon + rørtrykkfall
  var pipeRule=hydCalcAllRules().find(function(r){return r.id==="pipe-darcy-pressure-drop";});
  var l6=pipeRule.compute({flowRate_m3s:Q,diameter_m:D,length_m:2.335,density_kgm3:rho,viscosity_m2s:mu/rho,roughness_m:HydUnits.mmToM(0.02)});
  results.push(hydRegressionCase("HYD-PRESSURE-LINE-001 (Re)",l6.outputValues.reynolds,1481.368134351457,1e-3));
  results.push(hydRegressionCase("HYD-PRESSURE-LINE-001 (f selected=laminar)",l6.outputValues.frictionFactor_selected,0.043203305455209617,1e-6));
  results.push(hydRegressionCase("HYD-PRESSURE-LINE-001 (pipe dP bar)",l6.outputValues.pressureDrop_bar,0.552153643126264,1e-4));

  var Q7=HydUnits.LminToM3s(240);
  var l7=pipeRule.compute({flowRate_m3s:Q7,diameter_m:D,length_m:2.33,density_kgm3:rho,viscosity_m2s:mu/rho,roughness_m:HydUnits.mmToM(0.02)});
  results.push(hydRegressionCase("HYD-PRESSURE-LINE-002 (Re)",l7.outputValues.reynolds,2962.736268702914,1e-2));
  results.push(hydRegressionCase("HYD-PRESSURE-LINE-002 (f selected=haaland)",l7.outputValues.frictionFactor_selected,0.045139741716348936,1e-6));
  results.push(hydRegressionCase("HYD-PRESSURE-LINE-002 (pipe dP bar)",l7.outputValues.pressureDrop_bar,2.3026666104143523,1e-3));

  // K-faktortester (isolert)
  var v6=l6.outputValues.velocity_ms;
  results.push(hydRegressionCase("K-FACTOR TEST 1",hydCompLossKFactor(2.0,rho,v6,1).dpTotal_bar,0.2408289864594875,1e-6));
  results.push(hydRegressionCase("K-FACTOR TEST 2",hydCompLossKFactor(0.9,rho,v6,2).dpTotal_bar,0.21674608781353877,1e-6));
  results.push(hydRegressionCase("K-FACTOR TEST 3",hydCompLossKFactor(0.6,rho,v6,2).dpTotal_bar,0.14449739187569249,1e-6));
  results.push(hydRegressionCase("K-FACTOR TEST 4 (qty 0)",hydCompLossKFactor(0.05,rho,v6,0).dpTotal_bar,0,1e-9));

  // Vendor-metode (isolert)
  results.push(hydRegressionCase("VENDOR TEST 1",hydCompLossVendor(1.6,240,120,1.8).dpActual_bar,0.45947934199881407,1e-6));
  results.push(hydRegressionCase("VENDOR TEST 2",hydCompLossVendor(1.6,250,240,1.8).dpActual_bar,1.4866481752431819,1e-6));
  results.push(hydRegressionCase("VENDOR TEST 3",hydCompLossVendor(0.9,160,120,1.8).dpActual_bar,0.53623206953096125,1e-6));
  results.push(hydRegressionCase("VENDOR TEST 4",hydCompLossVendor(1.3,240,240,1.8).dpActual_bar,1.3,1e-6));
  results.push(hydRegressionCase("VENDOR TEST 5",hydCompLossVendor(0.2,200,17,1.8).dpActual_bar,0.0023658328728614901,1e-6));

  // Full linje-total, test 6: rør + filter(vendor) + sjekkventil(K) + 2 bend(K) + 2 T-stykke(K)
  var comp6=l6.outputValues.pressureDrop_bar
    +hydCompLossVendor(1.6,240,120,1.8).dpActual_bar
    +hydCompLossKFactor(2.0,rho,v6,1).dpTotal_bar
    +hydCompLossKFactor(0.9,rho,v6,2).dpTotal_bar
    +hydCompLossKFactor(0.6,rho,v6,2).dpTotal_bar;
  results.push(hydRegressionCase("HYD-PRESSURE-LINE-001 (total dP bar)",comp6,1.6137054512737969,1e-3));

  // ASTM D341 referansetest (gjenbruker eksisterende, allerede validert funksjon)
  var fluidTest=hydFluidRunReferenceTest();

}

/* HYD-VEL-PRESSURE-001 / -002: trykklinje-hastighet, kontinuerlig + intermitterende */
function hydAssessPressureLineVelocity(v,operatingMode){
  if(v>=2.0&&v<=4.0)return hydRuleResult(1,"HYD-VEL-PRESSURE-001","hydRc_pressureVelOk");
  if(v>4.0){
    if(operatingMode==="intermittent"){
      if(v<=8.0)return hydRuleResult(2,"HYD-VEL-PRESSURE-002","hydRc_pressureVelIntermittentOk");
      return hydRuleResult(3,"HYD-VEL-PRESSURE-002","hydRc_pressureVelTooHigh");
    }
    if(operatingMode==="continuous")return hydRuleResult(3,"HYD-VEL-PRESSURE-002","hydRc_pressureVelTooHigh");
    return hydRuleResult(0,"HYD-VEL-PRESSURE-002","hydRc_pressureVelModeRequired");
  }
  // under 2.0 m/s — aktiv nedre-grensevurdering, ikke automatisk rødt
  return hydRuleResult(2,"HYD-VEL-PRESSURE-001","hydRc_pressureVelBelowRecommended");
}

/* HYD-VEL-LS-001: samme metodikk som trykklinje, men med eksplisitt kildesporing på volumstrømmen */
function hydAssessLsLineVelocity(v,operatingMode,flowSource){
  var base=hydAssessPressureLineVelocity(v,operatingMode);
  if(flowSource==="assumed"){
    var d=t();
    base.comment=base.comment+" "+d.hydRc_lsFlowAssumedNote;
    base.requiresVerification=true;
  }
  return base;
}

/* HYD-VEL-RETURN-001 + HYD-PRESSURE-RETURN-001/-002: hastighet og mottrykk vurderes separat */
function hydAssessReturnLineVelocity(v){
  if(v>=1.5&&v<=3.0)return hydRuleResult(1,"HYD-VEL-RETURN-001","hydRc_returnVelOk");
  if(v>3.0)return hydRuleResult(2,"HYD-VEL-RETURN-001","hydRc_returnVelHigh");
  return hydRuleResult(2,"HYD-VEL-RETURN-001","hydRc_returnVelBelowRecommended");
}
function hydAssessReturnLineBackpressure(p_bar,operatingMode,manufacturerLimit_bar){
  var limit=(manufacturerLimit_bar!==undefined&&manufacturerLimit_bar!==null&&manufacturerLimit_bar!=="")?parseFloat(manufacturerLimit_bar):null;
  if(!operatingMode)return hydRuleResult(0,"HYD-PRESSURE-RETURN-001/002","hydRc_returnPressureModeRequired");
  if(limit!==null&&p_bar>limit)return hydRuleResult(3,"HYD-PRESSURE-RETURN-001/002","hydRc_returnPressureOverManufacturerLimit");
  if(operatingMode==="continuous"){
    if(p_bar<=2.0)return hydRuleResult(1,"HYD-PRESSURE-RETURN-001","hydRc_returnPressureOk");
    return hydRuleResult(2,"HYD-PRESSURE-RETURN-001","hydRc_returnPressureAboveRecommended");
  }
  if(p_bar<=5.0)return hydRuleResult(2,"HYD-PRESSURE-RETURN-002","hydRc_returnPressureIntermittentReview");
  return hydRuleResult(3,"HYD-PRESSURE-RETURN-002","hydRc_returnPressureTooHigh");
}

/* HYD-VEL-SUCTION-001 + HYD-PRESSURE-SUCTION-001 */
function hydAssessSuctionLineVelocity(v){
  if(v>=0.5&&v<=1.0)return hydRuleResult(1,"HYD-VEL-SUCTION-001","hydRc_suctionVelOk");
  if(v>1.0)return hydRuleResult(2,"HYD-VEL-SUCTION-001","hydRc_suctionVelHigh");
  return hydRuleResult(2,"HYD-VEL-SUCTION-001","hydRc_suctionVelBelowRecommended");
}
function hydAssessSuctionAbsolutePressure(p_absBar){
  if(p_absBar===undefined||p_absBar===null||p_absBar==="")return hydRuleResult(0,"HYD-PRESSURE-SUCTION-001","hydRc_suctionPressureRequired");
  if(p_absBar>0.8)return hydRuleResult(1,"HYD-PRESSURE-SUCTION-001","hydRc_suctionPressureOk");
  return hydRuleResult(2,"HYD-PRESSURE-SUCTION-001","hydRc_suctionPressureLow");
}

/* HYD-VEL-DRAIN-001, avhenger av produsentens tillatte case/drain-trykk */
function hydAssessDrainLineVelocity(v){
  if(v>=0.5&&v<=1.0)return hydRuleResult(1,"HYD-VEL-DRAIN-001","hydRc_drainVelOk");
  if(v>1.0)return hydRuleResult(2,"HYD-VEL-DRAIN-001","hydRc_drainVelHigh");
  return hydRuleResult(2,"HYD-VEL-DRAIN-001","hydRc_drainVelBelowRecommended");
}
function hydAssessDrainManufacturerLimit(hasManufacturerLimit){
  return hasManufacturerLimit?hydRuleResult(1,"HYD-VEL-DRAIN-001","hydRc_drainLimitKnown"):hydRuleResult(0,"HYD-VEL-DRAIN-001","hydRc_drainLimitMissing");
}

/* HYD-PRESSURE-DROP-PERCENT-001: trykklinje/LS, trappet 2/5/10% avhengig av systemtrykk */
function hydAssessPressureDropPercent(totalDropBar,systemPressureBar){
  if(!systemPressureBar||systemPressureBar<=0)return hydRuleResult(0,"HYD-PRESSURE-DROP-PERCENT-001","hydRc_pressureDropNoSystemPressure");
  var pct=(totalDropBar/systemPressureBar)*100;
  var band=systemPressureBar<=250?{rec:2,rev:5}:{rec:10,rev:10};
  var result;
  if(systemPressureBar<=250){
    if(pct<=2)result=hydRuleResult(1,"HYD-PRESSURE-DROP-PERCENT-001","hydRc_pressureDropOk");
    else if(pct<=5)result=hydRuleResult(2,"HYD-PRESSURE-DROP-PERCENT-001","hydRc_pressureDropReview");
    else result=hydRuleResult(3,"HYD-PRESSURE-DROP-PERCENT-001","hydRc_pressureDropTooHigh");
  } else {
    if(pct<=10)result=hydRuleResult(pct<=2?1:2,"HYD-PRESSURE-DROP-PERCENT-001","hydRc_pressureDropReview");
    else result=hydRuleResult(3,"HYD-PRESSURE-DROP-PERCENT-001","hydRc_pressureDropTooHigh");
  }
  result.pct=pct;result.systemPressureBar=systemPressureBar;
  return result;
}

/* Full beregningskjede §9-11: kinematisk → dynamisk, med advarsler og
   ekstrapolasjonsmerking. Sletter aldri en tidligere manuell overstyring. */
function hydFluidCalculate(fluid,tempC,overrideViscosity_cSt){
  var d=t();
  var warnings=[];
  var nu40=fluid.nu40_cSt!==""?parseFloat(fluid.nu40_cSt):null;
  var nu100=fluid.nu100_cSt!==""?parseFloat(fluid.nu100_cSt):null;
  var rho=fluid.density_kgm3!==""?parseFloat(fluid.density_kgm3):null;
  var T=tempC!==""&&tempC!==undefined?parseFloat(tempC):null;
  if(nu40===null)warnings.push(d.hydFluidWarnMissingNu40);
  if(nu100===null)warnings.push(d.hydFluidWarnMissingNu100);
  if(T===null)warnings.push(d.hydFluidWarnMissingTemp);
  if(rho===null)warnings.push(d.hydFluidWarnMissingDensity);
  if(T!==null&&(T<40||T>100))warnings.push(d.hydFluidWarnExtrapolation);
  var nuCalc=null,muCalc=null;
  if(nu40!==null&&nu100!==null&&T!==null){
    nuCalc=astmD341Kinematic(nu40,nu100,T);
    if(!(nuCalc>0))warnings.push(d.hydFluidWarnInvalidViscosity);
  }
  if(nuCalc!==null&&rho!==null){
    muCalc=HydUnits.kinematicToDynamicViscosity(HydUnits.cStToM2s(nuCalc),rho);
  }
  var selectedNu=overrideViscosity_cSt!==undefined&&overrideViscosity_cSt!==null&&overrideViscosity_cSt!==""?parseFloat(overrideViscosity_cSt):nuCalc;
  var selectedMu=(overrideViscosity_cSt!==undefined&&overrideViscosity_cSt!==null&&overrideViscosity_cSt!==""&&rho!==null)?HydUnits.kinematicToDynamicViscosity(HydUnits.cStToM2s(selectedNu),rho):muCalc;
  return {
    fluidId:fluid.id,isoVgGrade:fluid.isoVgGrade,operatingTemp_C:T,
    nu40_cSt:nu40,nu100_cSt:nu100,
    calculatedKinematic_cSt:nuCalc,densityUsed_kgm3:rho,calculatedDynamic_Pas:muCalc,
    overrideKinematic_cSt:(overrideViscosity_cSt!==undefined&&overrideViscosity_cSt!==""?parseFloat(overrideViscosity_cSt):null),
    selectedKinematic_cSt:selectedNu,selectedDynamic_Pas:selectedMu,
    astmVersion:ASTM_D341_VERSION,sourceType:fluid.sourceType,verificationStatus:fluid.verificationStatus,
    warnings:warnings,computedAt:new Date().toISOString()
  };
}

/* §13: Δp = K × (ρ×v²/2), skalert med antall identiske komponenter. */
function hydCompLossKFactor(K,rho_kgm3,v_ms,quantity){
  var dpSingle_Pa=parseFloat(K)*(parseFloat(rho_kgm3)*Math.pow(parseFloat(v_ms),2))/2;
  var qtyParsed=parseFloat(quantity);
  var qty=isNaN(qtyParsed)?1:qtyParsed;
  var dpTotal_Pa=dpSingle_Pa*qty;
  return {dpSingle_bar:HydUnits.PaToBar(dpSingle_Pa),dpTotal_bar:HydUnits.PaToBar(dpTotal_Pa),quantity:qty};
}
/* §14: Δp_actual = Δp_nominal × (Q_actual/Q_nominal)^n. Eksponenten er ALDRI antatt til 2 — må komme fra leverandørdata. */
function hydCompLossVendor(dpNominal_bar,Qnominal_Lmin,Qactual_Lmin,exponent){
  var ratio=parseFloat(Qactual_Lmin)/parseFloat(Qnominal_Lmin);
  var dpActual_bar=parseFloat(dpNominal_bar)*Math.pow(ratio,parseFloat(exponent));
  return {dpActual_bar:dpActual_bar,flowRatio:ratio};
}

    requiredInputs:["demoValueA"],

      var a=parseFloat(inputs.demoValueA)||0;
      var d=t();
      return {outputValues:{demoStatus:a>100?d.hydOverLimit:d.hydWithinLimit},warnings:a>100?[d.hydDemoWarning]:[]};
    }
  },
  {
    id:"pipe-reynolds-regime",category:"flow",version:"1.0",
    nameKey:"hydRuleReynoldsName",
    standardRef:"Reynolds-tall Re = v·D/ν. Standard strømningsgrenser: laminær Re<2300, turbulent Re>4000 (overgangsområde mellom).",
    appliesTo:function(componentRef){return true;},
    requiredInputs:["flowRate_m3s","diameter_m","viscosity_m2s"],
    compute:function(inputs){
      var d=t();
      var Q=parseFloat(inputs.flowRate_m3s),D=parseFloat(inputs.diameter_m),nu=parseFloat(inputs.viscosity_m2s);
      var A=Math.PI*Math.pow(D/2,2);
      var v=Q/A;
      var Re=(v*D)/nu;
      var regime=Re<2300?d.hydRegimeLaminar:(Re>4000?d.hydRegimeTurbulent:d.hydRegimeTransitional);
      return {outputValues:{area_m2:+A.toFixed(6),velocity_ms:+v.toFixed(4),reynolds:Math.round(Re),regime:regime},
        warnings:(Re>=2300&&Re<=4000)?[d.hydTransitionalWarning]:[]};
    }
  },
  {
    id:"pipe-darcy-pressure-drop",category:"pressure",version:"1.1",
    nameKey:"hydRuleDarcyName",
    standardRef:"Darcy–Weisbach-likningen: ΔP = f·(L/D)·(ρ·v²/2). Friksjonsfaktor (Auto): Re<2300 → laminær f=64/Re; Re≥2300 → Haaland-likningen (eksplisitt Colebrook-White-tilnærming). Validert numerisk mot referansepakke (§5-12).",
    appliesTo:function(componentRef){return true;},
    requiredInputs:["flowRate_m3s","diameter_m","length_m","density_kgm3","viscosity_m2s","roughness_m"],
    compute:function(inputs){
      var d=t();
      var Q=parseFloat(inputs.flowRate_m3s),D=parseFloat(inputs.diameter_m),L=parseFloat(inputs.length_m),
        rho=parseFloat(inputs.density_kgm3),nu=parseFloat(inputs.viscosity_m2s),eps=parseFloat(inputs.roughness_m);
      var A=Math.PI*Math.pow(D/2,2);
      var v=Q/A;
      var Re=(v*D)/nu;
      var relRough=eps/D;
      var fLaminar=hydFrictionLaminar(Re),fBlasius=hydFrictionBlasius(Re),fHaaland=hydFrictionHaaland(Re,relRough);
      var f=hydFrictionAuto(Re,relRough);
      var warnings=(Re>=2300&&Re<=4000)?[d.hydTransitionalWarning]:[];
      var dP_Pa=f*(L/D)*(rho*v*v)/2;
      return {outputValues:{velocity_ms:+v.toFixed(6),reynolds:+Re.toFixed(4),relativeRoughness:+relRough.toFixed(8),
        frictionFactor_laminar:+fLaminar.toFixed(8),frictionFactor_blasius:+fBlasius.toFixed(8),frictionFactor_haaland:+fHaaland.toFixed(8),
        frictionFactor_selected:+f.toFixed(8),
        pressureDrop_bar:+(dP_Pa/1e5).toFixed(6),pressureDrop_Pa:+dP_Pa.toFixed(4)},warnings:warnings};
    }
  }
];

var HYD_LINE_TYPES=["pressure","return","suction","drain","ls","other"];

var HYD_VALUE_SOURCES=["manual","productStructure","componentLibrary","fluidLibrary","vendor","calculated","assumed"];

/* -------- Beregnet linjeresultat --------
   For gjenkjente linjetyper er "resultatet" ALDRI et tall brukeren taster selv —
   det beregnes fra rørhydraulikk-panelet + komponenttap-panelet. En fysisk linje
   kan ha BÅDE en hastighet og et trykkfall samtidig — de vurderes separat (§24),
   ikke tvunget inn i ett felt. "Annet"-linjetype beholder fri manuell verdi,
   siden det ikke finnes noen beregningskjede å hente fra der. */
function hydCalcIsComputedLineType(line){
  return line.lineType&&line.lineType!=="other";
}
function hydCalcComputeLineMetrics(line){
  var tr=line.lastCalcTrace;
  var velocity_ms=tr&&tr.outputValues&&tr.outputValues.velocity_ms!==undefined?tr.outputValues.velocity_ms:null;
  var pipeDrop_bar=tr&&tr.ruleId==="pipe-darcy-pressure-drop"&&tr.outputValues&&tr.outputValues.pressureDrop_bar!==undefined?tr.outputValues.pressureDrop_bar:0;
  var compSummary=hydCalcComponentLossSummary(line);
  var hasComponents=(line.componentLosses||[]).length>0;
  var hasPressureBasis=(tr&&tr.ruleId==="pipe-darcy-pressure-drop")||hasComponents;
  return {
    velocity_ms:velocity_ms,
    pressureDrop_bar:hasPressureBasis?(pipeDrop_bar+compSummary.total_bar):null,
    componentSummary:compSummary,
    hasVelocity:velocity_ms!==null,
    hasPressure:hasPressureBasis
  };
}

/* Vurderer en beregnet linje: hastighet og trykkfall separat, aldri tvunget
   sammen (§24). Bruker nøyaktig samme aktive regler som før, bare matet med
   beregnede verdier i stedet for et manuelt tastet tall. */
function hydCalcAssessComputedLine(line){
  var metrics=hydCalcComputeLineMetrics(line);
  var velocityAssessment=null,pressureAssessment=null;
  if(metrics.hasVelocity){
    var v=metrics.velocity_ms;
    if(line.lineType==="pressure")velocityAssessment=hydAssessPressureLineVelocity(v,line.operatingMode);
    else if(line.lineType==="ls")velocityAssessment=hydAssessLsLineVelocity(v,line.operatingMode,line.valueSource);
    else if(line.lineType==="return")velocityAssessment=hydAssessReturnLineVelocity(v);
    else if(line.lineType==="suction"){
      var sv=hydAssessSuctionLineVelocity(v);
      var sp=hydAssessSuctionAbsolutePressure(line.absoluteInletPressureBar);
      velocityAssessment=sp.code===0?Object.assign({},sv,{code:0,ruleId:sv.ruleId+" + "+sp.ruleId,comment:sv.comment+" "+sp.comment}):(sv.code>=sp.code?sv:sp);
    }
    else if(line.lineType==="drain"){
      var dv=hydAssessDrainLineVelocity(v);
      var dl=hydAssessDrainManufacturerLimit(!!line.manufacturerLimitBar);
      velocityAssessment=dl.code===0?Object.assign({},dv,{code:0,ruleId:dv.ruleId+" + "+dl.ruleId,comment:dv.comment+" "+dl.comment}):dv;
    }
  }
  if(metrics.hasPressure&&metrics.pressureDrop_bar!==null){
    var p=metrics.pressureDrop_bar;
    if((line.lineType==="pressure"||line.lineType==="ls")&&hydCalcWz.systemPressureRef){
      pressureAssessment=hydAssessPressureDropPercent(p,parseFloat(hydCalcWz.systemPressureRef));
    } else if(line.lineType==="return"){
      pressureAssessment=hydAssessReturnLineBackpressure(p,line.operatingMode,line.manufacturerLimitBar);
    }
  }
  return {metrics:metrics,velocityAssessment:velocityAssessment,pressureAssessment:pressureAssessment};
}

/* Ruter en linje til riktig AKTIV regel (§1-18 i siste oppdatering) når linjetype
   og enhet gjenkjennes. Faller tilbake til manuelle terskler for "Annet"/ukjente
   kombinasjoner. Manuelle terskler overstyrer ALDRI det aktive regelsettet stille —
   de brukes kun når ingen aktiv regel gjelder. */
function hydCalcTryActiveRule(line){
  var v=parseFloat(line.value);
  if(isNaN(v)||!line.lineType||line.lineType==="other")return null;
  var isVelocity=line.unit&&line.unit.toLowerCase().indexOf("m/s")>=0;
  var isBar=line.unit&&line.unit.toLowerCase().indexOf("bar")>=0;

  if(line.lineType==="pressure"&&isVelocity)return hydAssessPressureLineVelocity(v,line.operatingMode);
  if(line.lineType==="ls"&&isVelocity)return hydAssessLsLineVelocity(v,line.operatingMode,line.valueSource);
  if(line.lineType==="return"&&isVelocity)return hydAssessReturnLineVelocity(v);
  if(line.lineType==="return"&&isBar)return hydAssessReturnLineBackpressure(v,line.operatingMode,line.manufacturerLimitBar);
  if(line.lineType==="suction"&&isVelocity){
    var velResult=hydAssessSuctionLineVelocity(v);
    var presResult=hydAssessSuctionAbsolutePressure(line.absoluteInletPressureBar);
    // §12 sist oppdatering: mangler absolutt trykk -> samlet vurdering kan ikke bli grønn alene på hastighet
    if(presResult.code===0)return Object.assign({},velResult,{code:0,ruleId:velResult.ruleId+" + "+presResult.ruleId,comment:velResult.comment+" "+presResult.comment});
    return velResult.code>=presResult.code?velResult:presResult;
  }
  if(line.lineType==="drain"&&isVelocity){
    var dVel=hydAssessDrainLineVelocity(v);
    var dLimit=hydAssessDrainManufacturerLimit(!!line.manufacturerLimitBar);
    if(dLimit.code===0)return Object.assign({},dVel,{code:0,ruleId:dVel.ruleId+" + "+dLimit.ruleId,comment:dVel.comment+" "+dLimit.comment});
    return dVel;
  }
  if((line.lineType==="pressure"||line.lineType==="ls")&&isBar&&hydCalcWz.systemPressureRef){
    return hydAssessPressureDropPercent(v,parseFloat(hydCalcWz.systemPressureRef));
  }
  return null;
}

/* -------- Fire-kode vurderingsmotor (§21-22) --------
   Code 0 = NEUTRAL/REVIEW  (mangler grenseverdi eller input)
   Code 1 = ACCEPTED/GREEN  (innenfor anbefalt område)
   Code 2 = CONDITIONALLY ACCEPTABLE/AMBER (utenfor anbefalt, innenfor tillatt)
   Code 3 = UNDESIRABLE/RED (utenfor tillatt område)
   Grenser er inkluderende i "gode" retning: lowerRecommended<=v<=upperRecommended -> Code1. */
function hydCalcAssessLine(line){
  if(line.override&&line.override.code!==undefined&&line.override.code!==null){
    var autoBase=hydCalcAssessLineAuto(line);
    return {code:line.override.code,autoCode:autoBase.code,overridden:true,override:line.override,ruleId:autoBase.ruleId};
  }
  var auto=hydCalcAssessLineAuto(line);
  return {code:auto.code,autoCode:auto.code,overridden:false,override:null,ruleId:auto.ruleId,activeRule:auto.activeRule};
}
function hydCalcAssessLineAuto(line){
  var active=hydCalcTryActiveRule(line);
  if(active)return {code:active.code,ruleId:active.ruleId,activeRule:active};
  var lc=line.lowerCritical!==""?parseFloat(line.lowerCritical):null;
  var lr=line.lowerRecommended!==""?parseFloat(line.lowerRecommended):null;
  var ur=line.upperRecommended!==""?parseFloat(line.upperRecommended):null;
  var ua=line.upperAllowable!==""?parseFloat(line.upperAllowable):null;
  var v=parseFloat(line.value);
  var anyLimitSet=(lc!==null||lr!==null||ur!==null||ua!==null);
  var code;
  if(isNaN(v)||!anyLimitSet){
    code=0;
  } else if((lc!==null&&v<lc)||(ua!==null&&v>ua)){
    code=3;
  } else if((lr===null||v>=lr)&&(ur===null||v<=ur)){
    code=1;
  } else {
    code=2;
  }
  return {code:code,ruleId:null,activeRule:null};
}
function hydCalcCodeMeta(code){
  return [
    {colorClass:"neutral",dot:"var(--ink-soft)",icon:"◌",key:"neutral"},
    {colorClass:"ok",dot:"var(--good)",icon:"✓",key:"green"},
    {colorClass:"yellow",dot:"#D4A700",icon:"△",key:"yellow"},
    {colorClass:"alert",dot:"var(--danger)",icon:"✕",key:"red"}
  ][code]||{colorClass:"neutral",dot:"var(--ink-soft)",icon:"◌",key:"neutral"};
}

/* -------- Vurderingsmotor: forklarer HVORFOR en linje fikk sin klassifisering,
   ikke bare hvilken farge. Bruker samme terskler som fargekodingen (§ over) —
   ingen nye tall gjettes, kun forklaringsteksten er generert. -------- */
function hydCalcTechnicalComment(line){
  var d=t();
  var assess=hydCalcAssessLine(line);
  var meta=hydCalcCodeMeta(assess.code);
  var typeLabel=line.lineType?d["hydLineType_"+line.lineType]:d.hydLineTypeGeneric;
  var valueStr=(line.value?line.value+(line.unit?" "+line.unit:""):"");
  var text;
  if(assess.activeRule&&assess.activeRule.comment){
    text="["+assess.activeRule.ruleId+"] "+assess.activeRule.comment;
  } else {
    var templates={0:d.hydComment0,1:d.hydComment1,2:d.hydComment2,3:d.hydComment3};
    text=(templates[assess.code]||templates[0]).replace("{value}",valueStr).replace("{type}",typeLabel);
  }
  if(assess.overridden){
    text=d.hydOverrideLabel+" ("+d["hydSysText"+assess.autoCode]+" → "+d["hydSysText"+assess.code]+"): "+assess.override.reason+" — "+d.hydOverrideBy+" "+assess.override.by+", "+assess.override.at;
  }
  return {code:assess.code,icon:meta.icon,colorClass:meta.colorClass,sysText:d["hydSysText"+assess.code],text:text,overridden:assess.overridden};
}

/* §17-18: summerer komponenttap for en linje. Holder K-faktor- og leverandørtap
   separat, og respekterer akkumulator- og DATA REQUIRED-vaktene (§16, §12). */
function hydCalcComponentLossSummary(line){
  var d=t();
  var items=(line.componentLosses||[]).map(function(ref){
    var comp=state.hydComponentLossLibrary.find(function(c){return c.id===ref.compId;});
    if(!comp)return null;
    if(comp.componentType==="accumulator"){
      return {comp:comp,ref:ref,status:"accumulator",message:d.hydAccumulatorNotImplemented};
    }
    if(!comp.calcMethod||comp.calcMethod==="noData"){
      return {comp:comp,ref:ref,status:"dataRequired",message:d.hydDataRequired};
    }
    if(comp.calcMethod==="kfactor"){
      if(comp.kFactor===""||ref.velocity_ms===""||ref.velocity_ms===undefined){
        return {comp:comp,ref:ref,status:"dataRequired",message:d.hydDataRequired};
      }
      var rho=parseFloat((line.calcInputs||{}).density_kgm3)||1000;
      var res=hydCompLossKFactor(comp.kFactor,rho,ref.velocity_ms,ref.quantity);
      return {comp:comp,ref:ref,status:"ok",dpTotal_bar:res.dpTotal_bar,method:"kfactor"};
    }
    if(comp.calcMethod==="vendor"){
      if(comp.vendorPressureDrop_bar===""||comp.nominalFlow_Lmin===""||comp.flowExponent===""||!ref.actualFlow_Lmin){
        return {comp:comp,ref:ref,status:"dataRequired",message:d.hydDataRequired};
      }
      var res2=hydCompLossVendor(comp.vendorPressureDrop_bar,comp.nominalFlow_Lmin,ref.actualFlow_Lmin,comp.flowExponent);
      var qtyParsed=parseFloat(ref.quantity);
      var qty=isNaN(qtyParsed)?1:qtyParsed;
      return {comp:comp,ref:ref,status:"ok",dpTotal_bar:res2.dpActual_bar*qty,method:"vendor"};
    }
    return {comp:comp,ref:ref,status:"dataRequired",message:d.hydDataRequired};
  }).filter(Boolean);
  var total_bar=items.reduce(function(sum,it){return sum+(it.status==="ok"?it.dpTotal_bar:0);},0);
  var hasIssues=items.some(function(it){return it.status!=="ok";});
  return {items:items,total_bar:total_bar,hasIssues:hasIssues};
}


function hydCalcPressurePct(line,systemPressure){
  var v=parseFloat(line.value),sp=parseFloat(systemPressure);
  if(isNaN(v)||isNaN(sp)||sp===0)return null;
  return (v/sp)*100;
}

/* §27: rød (3) skjules ALDRI av gule/grønne. Kun 0 hvis INGEN linjer har fått en reell vurdering. */
function hydCalcOverallCode(lines){
  var relevant=(lines||[]).filter(function(l){return l.label||l.value;});
  if(relevant.length===0)return 0;
  var codes=relevant.map(function(l){return hydCalcAssessLine(l).code;});
  if(codes.indexOf(3)>=0)return 3;
  if(codes.indexOf(2)>=0)return 2;
  if(codes.indexOf(1)>=0&&codes.every(function(c){return c===1||c===0;}))return codes.indexOf(0)>=0?0:1;
  return 0;
}

function hydCalcOverallConclusion(lines,d){
  var relevant=(lines||[]).filter(function(l){return l.label||l.value;});
  if(relevant.length===0)return d.hydConclusionNoLines;
  var code=hydCalcOverallCode(lines);
  return {0:d.hydConclusion0,1:d.hydConclusion1,2:d.hydConclusion2,3:d.hydConclusion3}[code];
}

function hydCalcCompLossPanelHtml(line,i,d){

        '</div>'+
        '<button type="button" class="danger-btn" data-hydCompLossDel="'+i+'" data-ri="'+ri+'">✕ '+d.del+'</button>'+

    });
    html+='<button type="button" class="ghost" data-hydCompLossAdd="'+i+'">+ '+d.hydCompLossAddRef+'</button>';

/* Beregnet linje: rørhydraulikk- og komponentpanelene er selve datainngangen,
   ikke sideverktøy. Resultatet vises alltid utledet, aldri som fritekst. */
function hydCalcComputedBodyHtml(line,i,d){
  var result=hydCalcAssessComputedLine(line);
  var html='<div class="status-pill neutral" style="margin:6px 0;display:block">ℹ '+d.hydComputedLineNote+'</div>'+
    '<div class="muted" style="font-size:11px;font-weight:600;margin-top:4px">'+d.hydCalcPanelTitle+'</div>'+
    hydCalcPanelHtml(line,i,d)+
    '<div class="muted" style="font-size:11px;font-weight:600;margin-top:8px">'+d.hydCompLossPanelTitle+'</div>'+
    hydCalcCompLossPanelHtml(line,i,d);

  html+='<div class="muted" style="font-size:11px;font-weight:600;margin-top:10px">'+d.hydResultsTitle+'</div>';
  if(result.velocityAssessment){
    var vm=hydCalcCodeMeta(result.velocityAssessment.code);
    html+='<div class="status-pill '+vm.colorClass+'" style="display:block;white-space:normal;text-align:left;line-height:1.4;margin-bottom:4px">'+
      '<span aria-hidden="true">'+vm.icon+'</span> <b>'+d.hydVelocityLabel+' '+result.metrics.velocity_ms.toFixed(3)+' m/s</b> — '+esc(result.velocityAssessment.comment)+' ['+esc(result.velocityAssessment.ruleId)+']</div>';
  }
  if(result.pressureAssessment){
    var pm=hydCalcCodeMeta(result.pressureAssessment.code);
    html+='<div class="status-pill '+pm.colorClass+'" style="display:block;white-space:normal;text-align:left;line-height:1.4;margin-bottom:4px">'+
      '<span aria-hidden="true">'+pm.icon+'</span> <b>'+d.hydPressureDropLabel+' '+result.metrics.pressureDrop_bar.toFixed(4)+' bar</b> — '+esc(result.pressureAssessment.comment)+' ['+esc(result.pressureAssessment.ruleId)+']</div>';
  }
  if(!result.velocityAssessment&&!result.pressureAssessment){
    html+='<div class="status-pill neutral" style="display:block">'+d.hydNoResultYet+'</div>';
  }
  return html;
}

      '<tr><td style="font-weight:600;width:35%">'+d.hydLineLabel+'</td><td>'+esc(l.label)+(l.lineType?' — '+esc(d["hydLineType_"+l.lineType]||""):"")+'</td></tr>'+
      (tag?'<tr><td style="font-weight:600">'+d.hydStepComponents+'</td><td>'+esc(tag.tagNo?tag.tagNo+" – ":"")+esc(tag.name)+' · '+esc(tag.supplier)+'</td></tr>':'')+
      '<tr><td style="font-weight:600">'+d.hydMethodRef+'</td><td>'+(rule?esc(rule.standardRef):esc(d.hydMethodRefPlaceholder))+'</td></tr>'+
      (rule?'<tr><td style="font-weight:600">'+d.hydTraceInputs+'</td><td>'+esc(JSON.stringify(tr.inputSnapshot))+'</td></tr>':'')+
      (rule?'<tr><td style="font-weight:600">'+d.hydCalcRawOutput+'</td><td>'+esc(JSON.stringify(tr.outputValues))+'</td></tr>':'')+
      '<tr><td style="font-weight:600">'+d.hydResultsTitle+'</td><td><span class="status-pill '+meta.colorClass+'">'+esc(l.value)+(l.unit?" "+esc(l.unit):"")+'</span></td></tr>'+
      '<tr><td style="font-weight:600">'+d.hydValueSourceLabel+'</td><td>'+(l.valueSource==="assumed"?'<span class="status-pill warn">⚑ '+esc(d.hydSource_assumed)+' — '+esc(d.hydAssumedWarning)+'</span>':esc(d["hydSource_"+l.valueSource]||""))+'</td></tr>'+
      (pct!==null?'<tr><td style="font-weight:600">'+d.hydPressurePctLabel+'</td><td>'+pct.toFixed(1)+'% '+esc(d.hydOfSystemPressure)+' ('+esc(caseData.systemPressureRef)+')</td></tr>':'')+
      ((l.lowerCritical||l.lowerRecommended||l.upperRecommended||l.upperAllowable)?
        '<tr><td style="font-weight:600">'+d.hydThresholdsTitle+'</td><td>'+d.hydLowerCritical+': '+esc(l.lowerCritical||"–")+' · '+d.hydLowerRecommended+': '+esc(l.lowerRecommended||"–")+' · '+d.hydUpperRecommended+': '+esc(l.upperRecommended||"–")+' · '+d.hydUpperAllowable+': '+esc(l.upperAllowable||"–")+'</td></tr>':'')+
      '<tr><td style="font-weight:600">'+d.hydTechnicalComment+'</td><td>'+meta.icon+' <b>'+esc(comment.sysText)+'</b><br>'+esc(comment.text)+'</td></tr>'+
      (l.override?'<tr><td style="font-weight:600">'+d.hydOverrideTitle+'</td><td>'+esc(d.hydOverrideReasonLabel)+': '+esc(l.override.reason)+'<br>'+esc(d.hydOverrideBy)+': '+esc(l.override.by)+' · '+esc(new Date(l.override.at).toLocaleString(state.lang==="no"?"nb-NO":"en-GB"))+'</td></tr>':'')+
      (l.recommendedAction?'<tr><td style="font-weight:600">'+d.hydRecommendedAction+'</td><td>'+esc(l.recommendedAction)+'</td></tr>':'')+
      '<tr><td style="font-weight:600">P / R / D / LS</td><td>'+esc(l.evalP)+' / '+esc(l.evalR)+' / '+esc(l.evalD)+' / '+esc(l.evalLS)+'</td></tr>'+
      '</tbody></table>';
  });

  html+='<div style="font-weight:600;font-size:12px;margin:14px 0 4px">'+d.hydApprovalTitle+'</div>';
  html+='<table class="doc"><tbody>'+
    '<tr><td style="font-weight:600;width:35%">'+d.hydPreparedBy+'</td><td>'+esc(caseData.docInfo.preparedBy)+'</td></tr>'+
    '<tr><td style="font-weight:600">'+d.hydCheckedBy+'</td><td>'+esc(caseData.docInfo.checkedBy)+'</td></tr>'+
    '<tr><td style="font-weight:600">'+d.hydApprovedBy+'</td><td>'+esc(caseData.docInfo.approvedBy)+'</td></tr>'+
    '</tbody></table>';
  return html;
}

function bindHydCalcEvents(){
  var d=t();

  var addFluidBtn=document.getElementById("hydFluidAdd");
  if(addFluidBtn)addFluidBtn.onclick=function(){state.hydFluidAdding=true;state.hydFluidEditingId=null;renderHydCalcTab();};
  var importLegacyBtn=document.getElementById("hydFluidImportLegacy");
  if(importLegacyBtn)importLegacyBtn.onclick=function(){
    HYD_FLUID_LEGACY_REFERENCE_RECORDS.forEach(function(rec){
      var exists=state.hydFluidLibrary.some(function(f){return f.isoVgGrade===rec.isoVgGrade&&f.sourceType==="importedLegacy";});
      if(exists)return;
      var nf=hydFluidNew();
      nf.isoVgGrade=rec.isoVgGrade;nf.productName=rec.isoVgGrade+" ("+d.hydFluidImportedLabel+")";
      nf.nu40_cSt=String(rec.nu40_cSt);nf.nu100_cSt=String(rec.nu100_cSt);
      nf.sourceType="importedLegacy";nf.verificationStatus="pendingReview";
      nf.engineeringNotes=d.hydFluidImportedNote;
      state.hydFluidLibrary.push(nf);
    });
    toast(t().saved);
    renderHydCalcTab();
  };
  var importCompLegacyBtn=document.getElementById("hydCompImportLegacy");
  if(importCompLegacyBtn)importCompLegacyBtn.onclick=function(){
    HYD_COMP_LEGACY_REFERENCE_RECORDS.forEach(function(rec){
      var exists=state.hydComponentLossLibrary.some(function(c){return c.componentType===rec.componentType&&c.dataSource==="legacyActive";});
      if(exists)return;
      var nc=hydCompNew();
      nc.componentType=rec.componentType;nc.componentName=rec.componentName;nc.calcMethod=rec.calcMethod;nc.kFactor=rec.kFactor;
      nc.dataSource="legacyActive";nc.documentRef="Mal - Hyd. Beregninger.xlsx";nc.revision="1.0.0";
      nc.approvalStatus="APPROVED FOR INITIAL IMPLEMENTATION";nc.validityStatus="ACTIVE";
      nc.engineeringNotes=d.hydCompImportedNote;
      state.hydComponentLossLibrary.push(nc);
    });
    toast(t().saved);
    renderHydCalcTab();
  };
  document.querySelectorAll("[data-hydFluidEdit]").forEach(function(b){
    b.onclick=function(){state.hydFluidEditingId=b.getAttribute("data-hydFluidEdit");state.hydFluidAdding=false;renderHydCalcTab();};
  });
  document.querySelectorAll("[data-hydFluidDel]").forEach(function(b){
    b.onclick=function(){
      if(!confirm(d.hydCompDeleteConfirm))return;
      var id=b.getAttribute("data-hydFluidDel");
      state.hydFluidLibrary=state.hydFluidLibrary.filter(function(x){return x.id!==id;});
      renderHydCalcTab();
    };
  });
  document.querySelectorAll("[data-hydFluidCancel]").forEach(function(b){
    b.onclick=function(){state.hydFluidAdding=false;state.hydFluidEditingId=null;renderHydCalcTab();};
  });
  document.querySelectorAll("[data-hydFluidSave]").forEach(function(b){
    b.onclick=function(){
      var existingId=b.getAttribute("data-hydFluidSave");
      var val=function(id){var el=document.getElementById(id);return el?el.value.trim():"";};
      var vals={manufacturer:val("hf_manufacturer"),productName:val("hf_productName"),productFamily:val("hf_productFamily"),
        fluidCategory:val("hf_fluidCategory"),isoVgGrade:val("hf_isoVgGrade"),nu40_cSt:val("hf_nu40"),nu100_cSt:val("hf_nu100"),
        density_kgm3:val("hf_density"),densityRefTemp_C:val("hf_densityRefTemp"),minOpTemp_C:val("hf_minTemp"),maxOpTemp_C:val("hf_maxTemp"),
        sourceType:val("hf_sourceType"),verificationStatus:val("hf_verificationStatus"),sourceRef:val("hf_sourceRef"),datasheetRef:val("hf_datasheetRef"),
        revision:val("hf_revision"),effectiveDate:val("hf_effectiveDate"),approvedBy:val("hf_approvedBy"),engineeringNotes:val("hf_notes")};
      if(!vals.productName){alert(d.hydCompNameRequired);return;}
      var existing=state.hydFluidLibrary.find(function(x){return x.id===existingId;});
      if(existing){Object.assign(existing,vals);}
      else{state.hydFluidLibrary.push(Object.assign(hydFluidNew(),{id:existingId},vals));}
      state.hydFluidAdding=false;state.hydFluidEditingId=null;
      toast(t().saved);
      renderHydCalcTab();
    };
  });

      summary:function(row){return esc(row.description)+(row.discipline?" · "+esc(row.discipline):"")+' <span class="status-pill '+(row.status==="open"?"alert":"ok")+'">'+(row.status==="open"?d.regStatusOpen:d.regStatusClosed)+'</span>';}};

        {k:"description",label:d.regDescription,type:"text"},{k:"notes",label:d.regNotes,type:"text"}],

  if(key==="revisions"){

      fields:[{k:"revision",label:d.regRevision,type:"text"},{k:"date",label:d.docDate,type:"date"},{k:"description",label:d.regDescription,type:"text"},
        {k:"preparedBy",label:d.preparedBy,type:"text"},{k:"checkedBy",label:d.regCheckedBy,type:"text"},{k:"approvedBy",label:d.regApprovedBy,type:"text"}],
      summary:function(row){return esc(row.revision)+" · "+esc(row.date)+" · "+esc(row.description)+" · "+esc(row.preparedBy);}};

        {k:"distLevel",label:d.utilDistLevel,type:"text",hint:d.hintDistLevel},{k:"availCap",label:d.utilAvailCap,type:"text",hint:d.hintAvailCap},{k:"remarks",label:d.regNotes,type:"text"}],
      summary:function(row){return "["+esc(row.utilId)+"] "+esc(utilLbl(row.utilName))+" · "+esc(row.medium)+" · "+esc(row.availCap)+" "+esc(row.capacityUnit);}};
  }
  if(key==="products"){
    return {title:d.regProducts,
      fields:[{k:"productId",label:d.prodId,type:"text"},{k:"productName",label:d.prodName,type:"text"},
        {k:"description",label:d.regDescription,type:"text"},{k:"location",label:d.crLocation,type:"text"},
        {k:"operatingMode",label:d.crOperatingMode,type:"text"},{k:"vendorRef",label:d.prodVendorRef,type:"text",hint:d.hintVendorRef},{k:"remarks",label:d.regNotes,type:"text"}],

  }
  if(key==="utilityRequirements"){
    return {title:d.regUtilityRequirements,
      fields:[{k:"tagNo",label:d.colTag,type:"text"},{k:"parameter",label:d.uReqParameter,type:"text",hint:d.hintParameter},{k:"unit",label:d.colUnit,type:"text"},

function bindRegisterEvents(rerenderFn){
  document.querySelectorAll("[data-regAdd]").forEach(function(b){b.onclick=function(){
    state.registerAdding=b.getAttribute("data-regAdd");state.registerEditRow=null;rerenderFn();
  };});
  document.querySelectorAll("[data-regEdit]").forEach(function(b){b.onclick=function(){
    state.registerEditRow=b.getAttribute("data-regEdit");state.registerAdding=null;rerenderFn();
  };});
  document.querySelectorAll("[data-regCancel]").forEach(function(b){b.onclick=function(){state.registerAdding=null;state.registerEditRow=null;rerenderFn();};});
  document.querySelectorAll("[data-regDel]").forEach(function(b){b.onclick=function(){
    var parts=b.getAttribute("data-regDel").split("|");
    var p=findProject(parts[1]);
    p[parts[0]]=p[parts[0]].filter(function(r){return r.id!==parts[2];});
    rerenderFn();
  };});
  document.querySelectorAll("[data-regSave]").forEach(function(b){b.onclick=function(){
    var parts=b.getAttribute("data-regSave").split("|");
    var key=parts[0],p=findProject(parts[1]),rowId=parts[2];
    var cfg=regCfg(key);
    p[key]=p[key]||[];
    if(rowId){
      var existing=p[key].find(function(r){return r.id===rowId;});
      if(existing)cfg.fields.forEach(function(f){existing[f.k]=val("rf_"+f.k);});
    } else {
      var row={id:uid()};
      cfg.fields.forEach(function(f){row[f.k]=val("rf_"+f.k);});
      p[key].push(row);
    }
    state.registerAdding=null;state.registerEditRow=null;rerenderFn();
  };});
}

function docEnsureDocNumber(cb){
  if(docWz.docNumber){cb();return;}
  if(!firebaseEnabled||!fbUser||!fbDb){docWz.docNumber=docNewDocNumber();cb();return;}
  var counterRef=fbDb.collection("shared").doc("docCounter");
  fbDb.runTransaction(function(tx){
    return tx.get(counterRef).then(function(doc){
      var current=doc.exists?(doc.data().value||142):142;
      var next=current+1;
      tx.set(counterRef,{value:next});
      return next;
    });
  }).then(function(n){
    docWz.docNumber="DoC-"+new Date().getFullYear()+"-"+String(n).padStart(4,"0");
    cb();
  }).catch(function(err){
    console.error(err);
    docWz.docNumber=docNewDocNumber();
    cb();
  });
}

function dsReadSessionFields(){
  var s=state.datasheetSession;
  var docNo=document.getElementById("ds_docNo");if(docNo)s.docNo=docNo.value.trim();
  var rev=document.getElementById("ds_rev");if(rev)s.revision=rev.value.trim();
  var date=document.getElementById("ds_date");if(date)s.docDate=date.value.trim();
  var prep=document.getElementById("ds_prep");if(prep)s.preparedBy=prep.value.trim();
}

function bindDatasheetTabEvents(){
  var sel=document.getElementById("dsTagSelect");
  if(sel)sel.onchange=function(){
    dsReadSessionFields();
    state.datasheetSelectedTagId=sel.value||null;
    renderDatasheetTab();
  };

  function handleDsLogoFile(file){
    if(!file||file.type.indexOf("image/")!==0)return;
    dsReadSessionFields();
    var reader=new FileReader();
    reader.onload=function(e){state.datasheetSession.logo=e.target.result;renderDatasheetTab();};
    reader.readAsDataURL(file);
  }
  var dsLogoInput=document.getElementById("ds_logo");
  if(dsLogoInput)dsLogoInput.onchange=function(){
    if(dsLogoInput.files&&dsLogoInput.files[0])handleDsLogoFile(dsLogoInput.files[0]);
  };
  var dsRemoveLogoBtn=document.getElementById("dsRemoveLogo");
  if(dsRemoveLogoBtn)dsRemoveLogoBtn.onclick=function(){
    dsReadSessionFields();
    state.datasheetSession.logo="";renderDatasheetTab();
  };
  var dsDropzone=document.getElementById("dsLogoDropzone");
  if(dsDropzone){
    dsDropzone.onclick=function(e){if(e.target!==dsLogoInput)dsLogoInput.click();};
    dsDropzone.ondragover=function(e){e.preventDefault();dsDropzone.classList.add("dragover");};
    dsDropzone.ondragleave=function(){dsDropzone.classList.remove("dragover");};
    dsDropzone.ondrop=function(e){
      e.preventDefault();dsDropzone.classList.remove("dragover");
      if(e.dataTransfer.files&&e.dataTransfer.files[0])handleDsLogoFile(e.dataTransfer.files[0]);
    };
  }

  var printBtn=document.getElementById("dsPrintBtn");
  if(printBtn)printBtn.onclick=function(){
    dsReadSessionFields();
    var tag=findTag(state.datasheetSelectedTagId);
    if(!tag)return;
    var w=window.open("","_blank");
    w.document.write(buildDatasheetPrintableHtml(tag,state.datasheetSession));
    w.document.close();w.focus();
    setTimeout(function(){w.print();},300);
  };
}

  var d=t();
  if(!docWz)docResetWizard();
  var html=(state.docViewMode==="wizard")?renderDocWizardHtml(d):renderDocList(d);

    "</head><body>"+body+"</body></html>";
}

        html+='<div class="card"><div class="row"><div><b>'+esc(decl.docNumber)+'</b><div class="muted">'+esc(decl.productName||"—")+' · '+esc(decl.manufacturerName||"—")+'</div></div>'+
          '<button class="danger-btn" data-adminDelShared="'+decl.id+'">'+d.docDeleteBtn+'</button></div></div>';

  if(adminSubTab==="restore"){
    html+='<div class="card"><div class="muted" style="font-size:11.5px;line-height:1.5;margin-bottom:10px">'+d.adminRestoreWarning+'</div>'+

    else{

function adminStatRow(label,val){

function adminLoadUsers(){
  if(!firebaseEnabled||!fbDb)return;
  fbDb.collectionGroup("profile").get().then(function(snap){
    var users=[];
    snap.forEach(function(doc){
      var data=doc.data();
      var uid=doc.ref.parent.parent?doc.ref.parent.parent.id:doc.id;
      users.push({uid:uid,email:data.email,lastLogin:data.lastLogin});
    });
    adminUsersCache=users;
    renderAdminTab();
  }).catch(function(err){
    console.error(err);
    adminUsersCache=[];
    renderAdminTab();
  });
}

function bindAdminEvents(){
  var d=t();
  var restoreFile=document.getElementById("adminRestoreFile");
  if(restoreFile)restoreFile.onclick=function(){
    if(!confirm(t().confirmOpenData))return;
    document.getElementById("fileOpenData").click();
  };
  var restoreCloud=document.getElementById("adminRestoreCloud");
  if(restoreCloud)restoreCloud.onclick=cloudLoad;
  document.querySelectorAll("[data-adminSub]").forEach(function(b){b.onclick=function(){
    adminSubTab=b.getAttribute("data-adminSub");adminJsonView=null;renderAdminTab();
  };});
  var exportBtn=document.getElementById("adminExportBtn");
  if(exportBtn)exportBtn.onclick=function(){
    var payload={exportedAt:new Date().toISOString(),tags:state.tags,projects:state.projects,docCustom:state.docCustom,hydComponentLossLibrary:state.hydComponentLossLibrary,hydFluidLibrary:state.hydFluidLibrary,sharedDeclarations:state.sharedDeclarations,users:adminUsersCache};
    var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="utility-hub-admin-export.json";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  };
  var refreshUsers=document.getElementById("adminRefreshUsers");
  if(refreshUsers)refreshUsers.onclick=function(){adminUsersCache=null;renderAdminTab();};
  document.querySelectorAll("[data-adminViewUser]").forEach(function(b){b.onclick=function(){
    var uid=b.getAttribute("data-adminViewUser");
    if(adminJsonView===uid){adminJsonView=null;renderAdminTab();return;}
    fbDb.collection("users").doc(uid).collection("private").doc("data").get().then(function(doc){
      var u=adminUsersCache.find(function(x){return x.uid===uid;});
      if(u)u.privateData=doc.exists?doc.data():{};
      adminJsonView=uid;renderAdminTab();
    }).catch(function(err){console.error(err);alert(t().cloudError);});
  };});
  document.querySelectorAll("[data-adminDelUser]").forEach(function(b){b.onclick=function(){
    if(!confirm(t().adminDeleteConfirm))return;
    var uid=b.getAttribute("data-adminDelUser");
    fbDb.collection("users").doc(uid).collection("private").doc("data").set({declarations:[],updatedAt:new Date().toISOString()})
      .then(function(){adminLogEvent("Slettet private DoC-data for bruker "+uid);renderAdminTab();})
      .catch(function(err){console.error(err);alert(t().cloudError);});
  };});
  document.querySelectorAll("[data-adminDelShared]").forEach(function(b){b.onclick=function(){
    if(!confirm(state.lang==="no"?"Slette denne delte erklæringen?":"Delete this shared declaration?"))return;
    var id=b.getAttribute("data-adminDelShared");
    state.sharedDeclarations=state.sharedDeclarations.filter(function(x){return x.id!==id;});
    adminLogEvent("Slettet delt DoC "+id);
    renderAdminTab();
  };});
}

function bindDocEvents(){
  var d=t();
  var btnNewDoc=document.getElementById("btnNewDoc");
  if(btnNewDoc)btnNewDoc.onclick=function(){docResetWizard();state.docViewMode="wizard";renderDocTab();};
  var btnDocList=document.getElementById("btnDocList");
  if(btnDocList)btnDocList.onclick=function(){state.docViewMode="list";renderDocTab();};

  document.querySelectorAll("[data-docEdit]").forEach(function(b){b.onclick=function(){
    var parts=b.getAttribute("data-docEdit").split("|");
    var list=parts[0]==="shared"?state.sharedDeclarations:state.declarations;
    var decl=list.find(function(x){return x.id===parts[1];});
    if(!decl)return;
    docResetWizard();
    docWz.editingId=decl.id;docWz.editingList=parts[0];docWz.docNumber=decl.docNumber;docWz.directiveIds=decl.directiveIds.slice();docWz.standardIds=decl.standardIds.slice();
    docWz.details=Object.assign({},docWz.details,decl);
    docWz.step=3;
    state.docViewMode="wizard";renderDocTab();
  };});
  document.querySelectorAll("[data-docDup]").forEach(function(b){b.onclick=function(){
    var parts=b.getAttribute("data-docDup").split("|");
    var list=parts[0]==="shared"?state.sharedDeclarations:state.declarations;
    var decl=list.find(function(x){return x.id===parts[1];});
    if(!decl)return;
    docResetWizard();
    docWz.directiveIds=decl.directiveIds.slice();docWz.standardIds=decl.standardIds.slice();
    docWz.details=Object.assign({},docWz.details,decl,{id:undefined});
    docWz.step=3;
    state.docViewMode="wizard";renderDocTab();
  };});
  document.querySelectorAll("[data-docDel]").forEach(function(b){b.onclick=function(){
    if(!confirm(state.lang==="no"?"Slette denne erklæringen?":"Delete this declaration?"))return;
    var parts=b.getAttribute("data-docDel").split("|");
    if(parts[0]==="shared"){state.sharedDeclarations=state.sharedDeclarations.filter(function(x){return x.id!==parts[1];});}
    else{state.declarations=state.declarations.filter(function(x){return x.id!==parts[1];});}
    renderDocTab();
  };});
  document.querySelectorAll("[data-docShare]").forEach(function(b){b.onclick=function(){
    if(!confirm(t().docShareConfirm))return;
    var id=b.getAttribute("data-docShare");
    var decl=state.declarations.find(function(x){return x.id===id;});
    if(!decl)return;
    state.declarations=state.declarations.filter(function(x){return x.id!==id;});
    state.sharedDeclarations.push(decl);
    renderDocTab();
  };});

  var linkTag=document.getElementById("docLinkTag");
  if(linkTag)linkTag.onchange=function(){
    docWz.linkedTagId=linkTag.value;
    var tag=findTag(linkTag.value);
    if(tag&&tag.docCategory){
      docWz.categoryId=tag.docCategory;docWz.answers={};
      docWz.details.productName=tag.name;docWz.details.object=tag.tagNo+" – "+tag.name;
      docWz.step=2;
    }
    renderDocTab();
  };
  document.querySelectorAll("[data-docCat]").forEach(function(b){b.onclick=function(){
    docWz.categoryId=b.getAttribute("data-docCat");docWz.answers={};
    if(docWz.linkedTagId){
      var tag=findTag(docWz.linkedTagId);
      if(tag){docWz.details.productName=tag.name;docWz.details.object=tag.tagNo+" – "+tag.name;}
    }
    docWz.step=2;renderDocTab();
  };});

  document.querySelectorAll("[data-docBool]").forEach(function(b){b.onclick=function(){
    var parts=b.getAttribute("data-docBool").split("|");
    docWz.answers[parts[0]]=parts[1]==="1";
    renderDocTab();
  };});
  document.querySelectorAll("[data-docSelect]").forEach(function(sel){sel.onchange=function(){
    docWz.answers[sel.getAttribute("data-docSelect")]=sel.value;renderDocTab();
  };});
  var docBack2=document.getElementById("docBack2");
  if(docBack2)docBack2.onclick=function(){docWz.step=1;renderDocTab();};
  var docSuggestBtn=document.getElementById("docSuggestBtn");
  if(docSuggestBtn)docSuggestBtn.onclick=function(){
    var sug=docSuggestFor(docWz.categoryId,docWz.answers);
    docWz.directiveIds=sug.directiveIds;docWz.standardIds=sug.standardIds;
    docWz.step=3;renderDocTab();
  };

  document.querySelectorAll("[data-docDirToggle]").forEach(function(cb){cb.onchange=function(){
    var id=cb.getAttribute("data-docDirToggle");
    var idx=docWz.directiveIds.indexOf(id);
    if(cb.checked){if(idx<0)docWz.directiveIds.push(id);}else{if(idx>=0)docWz.directiveIds.splice(idx,1);}
  };});
  document.querySelectorAll("[data-docStdToggle]").forEach(function(cb){cb.onchange=function(){
    if(!cb.checked){
      var id=cb.getAttribute("data-docStdToggle");
      var idx=docWz.standardIds.indexOf(id);
      if(idx>=0)docWz.standardIds.splice(idx,1);
      renderDocTab();
    }
  };});
  document.querySelectorAll("[data-docStdAdd]").forEach(function(b){b.onclick=function(){
    var id=b.getAttribute("data-docStdAdd");
    if(docWz.standardIds.indexOf(id)<0)docWz.standardIds.push(id);
    docWz.addSearch="";renderDocTab();
  };});
  var docStdSearch=document.getElementById("docStdSearch");
  if(docStdSearch)docStdSearch.oninput=function(){docWz.addSearch=docStdSearch.value;renderDocTab();};

  var toggleAddDir=document.getElementById("docToggleAddDir");
  if(toggleAddDir)toggleAddDir.onclick=function(){docWz.showAddDirective=!docWz.showAddDirective;renderDocTab();};
  var addDirBtn=document.getElementById("docAddDirBtn");
  if(addDirBtn)addDirBtn.onclick=function(){
    var code=val("docNewDirCode"),name=val("docNewDirName");
    if(!code||!name)return;
    var id="custom-dir-"+uid();
    state.docCustom.directives.push({id:id,code:code,name:name});
    docWz.directiveIds.push(id);
    docWz.showAddDirective=false;docWz.newDirectiveCode="";docWz.newDirectiveName="";
    renderDocTab();
  };
  var toggleAddStd=document.getElementById("docToggleAddStd");
  if(toggleAddStd)toggleAddStd.onclick=function(){docWz.showAddStandard=!docWz.showAddStandard;renderDocTab();};
  var addStdBtn=document.getElementById("docAddStdBtn");
  if(addStdBtn)addStdBtn.onclick=function(){
    var code=val("docNewStdCode"),title=val("docNewStdTitle"),edition=val("docNewStdEdition");
    if(!code||!title)return;
    var id="custom-std-"+uid();
    state.docCustom.standards.push({id:id,code:code,title:title,edition:edition||"sjekk gjeldende utgave",lastVerified:"ikke verifisert"});
    docWz.standardIds.push(id);
    docWz.showAddStandard=false;docWz.newStandardCode="";docWz.newStandardTitle="";docWz.newStandardEdition="";
    renderDocTab();
  };
  var docBack3=document.getElementById("docBack3");
  if(docBack3)docBack3.onclick=function(){docWz.step=2;renderDocTab();};
  var docNext3=document.getElementById("docNext3");
  if(docNext3)docNext3.onclick=function(){docWz.step=4;renderDocTab();};

  var dropzone=document.getElementById("docLogoDropzone");
  var logoInput=document.getElementById("docLogoInput");
  function handleDocLogoFile(file){
    if(!file||file.type.indexOf("image/")!==0)return;
    var reader=new FileReader();
    reader.onload=function(e){docWz.details.logo=e.target.result;renderDocTab();};
    reader.readAsDataURL(file);
  }
  if(logoInput)logoInput.onchange=function(){if(logoInput.files&&logoInput.files[0])handleDocLogoFile(logoInput.files[0]);};
  if(dropzone){
    dropzone.onclick=function(e){if(e.target!==logoInput)logoInput.click();};
    dropzone.ondragover=function(e){e.preventDefault();dropzone.classList.add("dragover");};
    dropzone.ondragleave=function(){dropzone.classList.remove("dragover");};
    dropzone.ondrop=function(e){e.preventDefault();dropzone.classList.remove("dragover");if(e.dataTransfer.files&&e.dataTransfer.files[0])handleDocLogoFile(e.dataTransfer.files[0]);};
  }
  var removeLogo=document.getElementById("docRemoveLogo");
  if(removeLogo)removeLogo.onclick=function(){docWz.details.logo="";renderDocTab();};

  var idType=document.getElementById("docIdType");
  if(idType)idType.onchange=function(){docReadStep4Fields();docWz.details.idType=idType.value;renderDocTab();};
  var nbManual=document.getElementById("docNbManual");
  if(nbManual)nbManual.onchange=function(){docReadStep4Fields();docWz.details.nbManual=nbManual.checked;renderDocTab();};
  var docBack4=document.getElementById("docBack4");
  if(docBack4)docBack4.onclick=function(){docReadStep4Fields();docWz.step=3;renderDocTab();};
  var docNext4=document.getElementById("docNext4");
  if(docNext4)docNext4.onclick=function(){
    docReadStep4Fields();
    var nbSel=document.getElementById("docNbSelect");if(nbSel)docWz.details.notifiedBodyId=nbSel.value;
    docEnsureDocNumber(function(){docWz.step=5;renderDocTab();});
  };

  var langToggle=document.getElementById("docLangToggle");
  if(langToggle)langToggle.onchange=function(){docWz.lang=langToggle.value;renderDocTab();};
  var printBtn=document.getElementById("docPrintBtn");
  if(printBtn)printBtn.onclick=function(){
    var decl=docBuildDeclObj();
    var w=window.open("","_blank");
    w.document.write(docBuildPrintableHtml(decl,docWz.lang));
    w.document.close();w.focus();
    setTimeout(function(){w.print();},300);
  };
  var docBack5=document.getElementById("docBack5");
  if(docBack5)docBack5.onclick=function(){docWz.step=4;renderDocTab();};
  var docSaveBtn=document.getElementById("docSaveBtn");
  if(docSaveBtn)docSaveBtn.onclick=function(){
    var decl=docBuildDeclObj();
    var targetList=docWz.editingList==="shared"?state.sharedDeclarations:state.declarations;
    if(decl.id){
      var existing=targetList.find(function(x){return x.id===decl.id;});
      if(existing)Object.assign(existing,decl);
    } else {
      decl.id=uid();
      state.declarations.push(decl);
    }
    toast(t().docSavedDraft);
    state.docViewMode="list";renderDocTab();
  };
}

function renderLibrary(){
  var d=t();
  var html="";
  html+='<div class="row"><div style="margin:0;font-size:19px;font-weight:700;color:var(--ink) !important;-webkit-text-fill-color:var(--ink) !important">'+d.tabLibrary+'</div><button class="primary" id="btnNewTag">+ '+d.newTag+'</button></div>';

  if(state.editingTagId==="__new__"||( state.editingTagId && findTag(state.editingTagId))){
    html+=tagFormHtml(state.editingTagId==="__new__"?null:findTag(state.editingTagId));
  }

  if(state.tags.length>3){
    html+='<input id="librarySearch" placeholder="'+d.librarySearchPlaceholder+'" value="'+esc(state.librarySearch||"")+'" style="margin-bottom:10px">';
  }

  var q=(state.librarySearch||"").toLowerCase().trim();
  var visibleTags=q?state.tags.filter(function(tag){
    return [tag.name,tag.tagNo,tag.supplier,tag.spec].some(function(v){return v&&v.toLowerCase().indexOf(q)>=0;});
  }):state.tags;

  if(state.tags.length===0){
    html+=emptyStateHtml(d.emptyLibrary);
  } else if(visibleTags.length===0){
    html+=emptyStateHtml(d.librarySearchNoResults);
  } else {
    visibleTags.forEach(function(tag){
      html+='<div class="card">';
      html+='<div class="equip-header"><div class="row"><div>'+(tag.tagNo?'<span class="tagno">'+esc(tag.tagNo)+'</span>':'')+'<div style="margin-top:6px;font-weight:700;font-size:16px">'+esc(tag.name)+'</div>';
      if(tag.supplier)html+='<div class="muted">'+esc(tag.supplier)+(tag.spec?" · "+esc(tag.spec):"")+(tag.serialNumber?" · S/N "+esc(tag.serialNumber):"")+'</div>';
      html+='</div><div style="text-align:right;white-space:nowrap"><button class="ghost" data-datasheet="'+tag.id+'">'+d.btnDatasheet+'</button> <button class="ghost" data-editTag="'+tag.id+'">'+d.edit+'</button> <button class="danger-btn" data-delTag="'+tag.id+'">'+d.del+'</button></div></div></div>';

      html+='<div style="margin-top:10px"><div class="muted" style="font-weight:600">'+d.consumptionLines+'</div>';
      if(tag.lines.length===0){
        html+='<div class="muted" style="padding:6px 0">'+d.noLines+'</div>';
      } else {
        tag.lines.forEach(function(line){
          if(state.editingLineFor && state.editingLineFor.tagId===tag.id && state.editingLineFor.lineId===line.id){
            html+=lineFormHtml(tag,line);
          } else {
            var cdLib=consumptionDisplay(line,{min:line.min,normal:line.normal,max:line.max,unit:line.unit});
            html+='<div class="line-item"><div class="row"><div><span class="lt">'+esc(typeLabel(line.type))+'</span> · '+esc(contIntLabel(line.contInt))+' · '+cdLib.text+
              (line.mode?' · '+esc(modeLabel(line.mode)):'')+'</div><div style="white-space:nowrap"><button class="ghost" data-editLine="'+tag.id+'|'+line.id+'">'+d.edit+'</button> <button class="danger-btn" data-delLine="'+tag.id+'|'+line.id+'">'+d.del+'</button></div></div>'+
              (cdLib.detail?'<div class="muted">'+esc(cdLib.detail)+'</div>':(line.quality?'<div class="muted">'+esc(line.quality)+'</div>':''))+
              (line.type==="hyd"&&line.hydSystemType?'<div class="muted" style="font-size:10.5px">'+esc(hydSystemTypeShortLabel(line.hydSystemType))+'</div>':'')+'</div>';
          }
        });
      }
      if(state.addingLineForTag===tag.id){
        html+=lineFormHtml(tag,null);
      } else {
        html+='<button class="secondary" style="margin-top:8px" data-addLine="'+tag.id+'">+ '+d.addLine+'</button>';
      }
      html+='</div></div>';
    });
  }
  document.getElementById("tab-library").innerHTML=html;
  bindLibraryEvents();
}

function tagFormHtml(tag){

  return '<div class="formbox" id="tagForm">'+
    '<label>'+d.tagNo+'</label><input id="f_tagNo" value="'+esc(tag?tag.tagNo:"")+'">'+

    '<div><label>'+d.spec+'</label><input id="f_spec" value="'+esc(tag?tag.spec:"")+'"></div></div>'+
    fieldHint(d.hintSpec)+
    '<label>'+d.tagSerialNumber+'</label><input id="f_serialNumber" value="'+esc(tag?tag.serialNumber:"")+'">'+
    '<label style="display:flex;align-items:center;gap:8px;margin-top:2px;font-weight:400"><input type="checkbox" style="width:auto" id="f_showSerialOnDs"'+(tag&&tag.showSerialOnDatasheet?" checked":"")+'>'+d.showSerialOnDsLabel+'</label>'+
    '<div class="muted" style="margin-top:6px;font-weight:600">'+d.tagPhotosTitle+'</div>'+
    photoFieldHtml("productPhoto",d.photoProduct,tag)+

window.toggleElecFields=function(sel){
  var box=sel.closest(".formbox");
  var isElec=sel.value==="elec";
  var isHyd=sel.value==="hyd";
  var d=t();
  var ew=box.querySelector("#elecWrap"); if(ew)ew.style.display=isElec?"block":"none";
  var hw=box.querySelector("#hydWrap"); if(hw)hw.style.display=isHyd?"block":"none";
  var uw=box.querySelector("#unitWrap"); if(uw)uw.style.display=isElec?"none":"block";
  var al=box.querySelector("#amountLabel"); if(al)al.textContent=isElec?d.amountLabelElec:d.amountLabelGeneric;
};
window.updateHydSystemTypeHint=function(sel){
  var box=sel.closest(".formbox");
  var hint=box.querySelector("#hydSystemTypeHint");
  if(hint)hint.textContent=hydSystemTypeHint(sel.value);
};

window.applyPreset=function(sel){
  var box=sel.closest(".formbox");
  var d=t();
  var hint=box.querySelector("#presetHint");
  if(sel.value===""){if(hint)hint.textContent="";return;}
  var pr=COMPONENT_PRESETS[parseInt(sel.value,10)];
  if(!pr)return;
  var typeSel=box.querySelector("#fl_type");
  typeSel.value=pr.type;
  window.toggleElecFields(typeSel);
  if(pr.type==="elec"){
    var acdcSel=box.querySelector("#fl_acdc");if(acdcSel)acdcSel.value=pr.acdc||"ac";
    var phasesSel=box.querySelector("#fl_phases");if(phasesSel)phasesSel.value=pr.phases||"3";
    var voltInp=box.querySelector("#fl_voltage");if(voltInp&&pr.voltages)voltInp.value=pr.voltages[0];
    var freqInp=box.querySelector("#fl_freq");if(freqInp)freqInp.value=(pr.acdc==="dc")?"":(pr.freqs?pr.freqs[0]:"50");
  }
  var hints=[];
  if(pr.voltages&&pr.voltages.length>1)hints.push((state.lang==="no"?"Spenning: ":"Voltage: ")+pr.voltages.join("V, ")+"V");
  if(pr.freqs&&pr.freqs.length>1)hints.push((state.lang==="no"?"Frekvens: ":"Frequency: ")+pr.freqs.join("Hz, ")+"Hz");
  if(pr.note)hints.push(pr.note);
  if(hint)hint.textContent=hints.length?d.presetOtherValues+" "+hints.join(" · "):"";
};

function bindLibraryEvents(){
  var btnNew=document.getElementById("btnNewTag");
  var librarySearchInput=document.getElementById("librarySearch");
  if(librarySearchInput)librarySearchInput.oninput=function(){
    var cursorPos=librarySearchInput.selectionStart;
    state.librarySearch=librarySearchInput.value;
    renderLibrary();
    var newInput=document.getElementById("librarySearch");
    if(newInput){newInput.focus();newInput.setSelectionRange(cursorPos,cursorPos);}
  };

  if(btnNew)btnNew.onclick=function(){state.editingTagId="__new__";state.addingLineForTag=null;state.editingLineFor=null;state.newTagPhotos={productPhoto:"",nameplatePhoto:"",connectionsPhoto:"",certMark:""};state.newTagStandardIds=[];state.newTagDirectiveIds=[];state.tagStdSearch="";renderLibrary();};

  document.querySelectorAll("[data-editTag]").forEach(function(b){b.onclick=function(){state.editingTagId=b.getAttribute("data-editTag");renderLibrary();};});
  document.querySelectorAll("[data-datasheet]").forEach(function(b){b.onclick=function(){
    var tag=findTag(b.getAttribute("data-datasheet"));
    if(!tag)return;
    var w=window.open("","_blank");
    w.document.write(buildDatasheetPrintableHtml(tag));
    w.document.close();
    w.focus();
    setTimeout(function(){w.print();},300);
  };});
  document.querySelectorAll("[data-delTag]").forEach(function(b){b.onclick=function(){
    var id=b.getAttribute("data-delTag");
    if(confirm(state.lang==="no"?"Slette denne taggen?":"Delete this tag?")){
      state.tags=state.tags.filter(function(x){return x.id!==id;});
      state.projects.forEach(function(p){p.tagLinks=p.tagLinks.filter(function(l){return l.tagId!==id;});});
      renderLibrary();
    }
  };});

  document.querySelectorAll("[data-photoDropzone]").forEach(function(zone){
    var key=zone.getAttribute("data-photoDropzone");
    var input=zone.querySelector('[data-photoInput="'+key+'"]');
    function handlePhotoFile(file){
      if(!file||file.type.indexOf("image/")!==0)return;
      var reader=new FileReader();
      reader.onload=function(e){
        var editingId=state.editingTagId;
        var target=(editingId&&editingId!=="__new__")?findTag(editingId):state.newTagPhotos;
        if(target){target[key]=e.target.result;}
        renderLibrary();
      };
      reader.readAsDataURL(file);
    }
    zone.onclick=function(ev){if(ev.target!==input)input.click();};
    zone.ondragover=function(ev){ev.preventDefault();zone.classList.add("dragover");};
    zone.ondragleave=function(){zone.classList.remove("dragover");};
    zone.ondrop=function(ev){ev.preventDefault();zone.classList.remove("dragover");if(ev.dataTransfer.files&&ev.dataTransfer.files[0])handlePhotoFile(ev.dataTransfer.files[0]);};
    if(input)input.onchange=function(){if(input.files&&input.files[0])handlePhotoFile(input.files[0]);};
  });
  document.querySelectorAll("[data-removePhoto]").forEach(function(b){b.onclick=function(){
    var key=b.getAttribute("data-removePhoto");
    var editingId=state.editingTagId;
    var target=(editingId&&editingId!=="__new__")?findTag(editingId):state.newTagPhotos;
    if(target)target[key]="";
    renderLibrary();
  };});

  document.querySelectorAll("[data-tagDirToggle]").forEach(function(cb){cb.onchange=function(){
    var id=cb.getAttribute("data-tagDirToggle");
    var editingId=state.editingTagId;
    var arr;
    if(editingId&&editingId!=="__new__"){var tg=findTag(editingId);tg.directiveIds=tg.directiveIds||[];arr=tg.directiveIds;}
    else{state.newTagDirectiveIds=state.newTagDirectiveIds||[];arr=state.newTagDirectiveIds;}
    var idx=arr.indexOf(id);
    if(cb.checked){if(idx<0)arr.push(id);}else{if(idx>=0)arr.splice(idx,1);}
  };});
  document.querySelectorAll("[data-tagStdToggle]").forEach(function(cb){cb.onchange=function(){
    if(cb.checked)return;
    var id=cb.getAttribute("data-tagStdToggle");
    var editingId=state.editingTagId;
    var arr=(editingId&&editingId!=="__new__")?findTag(editingId).standardIds:state.newTagStandardIds;
    if(arr){var idx=arr.indexOf(id);if(idx>=0)arr.splice(idx,1);}
    renderLibrary();
  };});
  document.querySelectorAll("[data-tagStdAdd]").forEach(function(b){b.onclick=function(){
    var id=b.getAttribute("data-tagStdAdd");
    var editingId=state.editingTagId;
    if(editingId&&editingId!=="__new__"){
      var tg=findTag(editingId);
      tg.standardIds=tg.standardIds||[];
      if(tg.standardIds.indexOf(id)<0)tg.standardIds.push(id);
    } else {
      state.newTagStandardIds=state.newTagStandardIds||[];
      if(state.newTagStandardIds.indexOf(id)<0)state.newTagStandardIds.push(id);
    }
    state.tagStdSearch="";renderLibrary();
  };});
  var stdSearchInput=document.getElementById("f_stdSearch");
