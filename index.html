      assembly:val("f_assembly"),component:val("f_component"),discipline:val("f_discipline"),operatingMode:val("f_opMode"),
      location:val("f_location"),dataOwner:val("f_dataOwner"),remarks:val("f_remarks"),
      weight:val("f_weight"),dimensions:val("f_dimensions"),ipClass:val("f_ipClass"),tempRange:val("f_tempRange"),ambientTemp:val("f_ambientTemp"),envNotes:val("f_envNotes"),
      connections:val("f_connections"),materials:val("f_materials"),certifications:val("f_certifications"),serviceLife:val("f_serviceLife"),
      certMark:(id?(findTag(id)||{}).certMark:state.newTagPhotos.certMark)||"",
      tankCapacity:val("f_tankCapacity"),systemPressure:val("f_systemPressure"),systemFunction:val("f_systemFunction"),
      hydOutputNormal:val("f_hydOutputNormal"),hydOutputEOS:val("f_hydOutputEOS"),
      pipeInnerDiameter_mm:val("f_pipeID"),pipeOuterDiameter_mm:val("f_pipeOD"),pipeStandard:val("f_pipeStandard"),pipeLength_m:val("f_pipeLength"),
      productPhoto:(id?(findTag(id)||{}).productPhoto:state.newTagPhotos.productPhoto)||"",
      nameplatePhoto:(id?(findTag(id)||{}).nameplatePhoto:state.newTagPhotos.nameplatePhoto)||"",
      connectionsPhoto:(id?(findTag(id)||{}).connectionsPhoto:state.newTagPhotos.connectionsPhoto)||"",
      docCategory:val("f_docCategory"),
      directiveIds:(id?(findTag(id)||{directiveIds:[]}).directiveIds:state.newTagDirectiveIds)||[],
      standardIds:(id?(findTag(id)||{standardIds:[]}).standardIds:state.newTagStandardIds)||[]};

/* ---------- DOCUMENT ---------- */

function effLine(line,tl){
  var ov=(tl&&tl.overrides)||{};
  return {min:ov.min!==undefined?ov.min:line.min,normal:ov.normal!==undefined?ov.normal:line.normal,
    max:ov.max!==undefined?ov.max:line.max,unit:ov.unit!==undefined?ov.unit:line.unit,mode:ov.mode!==undefined?ov.mode:line.mode,
    voltage:ov.voltage!==undefined?ov.voltage:line.voltage,acdc:ov.acdc!==undefined?ov.acdc:line.acdc,
    phases:ov.phases!==undefined?ov.phases:line.phases,powerFactor:ov.powerFactor!==undefined?ov.powerFactor:line.powerFactor};
}

function fmtNum(n){if(n===null||n===undefined||n===""||isNaN(n))return "";return String(Math.round(n*100)/100);}

function exportFileBaseName(p){
  var base=(p.docNo||"").trim();
  base=base?base.replace(/[^a-zA-Z0-9\-_]+/g,"_"):"utility-consumption-data";
  if(p.revision&&p.revision.trim())base+="_Rev"+p.revision.trim().replace(/[^a-zA-Z0-9]+/g,"");
  return base;
}

function calcPower(line,eff){
  if(line.type!=="elec")return null;
  eff=eff||{};
  var V=parseFloat(eff.voltage!==undefined?eff.voltage:line.voltage);
  if(!V||isNaN(V))return null;
  var acdc=(eff.acdc!==undefined?eff.acdc:line.acdc)||"ac";
  var phases=(eff.phases!==undefined?eff.phases:line.phases)||"3";
  function num(x){var n=parseFloat(x);return isNaN(n)?null:n;}
  function calcOne(Iraw){
    var I=num(Iraw);
    if(I===null)return null;
    var s;
    if(acdc==="dc"){s=V*I;}
    else if(phases==="3"){s=Math.sqrt(3)*V*I;}
    else{s=V*I;}
    return s/1000;
  }
  var sMin=calcOne(eff.min),sNorm=calcOne(eff.normal),sMax=calcOne(eff.max);
  var pf=num(eff.powerFactor!==undefined?eff.powerFactor:line.powerFactor);
  function act(s){return (s!==null&&pf!==null)?s*pf:null;}
  var formula;
  if(acdc==="dc")formula="P = V × I";
  else if(phases==="3")formula="S = √3 × V × I"+(pf!==null?" ; P = S × cosφ":"");
  else formula="S = V × I"+(pf!==null?" ; P = S × cosφ":"");
  return {dc:acdc==="dc",phases:phases,s:{min:sMin,normal:sNorm,max:sMax},
    p:pf!==null?{min:act(sMin),normal:act(sNorm),max:act(sMax)}:null,pf:pf,formula:formula};
}

function consumptionDisplay(line,eff){
  var calc=calcPower(line,eff);
  if(calc){
    var unitLbl=calc.dc?"kW":"kVA";
    var text=fmtNum(calc.s.min)+" / "+fmtNum(calc.s.normal)+" / "+fmtNum(calc.s.max)+" "+unitLbl;
    if(calc.p)text+=" (P "+fmtNum(calc.p.min)+"/"+fmtNum(calc.p.normal)+"/"+fmtNum(calc.p.max)+" kW)";
    var detail=(eff.voltage!==undefined?eff.voltage:line.voltage)+"V"+(calc.dc?" DC":" AC "+(calc.phases==="3"?"3-fas":"1-fas"))+", "+
      (eff.normal||eff.max||eff.min||"")+"A"+(calc.pf!==null?", cosφ "+calc.pf:"")+" · "+calc.formula;
    return {text:text,detail:detail,calc:calc};
  }
  return {text:esc(eff.min)+" / "+esc(eff.normal)+" / "+esc(eff.max)+" "+esc(eff.unit),detail:null,calc:null};
}

function assemblySubtotal(p,tagsInGroup){
  var ids={};tagsInGroup.forEach(function(tg){ids[tg.id]=true;});
  var elecAC=0,elecDC=0,hyd=0,hydUnit="",any={ac:false,dc:false,hyd:false};
  p.tagLinks.forEach(function(tl){
    if(!ids[tl.tagId])return;
    var tag=findTag(tl.tagId);if(!tag)return;
    var line=findLine(tag,tl.lineId);if(!line)return;
    var eff=effLine(line,tl);
    if(line.type==="elec"){
      var calc=calcPower(line,eff);
      if(calc&&calc.s.max!==null){
        if(calc.dc){elecDC+=calc.s.max;any.dc=true;}else{elecAC+=calc.s.max;any.ac=true;}
      } else if(eff.max){
        var nE=parseFloat(eff.max);
        if(!isNaN(nE)){
          var uE=(eff.unit||"").toLowerCase();
          var kW=uE==="va"||uE==="w"?nE/1000:nE;
          if(line.acdc==="dc"){elecDC+=kW;any.dc=true;}else{elecAC+=kW;any.ac=true;}
        }
      }
    } else if(line.type==="hyd"&&eff.max){
      var n=parseFloat(eff.max);if(!isNaN(n)){hyd+=n;hydUnit=eff.unit;any.hyd=true;}
    }
  });
  return {elecAC:any.ac?elecAC:0,elecDC:any.dc?elecDC:0,hyd:any.hyd?hyd:0,hydUnit:hydUnit};
}

function nodeChildren(tree,parentId){return (tree||[]).filter(function(n){return n.parentId===parentId;});}

function subtreeTagLinks(p,nodeId){
  var ids={};
  function collect(id){ids[id]=true;nodeChildren(p.structureTree,id).forEach(function(c){collect(c.id);});}
  collect(nodeId);
  return p.tagLinks.filter(function(tl){return tl.structureNodeId&&ids[tl.structureNodeId];});
}

function nodeSubtotal(p,nodeId){
  var links=subtreeTagLinks(p,nodeId);
  var elecAC=0,elecDC=0,hyd=0,hydUnit="",any={ac:false,dc:false,hyd:false};
  links.forEach(function(tl){
    var tag=findTag(tl.tagId);if(!tag)return;
    var line=findLine(tag,tl.lineId);if(!line)return;
    var eff=effLine(line,tl);
    if(line.type==="elec"){
      var calc=calcPower(line,eff);
      if(calc&&calc.s.max!==null){if(calc.dc){elecDC+=calc.s.max;any.dc=true;}else{elecAC+=calc.s.max;any.ac=true;}}
      else if(eff.max){var n=parseFloat(eff.max);if(!isNaN(n)){var u=(eff.unit||"").toLowerCase();var kW=(u==="va"||u==="w")?n/1000:n;if(line.acdc==="dc"){elecDC+=kW;any.dc=true;}else{elecAC+=kW;any.ac=true;}}}
    } else if(line.type==="hyd"&&eff.max){
      var n2=parseFloat(eff.max);if(!isNaN(n2)){hyd+=n2;hydUnit=eff.unit;any.hyd=true;}
    }
  });
  return {elecAC:any.ac?elecAC:0,elecDC:any.dc?elecDC:0,hyd:any.hyd?hyd:0,hydUnit:hydUnit};
}

function nodePathLabel(nodeId,tree){

    path.unshift(current.name);
    current=current.parentId?byId[current.parentId]:null;
  }
  return path.join(" › ");
}

function bindStructureDragEvents(p,rerenderFn){
  var container=document.querySelector('[data-structContainer="'+p.id+'"]');
  if(!container)return;
  var dragId=null;
  function clearHighlights(){
    document.querySelectorAll(".drop-target").forEach(function(x){x.classList.remove("drop-target");});
  }
  function isDescendant(ancestorId,candidateId){
    var node=(p.structureTree||[]).find(function(n){return n.id===candidateId;});
    while(node){
      if(node.parentId===ancestorId)return true;
      node=(p.structureTree||[]).find(function(n){return n.id===node.parentId;});
    }
    return false;
  }
  container.querySelectorAll("[data-dragHandle]").forEach(function(h){
    h.onpointerdown=function(e){
      e.preventDefault();
      dragId=h.getAttribute("data-dragHandle");
      var el=container.querySelector('[data-nodeId="'+dragId+'"]');
      if(el)el.classList.add("dragging");
      try{h.setPointerCapture(e.pointerId);}catch(err){}
    };
  });
  var root=document.getElementById("tab-document")||document;
  root.onpointermove=function(e){
    if(!dragId)return;
    clearHighlights();
    var el=document.elementFromPoint(e.clientX,e.clientY);
    var dropEl=el&&el.closest?el.closest("[data-nodeId],[data-rootDrop]"):null;
    if(dropEl&&dropEl.getAttribute("data-nodeId")===dragId)dropEl=null;
    if(dropEl)dropEl.classList.add("drop-target");
  };
  root.onpointerup=function(e){
    if(!dragId)return;
    var draggedId=dragId;dragId=null;
    var el=document.elementFromPoint(e.clientX,e.clientY);
    var dropEl=el&&el.closest?el.closest("[data-nodeId],[data-rootDrop]"):null;
    clearHighlights();
    var draggingEl=container.querySelector('[data-nodeId="'+draggedId+'"]');
    if(draggingEl)draggingEl.classList.remove("dragging");
    if(!dropEl)return;
    var newParentId=dropEl.hasAttribute("data-rootDrop")?null:dropEl.getAttribute("data-nodeId");
    if(newParentId===draggedId)return;
    if(newParentId&&isDescendant(draggedId,newParentId)){alert(t().structCannotMoveIntoSelf);return;}
    var node=(p.structureTree||[]).find(function(n){return n.id===draggedId;});
    if(node&&node.parentId!==newParentId){node.parentId=newParentId;rerenderFn();}
  };
}

function loadCaseDemand(p,lc){
  var elecAC=0,elecDC=0,hyd=0,hydUnit="",any={ac:false,dc:false,hyd:false};
  p.tagLinks.forEach(function(tl){
    var tag=findTag(tl.tagId);if(!tag)return;
    var line=findLine(tag,tl.lineId);if(!line)return;
    var eff=effLine(line,tl);
    if(!lc.modes||!lc.modes[eff.mode])return;
    if(line.type==="elec"){
      var calc=calcPower(line,eff);
      if(calc&&calc.s.max!==null){if(calc.dc){elecDC+=calc.s.max;any.dc=true;}else{elecAC+=calc.s.max;any.ac=true;}}
      else if(eff.max){
        var nE2=parseFloat(eff.max);
        if(!isNaN(nE2)){
          var uE2=(eff.unit||"").toLowerCase();
          var kW2=uE2==="va"||uE2==="w"?nE2/1000:nE2;
          if(line.acdc==="dc"){elecDC+=kW2;any.dc=true;}else{elecAC+=kW2;any.ac=true;}
        }
      }
    } else if(line.type==="hyd"&&eff.max){
      var n=parseFloat(eff.max);if(!isNaN(n)){hyd+=n;hydUnit=eff.unit;any.hyd=true;}
    }
  });
  return {elecAC:any.ac?elecAC:0,elecDC:any.dc?elecDC:0,hyd:any.hyd?hyd:0,hydUnit:hydUnit};
}

function capacityDemand(p,utilRow){
  var total=0,unit="",any=false;
  p.tagLinks.forEach(function(tl){
    var tag=findTag(tl.tagId);if(!tag)return;
    var line=findLine(tag,tl.lineId);if(!line)return;
    var match=false;
    if(utilRow.utilName==="elecAC"&&line.type==="elec"&&line.acdc!=="dc")match=true;
    if(utilRow.utilName==="elecDC"&&line.type==="elec"&&line.acdc==="dc")match=true;
    if(utilRow.utilName==="hydOil"&&line.type==="hyd")match=true;
    if(utilRow.utilName==="coolWater"&&line.type==="cool")match=true;
    if(utilRow.utilName==="instrAir"&&line.type==="air")match=true;
    if(!match)return;
    var eff=effLine(line,tl);
    var calc=calcPower(line,eff);
    if(calc&&calc.s.max!==null){total+=calc.s.max;unit=calc.dc?"kW":"kVA";any=true;}
    else if(eff.max){var n=parseFloat(eff.max);if(!isNaN(n)){total+=n;unit=eff.unit;any=true;}}
  });
  return any?{total:total,unit:unit}:null;
}

      {key:"operatingMode",label:d.crOperatingMode,get:function(tag){return tag.operatingMode;}},

      {key:"dataOwner",label:d.crDataOwner,get:function(tag){return tag.dataOwner;}}
    ].filter(function(c){return c.always||crRows.some(function(tag){return c.get(tag);});});
    html+='<div style="font-weight:600;font-size:12px;margin-bottom:4px">'+d.regConsumerRegister+'</div>';
    html+='<table class="doc" style="font-size:9px;margin-bottom:14px"><thead><tr>'+crCols.map(function(c){return '<th>'+c.label+'</th>';}).join("")+'</tr></thead><tbody>';
    crRows.forEach(function(tag){
      html+='<tr>'+crCols.map(function(c){return '<td>'+esc(c.get(tag))+'</td>';}).join("")+'</tr>';
    });
    html+='</tbody></table>';
  }

  if(p.tagLinks.length===0){
    html+='<div class="muted">'+d.noRowsInDoc+'</div>';
  } else {
    html+='<div style="font-weight:600;font-size:12px;margin-bottom:4px">'+d.regRequiredConsumption+'</div>';
    html+='<table class="doc" style="table-layout:fixed;width:100%"><colgroup><col style="width:13%"><col style="width:14%"><col style="width:11%"><col style="width:17%"><col style="width:10%"><col style="width:17%"><col style="width:18%"></colgroup>';
    html+='<thead><tr><th>'+d.colTag+'</th><th>'+d.colType+'</th><th>'+d.colContInt+'</th><th>'+d.colConsumption+'</th><th>'+d.colMode+'</th><th>'+d.colQuality+'</th><th>'+d.colNotes+'</th></tr></thead><tbody>';
    p.tagLinks.forEach(function(tl){
      var tag=findTag(tl.tagId);if(!tag)return;
      var line=findLine(tag,tl.lineId);if(!line)return;
      var eff=effLine(line,tl);
      var cdDoc=consumptionDisplay(line,eff);
      var qualityCell=line.quality||"";
      if(cdDoc.detail)qualityCell=qualityCell?qualityCell+" · "+cdDoc.detail:cdDoc.detail;
      html+='<tr><td>'+esc(tag.tagNo)+'</td><td>'+esc(typeLabel(line.type))+'</td><td>'+esc(contIntLabel(line.contInt))+'</td><td>'+cdDoc.text+'</td><td>'+esc(modeLabel(eff.mode))+'</td><td>'+esc(qualityCell)+'</td><td>'+esc(line.notes)+'</td></tr>';
    });
    html+='</tbody></table>';
  }
  if(p.utilityRegister&&p.utilityRegister.length>0){
    html+='<div style="font-weight:600;font-size:12px;margin:10px 0 4px">'+d.regCapacitySummary+'</div>';
    html+='<table class="doc" style="font-size:9px;margin-bottom:14px"><thead><tr><th>'+d.utilId+'</th><th>'+d.utilName+'</th><th>'+d.capAvailable+'</th><th>'+d.capDemand+'</th><th>'+d.capMargin+'</th><th>'+d.regNotes+'</th></tr></thead><tbody>';
    var utilLbl2={elecDC:d.utilElecDC,elecAC:d.utilElecAC,hydOil:d.utilHydOil,coolWater:d.utilCoolWater,instrAir:d.utilInstrAir,nitrogen:d.utilNitrogen,other:d.utilOther};
    p.utilityRegister.forEach(function(u){
      var demand=capacityDemand(p,u);
      var avail=parseFloat(u.availCap);
      var demandTxt=demand?fmtNum(demand.total)+" "+demand.unit:d.capNoData;
      var marginTxt="";
      if(demand&&!isNaN(avail)){marginTxt=fmtNum(avail-demand.total)+" "+(u.capacityUnit||demand.unit);}
      html+='<tr><td>'+esc(u.utilId)+'</td><td>'+esc(utilLbl2[u.utilName]||u.utilName)+'</td><td>'+esc(u.availCap)+' '+esc(u.capacityUnit)+'</td><td>'+demandTxt+'</td><td>'+marginTxt+'</td><td>'+esc(u.remarks)+'</td></tr>';
    });
    html+='</tbody></table>';
  }

  if(p.loadCases&&p.loadCases.length>0){
    html+='<div style="font-weight:600;font-size:12px;margin:10px 0 4px">'+d.regLoadCases+'</div>';
    html+='<table class="doc" style="font-size:9px;margin-bottom:14px"><thead><tr><th>'+d.lcCaseId+'</th><th>'+d.lcName+'</th><th>'+d.lcModesIncluded+'</th><th>'+d.lcSumAC+'</th><th>'+d.lcSumDC+'</th><th>'+d.lcSumHyd+'</th><th>'+d.lcBasis+'</th></tr></thead><tbody>';
    p.loadCases.forEach(function(lc){

      html+='<tr><td>'+esc(lc.caseId)+'</td><td>'+esc(lc.name)+'</td><td>'+esc(modeNames)+'</td>'+

        '<td>'+(demand.elecDC?fmtNum(demand.elecDC)+" kW":"—")+'</td>'+
        '<td>'+(demand.hyd?fmtNum(demand.hyd)+" "+demand.hydUnit:"—")+'</td>'+
        '<td>'+esc(lc.basis)+'</td></tr>';
    });
    html+='</tbody></table>';
  }

  html+=registersDocHtml(p,d);


  return html;
}

function buildDocxDoc(p,d){
  var X=window.docx;
  function txt(s,opts){opts=opts||{};return new X.TextRun(Object.assign({text:String(s==null?"":s)},opts));}
  function para(children,opts){opts=opts||{};if(typeof children==="string")children=[txt(children)];return new X.Paragraph(Object.assign({children:children},opts));}
  function heading(text,level){return new X.Paragraph({text:text,heading:level,spacing:{before:200,after:100}});}
  function labelValue(label,value){return para([txt(label+": ",{bold:true}),txt(value||"—")]);}
  function cellText(v){return new X.TableCell({children:[para(String(v==null?"":v))],margins:{top:60,bottom:60,left:80,right:80}});}
  function headerCell(v){return new X.TableCell({shading:{fill:"EEF1F2"},children:[para([txt(v,{bold:true})])]},{margins:{top:60,bottom:60,left:80,right:80}});}
  function dataTable(headers,rows){
    var hdrRow=new X.TableRow({tableHeader:true,children:headers.map(headerCell)});
    var bodyRows=rows.map(function(r){return new X.TableRow({children:r.map(cellText)});});
    return new X.Table({width:{size:100,type:X.WidthType.PERCENTAGE},rows:[hdrRow].concat(bodyRows)});
  }

  var children=[];

  if(p.logoDataUrl){
    try{
      var b64=p.logoDataUrl.split(",")[1];
      var bin=atob(b64);var bytes=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      children.push(para([new X.ImageRun({data:bytes,transformation:{width:130,height:44}})]));
    }catch(e){}
  }
  children.push(heading(p.companyName||"—",X.HeadingLevel.HEADING_3));
  children.push(dataTable([d.docNo,d.revision,d.docDate,d.preparedBy],[[p.docNo,p.revision,p.docDate,p.preparedBy]]));
  children.push(heading(d.genTitle,X.HeadingLevel.TITLE));
  children.push(para(p.name+(p.customer?" · "+p.customer:"")));
  if(p.purpose)children.push(labelValue(d.docPurpose,p.purpose));
  if(p.description)children.push(labelValue(d.docDescription,p.description));
  if(p.supplier)children.push(labelValue(d.docSupplier,p.supplier));

  children.push(heading(d.regDefinitions,X.HeadingLevel.HEADING_2));
  children.push(labelValue(d.defUtility,d.defUtilityText));
  children.push(labelValue(d.defConsumer,d.defConsumerText));
  children.push(labelValue(d.defDisciplineOwner,d.defDisciplineOwnerText));

  if(p.sysCapacity||p.sysMaxLoad||p.sysChar){
    children.push(heading(d.systemLevel,X.HeadingLevel.HEADING_2));
    if(p.sysCapacity)children.push(labelValue(d.sysCapacity,p.sysCapacity));
    if(p.sysMaxLoad)children.push(labelValue(d.sysMaxLoad,p.sysMaxLoad));
    if(p.sysChar)children.push(labelValue(d.sysChar,p.sysChar));
  }

  if((p.structureTree||[]).length){
    children.push(heading(d.regProductStructure,X.HeadingLevel.HEADING_2));
    (function walk(parentId,depth){
      nodeChildren(p.structureTree,parentId).forEach(function(node){
        children.push(para([txt(node.name,{bold:true})],{indent:{left:depth*300}}));
        var seenT={};
        p.tagLinks.filter(function(tl){return tl.structureNodeId===node.id;}).forEach(function(tl){
          var tag=findTag(tl.tagId);if(!tag||seenT[tag.id])return;seenT[tag.id]=true;
          children.push(para("• "+tag.tagNo+" ("+(tag.component||tag.name)+")",{indent:{left:depth*300+300}}));
        });
        var sub=nodeSubtotal(p,node.id);
        var subParts=[];
        if(sub.elecAC)subParts.push("AC: "+fmtNum(sub.elecAC)+" kVA");
        if(sub.elecDC)subParts.push("DC: "+fmtNum(sub.elecDC)+" kW");
        if(sub.hyd)subParts.push("Hyd: "+fmtNum(sub.hyd)+" "+sub.hydUnit);
        if(subParts.length)children.push(para("Σ "+subParts.join(" · "),{indent:{left:depth*300+300}}));
        walk(node.id,depth+1);
      });
    })(null,0);
  }

  if(p.tagLinks.length>0){
    var seenTags={};var crRows=[];
    p.tagLinks.forEach(function(tl){var tag=findTag(tl.tagId);if(tag&&!seenTags[tag.id]){seenTags[tag.id]=true;crRows.push(tag);}});
    children.push(heading(d.regConsumerRegister,X.HeadingLevel.HEADING_2));
    children.push(dataTable([d.colTag,d.tagName,d.crAssembly,d.crComponent,d.crDiscipline,d.crOperatingMode,d.crLocation,d.crDataOwner],
      crRows.map(function(tag){return [tag.tagNo,tag.name,tag.assembly,tag.component,tag.discipline,tag.operatingMode,tag.location,tag.dataOwner];})));

    children.push(heading(d.regRequiredConsumption,X.HeadingLevel.HEADING_2));
    var consRows=[];
    p.tagLinks.forEach(function(tl){
      var tag=findTag(tl.tagId);if(!tag)return;
      var line=findLine(tag,tl.lineId);if(!line)return;
      var eff=effLine(line,tl);var cd=consumptionDisplay(line,eff);
      var qualityCell=line.quality||"";if(cd.detail)qualityCell=qualityCell?qualityCell+" · "+cd.detail:cd.detail;
      consRows.push([tag.tagNo,typeLabel(line.type),contIntLabel(line.contInt),cd.text,modeLabel(eff.mode),qualityCell,line.notes]);
    });
    children.push(dataTable([d.colTag,d.colType,d.colContInt,d.colConsumption,d.colMode,d.colQuality,d.colNotes],consRows));
  }

  if(p.utilityRegister&&p.utilityRegister.length>0){
    children.push(heading(d.regCapacitySummary,X.HeadingLevel.HEADING_2));
    var utilLbl2={elecDC:d.utilElecDC,elecAC:d.utilElecAC,hydOil:d.utilHydOil,coolWater:d.utilCoolWater,instrAir:d.utilInstrAir,nitrogen:d.utilNitrogen,other:d.utilOther};
    var capRows=p.utilityRegister.map(function(u){
      var demand=capacityDemand(p,u);
      var avail=parseFloat(u.availCap);
      var demandTxt=demand?fmtNum(demand.total)+" "+demand.unit:d.capNoData;
      var marginTxt="";if(demand&&!isNaN(avail))marginTxt=fmtNum(avail-demand.total)+" "+(u.capacityUnit||demand.unit);
      return [u.utilId,utilLbl2[u.utilName]||u.utilName,(u.availCap||"")+" "+(u.capacityUnit||""),demandTxt,marginTxt,u.remarks];
    });
    children.push(dataTable([d.utilId,d.utilName,d.capAvailable,d.capDemand,d.capMargin,d.regNotes],capRows));
  }

  if(p.loadCases&&p.loadCases.length>0){
    children.push(heading(d.regLoadCases,X.HeadingLevel.HEADING_2));
    var lcRows=p.loadCases.map(function(lc){
      var demand=loadCaseDemand(p,lc);
      var modeNames=lcModeNames(lc);
      return [lc.caseId,lc.name,modeNames,demand.elecAC?fmtNum(demand.elecAC)+" kVA":"—",demand.elecDC?fmtNum(demand.elecDC)+" kW":"—",demand.hyd?fmtNum(demand.hyd)+" "+demand.hydUnit:"—",lc.basis];
    });
    children.push(dataTable([d.lcCaseId,d.lcName,d.lcModesIncluded,d.lcSumAC,d.lcSumDC,d.lcSumHyd,d.lcBasis],lcRows));
  }

  ["operatingModes","products","utilityRegister","utilityRequirements","assumptions","openItems","references","revisions","dataQuality"].forEach(function(key){
    var cfg=regCfg(key);
    var rows=p[key]||[];
    if(rows.length===0)return;
    children.push(heading(cfg.title,X.HeadingLevel.HEADING_2));
    var headers=cfg.fields.map(function(f){return f.label;});
    var dataRows=rows.map(function(row){return cfg.fields.map(function(f){var v=row[f.k]||"";return f.type==="select"?f.optLabel(v):v;});});
    children.push(dataTable(headers,dataRows));
  });




  return new X.Document({sections:[{properties:{},children:children}]});
}

      (tag.ipClass?'<tr><td style="font-weight:600">'+d.ipClass+'</td><td>'+esc(tag.ipClass)+'</td></tr>':'')+

      tag.directiveIds.map(function(id){
        var dir=docFindDirective(id);
        if(!dir)return"";
        return '<tr><td style="font-weight:600;width:35%">'+esc(dir.code)+'</td><td>'+esc(dir.name)+'</td></tr>';
      }).join("")+
      '</tbody></table>';
  }

  if(tag.standardIds&&tag.standardIds.length){
    html+='<div style="font-weight:600;font-size:12px;margin:10px 0 4px">'+d.dsStandards+'</div>';
    html+='<table class="doc" style="margin-bottom:14px"><thead><tr><th>'+d.colStdCode+'</th><th>'+d.colStdTitle+'</th><th>'+d.docEdition+'</th></tr></thead><tbody>'+
      tag.standardIds.map(function(id){

  var otherLines=tag.lines.filter(function(l){return l.type!=="elec"&&l.type!=="hyd";});

  function linesTable(lines,title){
    var out='<div style="font-weight:600;font-size:12px;margin:10px 0 4px">'+title+'</div>';
    out+='<table class="doc"><thead><tr><th>'+d.colType+'</th><th>'+d.colContInt+'</th><th>'+d.colConsumption+'</th><th>'+d.colMode+'</th><th>'+d.colQuality+'</th><th>'+d.colNotes+'</th></tr></thead><tbody>';

      out+='<tr><td>'+esc(typeLabel(line.type))+'</td><td>'+esc(contIntLabel(line.contInt))+'</td><td>'+cd.text+'</td><td>'+esc(modeLabel(line.mode))+'</td><td>'+esc(qualityCell)+'</td><td>'+esc(line.notes)+'</td></tr>';
    });
    out+='</tbody></table>';
    return out;
  }

  if(elecLines.length)html+=linesTable(elecLines,d.dsElectrical);
  if(hydLines.length)html+=linesTable(hydLines,d.dsHydraulic);
  if(otherLines.length)html+=linesTable(otherLines,d.dsOtherUtil);

  if(tag.notes)html+='<div style="margin-top:10px;font-size:11px"><b>'+d.tagNotes+':</b> '+esc(tag.notes)+'</div>';

  return html;
}

function buildDatasheetPrintableHtml(tag,sessionInfo){

function toast(msg){

    el=document.createElement("div");

function bindDocumentEvents(){
  var sel=document.getElementById("docProject");
  if(sel)sel.onchange=function(){state.docProjectId=sel.value||null;renderDocument();};

  var saveInfoBtn=document.getElementById("saveDocInfo");
  if(saveInfoBtn)saveInfoBtn.onclick=function(){
    var p=findProject(state.docProjectId);
    p.companyName=val("fd_company");p.docNo=val("fd_docNo");p.revision=val("fd_rev");p.docDate=val("fd_date");p.preparedBy=val("fd_prep");
    p.supplier=val("fd_supplier");p.purpose=val("fd_purpose");p.description=val("fd_description");
    toast(t().saved);
    renderDocument();
  };

  function handleLogoFile(p,file){
    if(!file||file.type.indexOf("image/")!==0)return;
    var reader=new FileReader();
    reader.onload=function(e){p.logoDataUrl=e.target.result;renderDocument();};
    reader.readAsDataURL(file);
  }

  var logoInput=document.getElementById("fd_logo");
  if(logoInput)logoInput.onchange=function(){
    var p=findProject(state.docProjectId);
    if(logoInput.files&&logoInput.files[0])handleLogoFile(p,logoInput.files[0]);
  };
  var removeLogoBtn=document.getElementById("removeLogo");
  if(removeLogoBtn)removeLogoBtn.onclick=function(){
    var p=findProject(state.docProjectId);
    p.logoDataUrl="";renderDocument();
  };
  var dropzone=document.getElementById("logoDropzone");
  if(dropzone){
    dropzone.onclick=function(e){if(e.target!==logoInput)logoInput.click();};
    dropzone.ondragover=function(e){e.preventDefault();dropzone.classList.add("dragover");};
    dropzone.ondragleave=function(){dropzone.classList.remove("dragover");};
    dropzone.ondrop=function(e){
      e.preventDefault();dropzone.classList.remove("dragover");
      var p=findProject(state.docProjectId);
      if(e.dataTransfer.files&&e.dataTransfer.files[0])handleLogoFile(p,e.dataTransfer.files[0]);
    };
  }

  bindRegisterEvents(renderDocument);
  bindLoadCaseEvents(renderDocument);
  bindStructureEvents(renderDocument);
  var pForDrag=findProject(state.docProjectId);
  if(pForDrag)bindStructureDragEvents(pForDrag,renderDocument);

  var pdfBtn=document.getElementById("btnExportPdf");
  if(pdfBtn)pdfBtn.onclick=function(){
    var p=findProject(state.docProjectId);
    if(!p)return;
    var w=window.open("","_blank");
    w.document.write(buildPrintableHtml(p));
    w.document.close();
    w.focus();
    setTimeout(function(){w.print();},300);
  };

  var wordBtn=document.getElementById("btnExportWord");
  if(wordBtn)wordBtn.onclick=function(){
    var p=findProject(state.docProjectId);
    if(!p)return;
    var d=t();
    function fallbackDoc(){
      var html=buildPrintableHtml(p).replace("<html>","<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>");
      var blob=new Blob(['\ufeff',html],{type:"application/msword"});
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download=exportFileBaseName(p)+".doc";
      document.body.appendChild(a);a.click();document.body.removeChild(a);
    }
    if(!window.docx||!window.docx.Document){
      alert(state.lang==="no"?"Kunne ikke laste docx-biblioteket (ingen nett?) — laster ned HTML-basert .doc i stedet.":"Could not load the docx library (no internet?) — downloading HTML-based .doc instead.");
      fallbackDoc();return;
    }
    try{
      var doc=buildDocxDoc(p,d);
      window.docx.Packer.toBlob(doc).then(function(blob){
        var a=document.createElement("a");
        a.href=URL.createObjectURL(blob);
        a.download=exportFileBaseName(p)+".docx";
        document.body.appendChild(a);a.click();document.body.removeChild(a);
      }).catch(function(err){
        console.error(err);
        alert(state.lang==="no"?"Feil under generering av .docx — laster ned HTML-basert .doc i stedet.":"Error generating .docx — downloading HTML-based .doc instead.");
        fallbackDoc();
      });
    }catch(err){
      console.error(err);
      fallbackDoc();
    }
  };

  var xlsBtn=document.getElementById("btnExportExcel");
  if(xlsBtn)xlsBtn.onclick=function(){
    var d=t();
    var p=findProject(state.docProjectId);
    if(!p)return;
    var wb=XLSX.utils.book_new();
    function addSheet(name,rows){
      var ws=XLSX.utils.aoa_to_sheet(rows);
      XLSX.utils.book_append_sheet(wb,ws,name.substring(0,31));
    }

    addSheet("Dokumentinfo",[
      [d.companyName,p.companyName||""],
      [d.docNo,p.docNo||""],[d.revision,p.revision||""],[d.docDate,p.docDate||""],[d.preparedBy,p.preparedBy||""],
      [d.docSupplier,p.supplier||""],[d.docPurpose,p.purpose||""],[d.docDescription,p.description||""],
      [d.sysCapacity,p.sysCapacity||""],[d.sysMaxLoad,p.sysMaxLoad||""],[d.sysChar,p.sysChar||""]
    ]);

    if((p.structureTree||[]).length){
      var psRows=[[d.structNodeName,"Level","Tags"]];
      (function walk(parentId,depth){
        nodeChildren(p.structureTree,parentId).forEach(function(node){
          var tagNames=[];var seenT={};
          p.tagLinks.filter(function(tl){return tl.structureNodeId===node.id;}).forEach(function(tl){
            var tag=findTag(tl.tagId);if(tag&&!seenT[tag.id]){seenT[tag.id]=true;tagNames.push(tag.tagNo);}
          });
          psRows.push([new Array(depth+1).join("  ")+node.name,depth,tagNames.join(", ")]);
          walk(node.id,depth+1);
        });
      })(null,0);
      addSheet(d.regProductStructure,psRows);
    }

    var seenCR={};var crRows=[[d.colTag,d.tagName,d.crAssembly,d.crComponent,d.crDiscipline,d.crOperatingMode,d.crLocation,d.crDataOwner]];
    p.tagLinks.forEach(function(tl){var tag=findTag(tl.tagId);if(tag&&!seenCR[tag.id]){seenCR[tag.id]=true;crRows.push([tag.tagNo,tag.name,tag.assembly,tag.component,tag.discipline,tag.operatingMode,tag.location,tag.dataOwner]);}});
    if(crRows.length>1)addSheet(d.regConsumerRegister,crRows);

    var consRows=[[d.colTag,d.colType,d.colContInt,d.colMin,d.colNormal,d.colMax,d.colUnit,d.colMode,
      d.acdc,d.phases,d.voltage,"S min","S normal","S maks","S enhet","P min","P normal","P maks","Formel",d.colQuality,d.colNotes]];
    p.tagLinks.forEach(function(tl){
      var tag=findTag(tl.tagId);if(!tag)return;
      var line=findLine(tag,tl.lineId);if(!line)return;
      var eff=effLine(line,tl);
      var calc=calcPower(line,eff);
      consRows.push([tag.tagNo,typeLabel(line.type),contIntLabel(line.contInt),eff.min,eff.normal,eff.max,eff.unit,modeLabel(eff.mode),
        line.type==="elec"?(line.acdc||""):"",line.type==="elec"&&line.acdc!=="dc"?(line.phases||""):"",line.type==="elec"?(line.voltage||""):"",
        calc?fmtNum(calc.s.min):"",calc?fmtNum(calc.s.normal):"",calc?fmtNum(calc.s.max):"",calc?(calc.dc?"kW":"kVA"):"",
        calc&&calc.p?fmtNum(calc.p.min):"",calc&&calc.p?fmtNum(calc.p.normal):"",calc&&calc.p?fmtNum(calc.p.max):"",
        calc?calc.formula:"",line.quality,line.notes]);
    });
    addSheet(d.regRequiredConsumption,consRows);

    if(p.utilityRegister&&p.utilityRegister.length>0){
      var utilLbl2={elecDC:d.utilElecDC,elecAC:d.utilElecAC,hydOil:d.utilHydOil,coolWater:d.utilCoolWater,instrAir:d.utilInstrAir,nitrogen:d.utilNitrogen,other:d.utilOther};
      var capRows=[[d.utilId,d.utilName,d.capAvailable,d.capDemand,d.capMargin,d.regNotes]];
      p.utilityRegister.forEach(function(u){
        var demand=capacityDemand(p,u);
        var avail=parseFloat(u.availCap);
        var demandTxt=demand?fmtNum(demand.total)+" "+demand.unit:d.capNoData;
        var marginTxt="";if(demand&&!isNaN(avail))marginTxt=fmtNum(avail-demand.total)+" "+(u.capacityUnit||demand.unit);
        capRows.push([u.utilId,utilLbl2[u.utilName]||u.utilName,(u.availCap||"")+" "+(u.capacityUnit||""),demandTxt,marginTxt,u.remarks]);
      });
      addSheet(d.regCapacitySummary,capRows);
    }

    if(p.loadCases&&p.loadCases.length>0){
      var lcRows=[[d.lcCaseId,d.lcName,d.regDescription,d.lcModesIncluded,d.lcSumAC,d.lcSumDC,d.lcSumHyd,d.lcBasis]];
      p.loadCases.forEach(function(lc){
        var demand=loadCaseDemand(p,lc);
        var modeNames=lcModeNames(lc);
        lcRows.push([lc.caseId,lc.name,lc.description,modeNames,demand.elecAC?fmtNum(demand.elecAC)+" kVA":"",demand.elecDC?fmtNum(demand.elecDC)+" kW":"",demand.hyd?fmtNum(demand.hyd)+" "+demand.hydUnit:"",lc.basis]);
      });
      addSheet(d.regLoadCases,lcRows);
    }

    ["operatingModes","products","utilityRegister","utilityRequirements","assumptions","openItems","references","revisions","dataQuality"].forEach(function(key){
      var cfg=regCfg(key);
      var rows=p[key]||[];
      if(rows.length===0)return;
      var headers=cfg.fields.map(function(f){return f.label;});
      var dataRows=rows.map(function(row){return cfg.fields.map(function(f){var v=row[f.k]||"";return f.type==="select"?f.optLabel(v):v;});});
      addSheet(cfg.title,[headers].concat(dataRows));
    });

    XLSX.writeFile(wb,exportFileBaseName(p)+".xlsx");
  };
}

function mergeIncomingData(payload){
  var summary={tags:0,projects:0,declarations:0,sharedDeclarations:0,directives:0,standards:0,notifiedBodies:0,skipped:0};

  function mergeByKey(localArr,incomingArr,keyFn){
    if(!Array.isArray(incomingArr))return 0;
    var existingKeys={};
    localArr.forEach(function(item){existingKeys[keyFn(item)]=true;});
    var added=0;
    incomingArr.forEach(function(item){
      var k=keyFn(item);
      if(!k||existingKeys[k])return;
      localArr.push(item);
      existingKeys[k]=true;
      added++;
    });
    return added;
  }

  summary.tags=mergeByKey(state.tags,payload.tags,function(x){return x.tagNo;});
  summary.projects=mergeByKey(state.projects,payload.projects,function(x){return x.docNo;});
  summary.declarations=mergeByKey(state.declarations,payload.declarations,function(x){return x.docNumber;});
  summary.sharedDeclarations=mergeByKey(state.sharedDeclarations,payload.sharedDeclarations,function(x){return x.docNumber;});
  if(payload.docCustom){
    summary.directives=mergeByKey(state.docCustom.directives,payload.docCustom.directives,function(x){return x.code;});
    summary.standards=mergeByKey(state.docCustom.standards,payload.docCustom.standards,function(x){return x.code;});
    summary.notifiedBodies=mergeByKey(state.docCustom.notifiedBodies,payload.docCustom.notifiedBodies,function(x){return x.name+"|"+x.ref;});
  }
  if(payload.hydComponentLossLibrary){
    summary.hydComponents=mergeByKey(state.hydComponentLossLibrary,payload.hydComponentLossLibrary,function(x){return (x.manufacturer||"")+"|"+(x.model||"")+"|"+(x.partNumber||"");});
  }
  if(payload.hydFluidLibrary){
    summary.hydFluids=mergeByKey(state.hydFluidLibrary,payload.hydFluidLibrary,function(x){return (x.manufacturer||"")+"|"+(x.productName||"")+"|"+(x.isoVgGrade||"");});
  }
  return summary;
}

function mergeSummaryText(s,d){
  var parts=[];
  if(s.tags)parts.push(s.tags+" "+d.mergeTags);
  if(s.projects)parts.push(s.projects+" "+d.mergeProjects);
  if(s.declarations)parts.push(s.declarations+" "+d.mergeDeclarations);
  if(s.sharedDeclarations)parts.push(s.sharedDeclarations+" "+d.mergeShared);
  if(s.directives)parts.push(s.directives+" "+d.mergeDirectives);
  if(s.standards)parts.push(s.standards+" "+d.mergeStandards);
  if(s.notifiedBodies)parts.push(s.notifiedBodies+" "+d.mergeNb);
  if(s.hydComponents)parts.push(s.hydComponents+" "+d.mergeHydComponents);
  if(s.hydFluids)parts.push(s.hydFluids+" "+d.mergeHydFluids);
  return parts.length?d.mergeDone+"\n\n"+parts.join("\n"):d.mergeNothing;
}

function autoBackupBeforeReplace(){
  try{
    var payload={version:1,backupType:"auto-before-replace",exportedAt:new Date().toISOString(),tags:state.tags,projects:state.projects,declarations:state.declarations,sharedDeclarations:state.sharedDeclarations,docCustom:state.docCustom,hydComponentLossLibrary:state.hydComponentLossLibrary,hydFluidLibrary:state.hydFluidLibrary};
    var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    var d=new Date();
    var stamp=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+"_"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0");
    a.download="utility-hub-sikkerhetskopi-"+stamp+".json";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  }catch(e){console.error("Auto-backup failed",e);}
}

function importProjectDataFile(file){
  var d=t();
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var payload=JSON.parse(e.target.result);
      if(!payload||!Array.isArray(payload.tags)||!Array.isArray(payload.projects))throw new Error("bad shape");
      autoBackupBeforeReplace();
      state.tags=payload.tags;
      state.projects=payload.projects;
      state.declarations=Array.isArray(payload.declarations)?payload.declarations:[];
      state.sharedDeclarations=Array.isArray(payload.sharedDeclarations)?payload.sharedDeclarations:[];
      state.docCustom=payload.docCustom&&typeof payload.docCustom==="object"?payload.docCustom:{directives:[],standards:[],notifiedBodies:[]};
      state.hydComponentLossLibrary=Array.isArray(payload.hydComponentLossLibrary)?payload.hydComponentLossLibrary:(state.hydComponentLossLibrary||[]);
    state.hydFluidLibrary=Array.isArray(payload.hydFluidLibrary)?payload.hydFluidLibrary:(state.hydFluidLibrary||[]);
      state.editingTagId=null;state.addingLineForTag=null;state.editingLineFor=null;
      state.expandedProject=null;state.registerAdding=null;state.lcAdding=null;
      state.docProjectId=state.projects.length?state.projects[0].id:null;
      renderShell();renderActiveTab();
      toast(d.openDataSuccess);
    }catch(err){
      alert(d.openDataError);
    }
  };
  reader.readAsText(file);
}

/* ---------- LOCAL AUTOSAVE (survives page refresh, separate from cloud sync) ---------- */

var LOCAL_AUTOSAVE_KEY="uh_autosave_v1";

function autosaveToLocal(){
  try{
    var payload={tags:state.tags,projects:state.projects,declarations:state.declarations,sharedDeclarations:state.sharedDeclarations,docCustom:state.docCustom,hydComponentLossLibrary:state.hydComponentLossLibrary,hydFluidLibrary:state.hydFluidLibrary,savedAt:new Date().toISOString()};
    localStorage.setItem(LOCAL_AUTOSAVE_KEY,JSON.stringify(payload));
  }catch(e){
    console.error("Local autosave failed (storage full or unavailable):",e);
  }
}

function restoreFromLocalAutosave(){
  try{
    var raw=localStorage.getItem(LOCAL_AUTOSAVE_KEY);
    if(!raw)return;
    var payload=JSON.parse(raw);
    if(!payload||!Array.isArray(payload.tags)||!Array.isArray(payload.projects))return;
    state.tags=payload.tags;
    state.projects=payload.projects;
    state.declarations=Array.isArray(payload.declarations)?payload.declarations:[];
    state.sharedDeclarations=Array.isArray(payload.sharedDeclarations)?payload.sharedDeclarations:[];
    state.docCustom=payload.docCustom&&typeof payload.docCustom==="object"?payload.docCustom:{directives:[],standards:[],notifiedBodies:[]};
      state.hydComponentLossLibrary=Array.isArray(payload.hydComponentLossLibrary)?payload.hydComponentLossLibrary:(state.hydComponentLossLibrary||[]);
    state.hydFluidLibrary=Array.isArray(payload.hydFluidLibrary)?payload.hydFluidLibrary:(state.hydFluidLibrary||[]);
  }catch(e){
    console.error("Local autosave restore failed:",e);
  }
}
