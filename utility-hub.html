<style>
  :root{
    --bg:#EEF1F2; --panel:#FFFFFF; --ink:#1B2733; --ink-soft:#5C6B77;
    --line:#D8DEE2; --accent:#0078FF; --accent-dark:#0052CC; --accent-bg:#E4F0FF;
    --good:#3E7C59; --good-bg:#E6F0EA; --danger:#B3432B; --danger-bg:#F7E5DF;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --topbar-bg:linear-gradient(135deg,#FFFFFF,#F3F6FA 65%,#EEF3FA);
    --topbar-text:#0B1020; --topbar-text-soft:#5C6B77;
    --topbar-tab-inactive:#5C6B77; --topbar-tab-active:#0B1020; --topbar-tab-hover:#1B2733;
    --topbar-btn-bg:#FFFFFF; --topbar-btn-border:#D8DEE2; --topbar-btn-text:#1B2733; --topbar-btn-bg-hover:#F3F6FA;
    --topbar-shadow:0 1px 3px rgba(11,16,32,.08);
    --topbar-badge-local-bg:#EEF1F2; --topbar-badge-local-text:#5C6B77; --topbar-badge-local-border:#D8DEE2;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;}
  header.topbar{background:var(--topbar-bg);padding:16px 16px 0;position:sticky;top:0;z-index:10;box-shadow:var(--topbar-shadow);transition:background .2s;}
  .brand{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px;max-width:820px;margin:0 auto;}
  .brand svg{display:block;}
  .brand .uh-word{font-weight:800;color:var(--topbar-text);letter-spacing:.2px;}
  #taglineText{color:var(--topbar-text-soft);}
  .brand .uh-word span{background:linear-gradient(90deg,#4FC3FF,#0052CC);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand span{color:var(--accent-dark);font-weight:600;}
  .brand small{font-weight:400;color:var(--ink-soft);font-size:12px;margin-left:4px;}
  nav.tabs{display:flex;gap:4px;margin:14px auto 0;max-width:820px;border-bottom:1px solid var(--topbar-btn-border);}
  nav.tabs button{background:none;border:none;padding:9px 10px;font-size:13px;font-weight:600;color:var(--topbar-tab-inactive);cursor:pointer;border-bottom:2px solid transparent;font-family:var(--sans);transition:color .15s;}
  nav.tabs button.active{color:var(--topbar-tab-active);border-image:linear-gradient(90deg,#4FC3FF,#0052CC) 1;border-bottom-width:2px;border-bottom-style:solid;}
  nav.tabs button:hover:not(.active){color:var(--topbar-tab-hover);}
  .langrow{display:flex;justify-content:flex-end;margin:8px auto 0;max-width:820px;flex-wrap:wrap;gap:6px;padding-bottom:14px;}
  header.topbar button.secondary,header.topbar #langToggle{background:var(--topbar-btn-bg);border:1px solid var(--topbar-btn-border);color:var(--topbar-btn-text);}
  header.topbar button.secondary:hover,header.topbar #langToggle:hover{background:var(--topbar-btn-bg-hover);}
  #langToggle{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  main{padding:14px 12px 60px;max-width:820px;margin:0 auto;}
  .panel{display:none;}
  .panel.active{display:block;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(11,16,32,.04),0 4px 12px rgba(11,16,32,.05);}
  .card h3{margin:0 0 10px;font-size:14px;font-weight:600;}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .muted{color:var(--ink-soft);font-size:12.5px;}
  .tagno{font-family:var(--mono);font-weight:600;color:var(--accent-dark);background:var(--accent-bg);padding:2px 7px;border-radius:5px;font-size:12.5px;}
  button.primary{background:linear-gradient(135deg,#0091FF,#0052CC);color:#fff;border:none;border-radius:7px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans);box-shadow:0 1px 2px rgba(0,82,204,.25);transition:filter .15s;}
  button.primary:hover{filter:brightness(1.06);}
  button.primary:active{filter:brightness(.95);}
  button.secondary{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--sans);}
  button.ghost{background:none;border:none;color:var(--ink-soft);font-size:12px;cursor:pointer;text-decoration:underline;padding:2px 0;font-family:var(--sans);}
  button.danger-btn{background:none;border:none;color:var(--danger);font-size:12px;cursor:pointer;padding:2px 0;font-family:var(--sans);}
  input,select,textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 9px;font-size:13px;font-family:var(--sans);background:#fff;color:var(--ink);}
  body.dark-mode{
    --bg:#0F1420; --panel:#171D28; --ink:#E8EBF0; --ink-soft:#93A0B0;
    --line:#2B3340; --accent:#4FC3FF; --accent-dark:#8FDBFF; --accent-bg:#16283D;
    --good:#5FCB8C; --good-bg:#17301F; --danger:#FF8266; --danger-bg:#3A1D16;
    --topbar-bg:linear-gradient(135deg,#0B1020,#131B30 55%,#0F1830);
    --topbar-text:#EDF2FA; --topbar-text-soft:#7C8CAE;
    --topbar-tab-inactive:#8AA0C0; --topbar-tab-active:#EDF2FA; --topbar-tab-hover:#C3D0E5;
    --topbar-btn-bg:rgba(255,255,255,.07); --topbar-btn-border:rgba(255,255,255,.14); --topbar-btn-text:#DCE6F5; --topbar-btn-bg-hover:rgba(255,255,255,.13);
    --topbar-shadow:0 4px 16px rgba(11,16,32,.18);
    --topbar-badge-local-bg:rgba(255,255,255,.08); --topbar-badge-local-text:#8AA0C0; --topbar-badge-local-border:rgba(255,255,255,.14);
  }
  body.dark-mode input,body.dark-mode select,body.dark-mode textarea{background:#1C2330;border-color:var(--line);color:var(--ink);}
  body.dark-mode #docPreviewArea{
    --bg:#EEF1F2; --panel:#FFFFFF; --ink:#1B2733; --ink-soft:#5C6B77; --line:#D8DEE2;
    background:#ffffff !important; padding:12px; border-radius:8px;
  }
  body.dark-mode #docPreviewArea, body.dark-mode #docPreviewArea *{color:#1B2733 !important;}
  body.dark-mode #docPreviewArea .muted{color:#5C6B77 !important;}
  body.dark-mode #docPreviewArea table.doc th{background:#EEF1F2 !important;}
  body.dark-mode #docPreviewArea table.doc td,body.dark-mode #docPreviewArea table.doc th{border-color:#D8DEE2 !important;}
  body.dark-mode #docPreviewArea .dochead{border-bottom-color:#1B2733 !important;}
  body.dark-mode #docPreviewArea table.docmeta td.k{background:#EEF1F2 !important;color:#5C6B77 !important;}
  .app-footer{margin-top:24px;padding:24px 12px 32px;text-align:center;border-top:1px solid var(--line);}
  .footer-values{display:flex;justify-content:center;gap:6px;margin-bottom:6px;}
  .footer-value{display:flex;flex-direction:column;align-items:center;gap:4px;width:25%;max-width:82px;}
  .footer-value svg{width:22px;height:22px;}
  .footer-value div{font-size:9px;font-weight:600;color:var(--ink-soft);line-height:1.25;}
  #btnSupport{cursor:pointer;}
  .footer-disclaimer{max-width:440px;margin:16px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;}
  .footer-disclaimer a{color:var(--accent-dark);font-size:12.5px;text-decoration:underline;}
  .footer-disclaimer p{font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin:8px 0 0;}
  .footer-copyright{margin-top:14px;font-size:11px;color:var(--ink-soft);}
  input[type=number]{font-family:var(--mono);}
  label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin:8px 0 3px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .grid2>div,.grid3>div{min-width:0;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .formbox{border:1px dashed var(--line);border-radius:8px;padding:12px;margin-top:10px;background:#FAFBFB;}
  .formbtns{display:flex;gap:8px;margin-top:12px;}
  .line-item{border-top:1px solid var(--line);padding:8px 0;font-size:12.5px;}
  .line-item .lt{font-weight:600;}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:20px;background:var(--good-bg);color:var(--good);}
  .pill.override{background:var(--accent-bg);color:var(--accent-dark);}
  table.doc{border-collapse:collapse;width:100%;font-size:12px;}
  table.doc th,table.doc td{border:1px solid var(--line);padding:6px 7px;text-align:left;white-space:normal;word-wrap:break-word;overflow-wrap:break-word;vertical-align:top;}
  table.doc th{background:var(--bg);font-weight:600;font-size:11px;text-transform:none;}
  .doc-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .empty{text-align:center;padding:26px 10px;color:var(--ink-soft);}
  .chk-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;}
  .chk-row input{width:auto;}
  select#docProject{margin-bottom:10px;}
  .dropzone{border:2px dashed var(--line);border-radius:8px;padding:14px;text-align:center;cursor:pointer;color:var(--ink-soft);font-size:12.5px;margin-bottom:10px;transition:background .15s,border-color .15s;}
  .dropzone.dragover{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-dark);}
  .dropzone input[type=file]{display:none;}
  .tree-node{border-left:3px solid var(--line);padding:6px 0 6px 10px;margin-top:4px;transition:background .1s,border-color .1s;}
  .tree-node.drop-target{background:var(--accent-bg);border-left-color:var(--accent);}
  .tree-node.dragging{opacity:.4;}
  .tree-root-drop{border:2px dashed var(--line);border-radius:8px;padding:8px;text-align:center;color:var(--ink-soft);font-size:11.5px;margin-bottom:6px;transition:background .1s,border-color .1s;}
  .tree-root-drop.drop-target{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-dark);}
  .drag-handle{cursor:grab;touch-action:none;color:var(--ink-soft);font-size:15px;padding:0 8px 0 0;user-select:none;}
  .tree-level-badge{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);background:var(--bg);border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:middle;}
  .equip-header{background:var(--bg);border-radius:8px;padding:10px 12px;border:1px solid var(--line);}
  #loginGate.dark{background:#12151a !important;}
  #loginGate.dark #loginTitle{color:#F2F2F2 !important;}

      summary:function(row){return esc(row.description)+(row.discipline?" · "+esc(row.discipline):"")+" · "+(row.status==="open"?d.regStatusOpen:d.regStatusClosed);}};
  }
  if(key==="references"){
    return {title:d.regReferences,
      fields:[{k:"category",label:d.regCategory,type:"select",opts:REG_CATS,optLabel:function(v){return {datasheet:d.refCatDatasheet,drawing:d.refCatDrawing,sld:d.refCatSld,hydraulicDiagram:d.refCatHydraulic,designBasis:d.refCatDesignBasis,vendorDoc:d.refCatVendor,other:d.refCatOther}[v];}},
        {k:"description",label:d.regDescription,type:"text"},{k:"notes",label:d.regNotes,type:"text"}],
      summary:function(row){var catLbl={datasheet:d.refCatDatasheet,drawing:d.refCatDrawing,sld:d.refCatSld,hydraulicDiagram:d.refCatHydraulic,designBasis:d.refCatDesignBasis,vendorDoc:d.refCatVendor,other:d.refCatOther}[row.category]||row.category;
        return "["+esc(catLbl)+"] "+esc(row.description)+(row.notes?" · "+esc(row.notes):"");}};
  }
  if(key==="revisions"){

      fields:[{k:"revision",label:d.regRevision,type:"text"},{k:"date",label:d.docDate,type:"date"},{k:"description",label:d.regDescription,type:"text"},
        {k:"preparedBy",label:d.preparedBy,type:"text"},{k:"checkedBy",label:d.regCheckedBy,type:"text"},{k:"approvedBy",label:d.regApprovedBy,type:"text"}],
      summary:function(row){return esc(row.revision)+" · "+esc(row.date)+" · "+esc(row.description)+" · "+esc(row.preparedBy);}};

  if(key==="utilityRegister"){
    var UTIL_TYPES=["elecDC","elecAC","hydOil","coolWater","instrAir","nitrogen","other"];
    var utilLbl=function(v){return {elecDC:d.utilElecDC,elecAC:d.utilElecAC,hydOil:d.utilHydOil,coolWater:d.utilCoolWater,instrAir:d.utilInstrAir,nitrogen:d.utilNitrogen,other:d.utilOther}[v];};

        {k:"distLevel",label:d.utilDistLevel,type:"text"},{k:"availCap",label:d.utilAvailCap,type:"text"},{k:"remarks",label:d.regNotes,type:"text"}],
      summary:function(row){return "["+esc(row.utilId)+"] "+esc(utilLbl(row.utilName))+" · "+esc(row.medium)+" · "+esc(row.availCap)+" "+esc(row.capacityUnit);}};
  }
  if(key==="products"){
    return {title:d.regProducts,
      fields:[{k:"productId",label:d.prodId,type:"text"},{k:"productName",label:d.prodName,type:"text"},
        {k:"description",label:d.regDescription,type:"text"},{k:"location",label:d.crLocation,type:"text"},
        {k:"operatingMode",label:d.crOperatingMode,type:"text"},{k:"vendorRef",label:d.prodVendorRef,type:"text"},{k:"remarks",label:d.regNotes,type:"text"}],
      summary:function(row){return "["+esc(row.productId)+"] "+esc(row.productName)+(row.description?" · "+esc(row.description):"");}};
  }
  if(key==="utilityRequirements"){
    return {title:d.regUtilityRequirements,
      fields:[{k:"tagNo",label:d.colTag,type:"text"},{k:"parameter",label:d.uReqParameter,type:"text"},{k:"unit",label:d.colUnit,type:"text"},

      summary:function(row){return esc(row.tagNo)+" · "+esc(row.parameter)+": "+esc(row.minimum)+"/"+esc(row.normal)+"/"+esc(row.maximum)+" "+esc(row.unit);}};
  }
  if(key==="dataQuality"){
    var DQ_STATUS=["verified","preliminary","assumed","tbc"];

function bindRegisterEvents(rerenderFn){
  document.querySelectorAll("[data-regAdd]").forEach(function(b){b.onclick=function(){
    state.registerAdding=b.getAttribute("data-regAdd");state.registerEditRow=null;rerenderFn();
  };});
  document.querySelectorAll("[data-regEdit]").forEach(function(b){b.onclick=function(){
    state.registerEditRow=b.getAttribute("data-regEdit");state.registerAdding=null;rerenderFn();
  };});
  document.querySelectorAll("[data-regCancel]").forEach(function(b){b.onclick=function(){state.registerAdding=null;state.registerEditRow=null;rerenderFn();};});
  document.querySelectorAll("[data-regDel]").forEach(function(b){b.onclick=function(){
    var parts=b.getAttribute("data-regDel").split("|");
    var p=findProject(parts[1]);
    p[parts[0]]=p[parts[0]].filter(function(r){return r.id!==parts[2];});
    rerenderFn();
  };});
  document.querySelectorAll("[data-regSave]").forEach(function(b){b.onclick=function(){
    var parts=b.getAttribute("data-regSave").split("|");
    var key=parts[0],p=findProject(parts[1]),rowId=parts[2];
    var cfg=regCfg(key);
    p[key]=p[key]||[];
    if(rowId){
      var existing=p[key].find(function(r){return r.id===rowId;});
      if(existing)cfg.fields.forEach(function(f){existing[f.k]=val("rf_"+f.k);});
    } else {
      var row={id:uid()};
      cfg.fields.forEach(function(f){row[f.k]=val("rf_"+f.k);});
      p[key].push(row);
    }
    state.registerAdding=null;state.registerEditRow=null;rerenderFn();
  };});
}

function docSuggestFor(categoryId,answers){
  var directiveIds={},standardIds={};
  DOC_RULES.forEach(function(r){
    var catMatch=r.category===null||r.category===categoryId;
    var attrMatch=r.attr===null||answers[r.attr]===r.value;
    if(catMatch&&attrMatch)r.suggests.forEach(function(s){(s.type==="directive"?directiveIds:standardIds)[s.id]=true;});
  });
  return {directiveIds:Object.keys(directiveIds),standardIds:Object.keys(standardIds)};

function docShowNb(){return (docWz.answers.atex===true&&docWz.answers.atexGroup==="II2G")||docWz.details.nbManual===true;}
function docNewDocNumber(){return "DoC-"+new Date().getFullYear()+"-"+String(state.declarations.length+state.sharedDeclarations.length+143).padStart(4,"0");}
function docEnsureDocNumber(cb){
  if(docWz.docNumber){cb();return;}
  if(!firebaseEnabled||!fbUser||!fbDb){docWz.docNumber=docNewDocNumber();cb();return;}
  var counterRef=fbDb.collection("shared").doc("docCounter");
  fbDb.runTransaction(function(tx){
    return tx.get(counterRef).then(function(doc){
      var current=doc.exists?(doc.data().value||142):142;
      var next=current+1;
      tx.set(counterRef,{value:next});
      return next;
    });
  }).then(function(n){
    docWz.docNumber="DoC-"+new Date().getFullYear()+"-"+String(n).padStart(4,"0");
    cb();
  }).catch(function(err){
    console.error(err);
    docWz.docNumber=docNewDocNumber();
    cb();
  });
}

function bindDatasheetTabEvents(){
  var sel=document.getElementById("dsTagSelect");
  if(sel)sel.onchange=function(){state.datasheetSelectedTagId=sel.value||null;renderDatasheetTab();};
  var printBtn=document.getElementById("dsPrintBtn");
  if(printBtn)printBtn.onclick=function(){
    var tag=findTag(state.datasheetSelectedTagId);
    if(!tag)return;
    var w=window.open("","_blank");
    w.document.write(buildDatasheetPrintableHtml(tag));
    w.document.close();w.focus();
    setTimeout(function(){w.print();},300);
  };
}

function docBuildPrintableHtml(decl,lang){

    "</head><body>"+body+"</body></html>";

      adminStatRow(d.adminTotalTags,state.tags.length)+

function adminStatRow(label,val){
  return '<div class="row" style="padding:6px 0;border-top:1px solid var(--line)"><div class="muted">'+label+'</div><b>'+val+'</b></div>';
}

function adminLoadUsers(){
  if(!firebaseEnabled||!fbDb)return;
  fbDb.collectionGroup("profile").get().then(function(snap){
    var users=[];
    snap.forEach(function(doc){
      var data=doc.data();
      var uid=doc.ref.parent.parent?doc.ref.parent.parent.id:doc.id;
      users.push({uid:uid,email:data.email,lastLogin:data.lastLogin});
    });
    adminUsersCache=users;
    renderAdminTab();
  }).catch(function(err){
    console.error(err);
    adminUsersCache=[];
    renderAdminTab();
  });
}

function bindAdminEvents(){
  var d=t();
  var restoreFile=document.getElementById("adminRestoreFile");
  if(restoreFile)restoreFile.onclick=function(){
    if(!confirm(t().confirmOpenData))return;
    document.getElementById("fileOpenData").click();
  };
  var restoreCloud=document.getElementById("adminRestoreCloud");
  if(restoreCloud)restoreCloud.onclick=cloudLoad;
  document.querySelectorAll("[data-adminSub]").forEach(function(b){b.onclick=function(){
    adminSubTab=b.getAttribute("data-adminSub");adminJsonView=null;renderAdminTab();
  };});
  var exportBtn=document.getElementById("adminExportBtn");
  if(exportBtn)exportBtn.onclick=function(){
    var payload={exportedAt:new Date().toISOString(),tags:state.tags,projects:state.projects,docCustom:state.docCustom,sharedDeclarations:state.sharedDeclarations,users:adminUsersCache};
    var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="utility-hub-admin-export.json";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  };
  var refreshUsers=document.getElementById("adminRefreshUsers");
  if(refreshUsers)refreshUsers.onclick=function(){adminUsersCache=null;renderAdminTab();};
  document.querySelectorAll("[data-adminViewUser]").forEach(function(b){b.onclick=function(){
    var uid=b.getAttribute("data-adminViewUser");
    if(adminJsonView===uid){adminJsonView=null;renderAdminTab();return;}
    fbDb.collection("users").doc(uid).collection("private").doc("data").get().then(function(doc){
      var u=adminUsersCache.find(function(x){return x.uid===uid;});
      if(u)u.privateData=doc.exists?doc.data():{};
      adminJsonView=uid;renderAdminTab();
    }).catch(function(err){console.error(err);alert(t().cloudError);});
  };});
  document.querySelectorAll("[data-adminDelUser]").forEach(function(b){b.onclick=function(){
    if(!confirm(t().adminDeleteConfirm))return;
    var uid=b.getAttribute("data-adminDelUser");
    fbDb.collection("users").doc(uid).collection("private").doc("data").set({declarations:[],updatedAt:new Date().toISOString()})
      .then(function(){adminLogEvent("Slettet private DoC-data for bruker "+uid);renderAdminTab();})
      .catch(function(err){console.error(err);alert(t().cloudError);});
  };});
  document.querySelectorAll("[data-adminDelShared]").forEach(function(b){b.onclick=function(){
    if(!confirm(state.lang==="no"?"Slette denne delte erklæringen?":"Delete this shared declaration?"))return;
    var id=b.getAttribute("data-adminDelShared");
    state.sharedDeclarations=state.sharedDeclarations.filter(function(x){return x.id!==id;});
    adminLogEvent("Slettet delt DoC "+id);
    renderAdminTab();
  };});
}

  document.querySelectorAll("[data-docEdit]").forEach(function(b){b.onclick=function(){
    var parts=b.getAttribute("data-docEdit").split("|");

    var decl=list.find(function(x){return x.id===parts[1];});
    if(!decl)return;
    docResetWizard();
    docWz.editingId=decl.id;docWz.editingList=parts[0];docWz.docNumber=decl.docNumber;docWz.directiveIds=decl.directiveIds.slice();docWz.standardIds=decl.standardIds.slice();
    docWz.details=Object.assign({},docWz.details,decl);
    docWz.step=3;
    state.docViewMode="wizard";renderDocTab();
  };});
  document.querySelectorAll("[data-docDup]").forEach(function(b){b.onclick=function(){
    var parts=b.getAttribute("data-docDup").split("|");
    var list=parts[0]==="shared"?state.sharedDeclarations:state.declarations;
    var decl=list.find(function(x){return x.id===parts[1];});
    if(!decl)return;
    docResetWizard();
    docWz.directiveIds=decl.directiveIds.slice();docWz.standardIds=decl.standardIds.slice();
    docWz.details=Object.assign({},docWz.details,decl,{id:undefined});
    docWz.step=3;
    state.docViewMode="wizard";renderDocTab();
  };});
  document.querySelectorAll("[data-docDel]").forEach(function(b){b.onclick=function(){
    if(!confirm(state.lang==="no"?"Slette denne erklæringen?":"Delete this declaration?"))return;
    var parts=b.getAttribute("data-docDel").split("|");
    if(parts[0]==="shared"){state.sharedDeclarations=state.sharedDeclarations.filter(function(x){return x.id!==parts[1];});}
    else{state.declarations=state.declarations.filter(function(x){return x.id!==parts[1];});}
    renderDocTab();
  };});
  document.querySelectorAll("[data-docShare]").forEach(function(b){b.onclick=function(){
    if(!confirm(t().docShareConfirm))return;
    var id=b.getAttribute("data-docShare");
    var decl=state.declarations.find(function(x){return x.id===id;});
    if(!decl)return;
    state.declarations=state.declarations.filter(function(x){return x.id!==id;});
    state.sharedDeclarations.push(decl);
    renderDocTab();
  };});

  var linkTag=document.getElementById("docLinkTag");
  if(linkTag)linkTag.onchange=function(){
    docWz.linkedTagId=linkTag.value;
    var tag=findTag(linkTag.value);
    if(tag&&tag.docCategory){
      docWz.categoryId=tag.docCategory;docWz.answers={};
      docWz.details.productName=tag.name;docWz.details.object=tag.tagNo+" – "+tag.name;
      docWz.step=2;
    }
    renderDocTab();
  };
  document.querySelectorAll("[data-docCat]").forEach(function(b){b.onclick=function(){
    docWz.categoryId=b.getAttribute("data-docCat");docWz.answers={};
    if(docWz.linkedTagId){
      var tag=findTag(docWz.linkedTagId);
      if(tag){docWz.details.productName=tag.name;docWz.details.object=tag.tagNo+" – "+tag.name;}
    }
    docWz.step=2;renderDocTab();
  };});

  document.querySelectorAll("[data-docBool]").forEach(function(b){b.onclick=function(){
    var parts=b.getAttribute("data-docBool").split("|");
    docWz.answers[parts[0]]=parts[1]==="1";
    renderDocTab();
  };});
  document.querySelectorAll("[data-docSelect]").forEach(function(sel){sel.onchange=function(){
    docWz.answers[sel.getAttribute("data-docSelect")]=sel.value;renderDocTab();
  };});
  var docBack2=document.getElementById("docBack2");
  if(docBack2)docBack2.onclick=function(){docWz.step=1;renderDocTab();};
  var docSuggestBtn=document.getElementById("docSuggestBtn");
  if(docSuggestBtn)docSuggestBtn.onclick=function(){
    var sug=docSuggestFor(docWz.categoryId,docWz.answers);
    docWz.directiveIds=sug.directiveIds;docWz.standardIds=sug.standardIds;
    docWz.step=3;renderDocTab();
  };

  document.querySelectorAll("[data-docDirToggle]").forEach(function(cb){cb.onchange=function(){
    var id=cb.getAttribute("data-docDirToggle");
    var idx=docWz.directiveIds.indexOf(id);
    if(cb.checked){if(idx<0)docWz.directiveIds.push(id);}else{if(idx>=0)docWz.directiveIds.splice(idx,1);}
  };});
  document.querySelectorAll("[data-docStdToggle]").forEach(function(cb){cb.onchange=function(){
    if(!cb.checked){
      var id=cb.getAttribute("data-docStdToggle");
      var idx=docWz.standardIds.indexOf(id);
      if(idx>=0)docWz.standardIds.splice(idx,1);
      renderDocTab();
    }
  };});
  document.querySelectorAll("[data-docStdAdd]").forEach(function(b){b.onclick=function(){
    var id=b.getAttribute("data-docStdAdd");
    if(docWz.standardIds.indexOf(id)<0)docWz.standardIds.push(id);
    docWz.addSearch="";renderDocTab();
  };});
  var docStdSearch=document.getElementById("docStdSearch");
  if(docStdSearch)docStdSearch.oninput=function(){docWz.addSearch=docStdSearch.value;renderDocTab();};

  var toggleAddDir=document.getElementById("docToggleAddDir");
  if(toggleAddDir)toggleAddDir.onclick=function(){docWz.showAddDirective=!docWz.showAddDirective;renderDocTab();};
  var addDirBtn=document.getElementById("docAddDirBtn");
  if(addDirBtn)addDirBtn.onclick=function(){
    var code=val("docNewDirCode"),name=val("docNewDirName");
    if(!code||!name)return;
    var id="custom-dir-"+uid();
    state.docCustom.directives.push({id:id,code:code,name:name});
    docWz.directiveIds.push(id);
    docWz.showAddDirective=false;docWz.newDirectiveCode="";docWz.newDirectiveName="";
    renderDocTab();
  };
  var toggleAddStd=document.getElementById("docToggleAddStd");
  if(toggleAddStd)toggleAddStd.onclick=function(){docWz.showAddStandard=!docWz.showAddStandard;renderDocTab();};
  var addStdBtn=document.getElementById("docAddStdBtn");
  if(addStdBtn)addStdBtn.onclick=function(){
    var code=val("docNewStdCode"),title=val("docNewStdTitle"),edition=val("docNewStdEdition");
    if(!code||!title)return;
    var id="custom-std-"+uid();
    state.docCustom.standards.push({id:id,code:code,title:title,edition:edition||"sjekk gjeldende utgave",lastVerified:"ikke verifisert"});
    docWz.standardIds.push(id);
    docWz.showAddStandard=false;docWz.newStandardCode="";docWz.newStandardTitle="";docWz.newStandardEdition="";
    renderDocTab();
  };
  var docBack3=document.getElementById("docBack3");
  if(docBack3)docBack3.onclick=function(){docWz.step=2;renderDocTab();};
  var docNext3=document.getElementById("docNext3");
  if(docNext3)docNext3.onclick=function(){docWz.step=4;renderDocTab();};

  var dropzone=document.getElementById("docLogoDropzone");
  var logoInput=document.getElementById("docLogoInput");
  function handleDocLogoFile(file){
    if(!file||file.type.indexOf("image/")!==0)return;
    var reader=new FileReader();
    reader.onload=function(e){docWz.details.logo=e.target.result;renderDocTab();};
    reader.readAsDataURL(file);
  }
  if(logoInput)logoInput.onchange=function(){if(logoInput.files&&logoInput.files[0])handleDocLogoFile(logoInput.files[0]);};
  if(dropzone){
    dropzone.onclick=function(e){if(e.target!==logoInput)logoInput.click();};
    dropzone.ondragover=function(e){e.preventDefault();dropzone.classList.add("dragover");};
    dropzone.ondragleave=function(){dropzone.classList.remove("dragover");};
    dropzone.ondrop=function(e){e.preventDefault();dropzone.classList.remove("dragover");if(e.dataTransfer.files&&e.dataTransfer.files[0])handleDocLogoFile(e.dataTransfer.files[0]);};
  }
  var removeLogo=document.getElementById("docRemoveLogo");
  if(removeLogo)removeLogo.onclick=function(){docWz.details.logo="";renderDocTab();};

  var idType=document.getElementById("docIdType");
  if(idType)idType.onchange=function(){docReadStep4Fields();docWz.details.idType=idType.value;renderDocTab();};
  var nbManual=document.getElementById("docNbManual");
  if(nbManual)nbManual.onchange=function(){docReadStep4Fields();docWz.details.nbManual=nbManual.checked;renderDocTab();};
  var docBack4=document.getElementById("docBack4");
  if(docBack4)docBack4.onclick=function(){docReadStep4Fields();docWz.step=3;renderDocTab();};
  var docNext4=document.getElementById("docNext4");
  if(docNext4)docNext4.onclick=function(){
    docReadStep4Fields();
    var nbSel=document.getElementById("docNbSelect");if(nbSel)docWz.details.notifiedBodyId=nbSel.value;
    docEnsureDocNumber(function(){docWz.step=5;renderDocTab();});
  };

  var langToggle=document.getElementById("docLangToggle");
  if(langToggle)langToggle.onchange=function(){docWz.lang=langToggle.value;renderDocTab();};
  var printBtn=document.getElementById("docPrintBtn");
  if(printBtn)printBtn.onclick=function(){
    var decl=docBuildDeclObj();
    var w=window.open("","_blank");
    w.document.write(docBuildPrintableHtml(decl,docWz.lang));
    w.document.close();w.focus();
    setTimeout(function(){w.print();},300);
  };
  var docBack5=document.getElementById("docBack5");
  if(docBack5)docBack5.onclick=function(){docWz.step=4;renderDocTab();};
  var docSaveBtn=document.getElementById("docSaveBtn");
  if(docSaveBtn)docSaveBtn.onclick=function(){
    var decl=docBuildDeclObj();
    var targetList=docWz.editingList==="shared"?state.sharedDeclarations:state.declarations;
    if(decl.id){
      var existing=targetList.find(function(x){return x.id===decl.id;});
      if(existing)Object.assign(existing,decl);
    } else {
      decl.id=uid();
      state.declarations.push(decl);
    }
    alert(t().docSavedDraft);
    state.docViewMode="list";renderDocTab();
  };
}

function renderLibrary(){
  var d=t();
  var html="";
  html+='<div class="row"><div style="margin:0;font-size:19px;font-weight:700;color:var(--ink) !important;-webkit-text-fill-color:var(--ink) !important">'+d.tabLibrary+'</div><button class="primary" id="btnNewTag">+ '+d.newTag+'</button></div>';

  if(state.editingTagId==="__new__"||( state.editingTagId && findTag(state.editingTagId))){
    html+=tagFormHtml(state.editingTagId==="__new__"?null:findTag(state.editingTagId));
  }

  if(state.tags.length===0){
    html+='<div class="card empty">'+d.emptyLibrary+'</div>';
  } else {
    state.tags.forEach(function(tag){
      html+='<div class="card">';
      html+='<div class="equip-header"><div class="row"><div><span class="tagno">'+esc(tag.tagNo)+'</span><div style="margin-top:6px;font-weight:700;font-size:16px">'+esc(tag.name)+'</div>';
      if(tag.supplier)html+='<div class="muted">'+esc(tag.supplier)+(tag.spec?" · "+esc(tag.spec):"")+'</div>';
      html+='</div><div style="text-align:right;white-space:nowrap"><button class="ghost" data-datasheet="'+tag.id+'">'+d.btnDatasheet+'</button> <button class="ghost" data-editTag="'+tag.id+'">'+d.edit+'</button> <button class="danger-btn" data-delTag="'+tag.id+'">'+d.del+'</button></div></div></div>';

      html+='<div style="margin-top:10px"><div class="muted" style="font-weight:600">'+d.consumptionLines+'</div>';
      if(tag.lines.length===0){
        html+='<div class="muted" style="padding:6px 0">'+d.noLines+'</div>';
      } else {
        tag.lines.forEach(function(line){
          if(state.editingLineFor && state.editingLineFor.tagId===tag.id && state.editingLineFor.lineId===line.id){
            html+=lineFormHtml(tag,line);
          } else {
            var cdLib=consumptionDisplay(line,{min:line.min,normal:line.normal,max:line.max,unit:line.unit});
            html+='<div class="line-item"><div class="row"><div><span class="lt">'+esc(typeLabel(line.type))+'</span> · '+esc(contIntLabel(line.contInt))+' · '+cdLib.text+
              (line.mode?' · '+esc(modeLabel(line.mode)):'')+'</div><div style="white-space:nowrap"><button class="ghost" data-editLine="'+tag.id+'|'+line.id+'">'+d.edit+'</button> <button class="danger-btn" data-delLine="'+tag.id+'|'+line.id+'">'+d.del+'</button></div></div>'+
              (cdLib.detail?'<div class="muted">'+esc(cdLib.detail)+'</div>':(line.quality?'<div class="muted">'+esc(line.quality)+'</div>':''))+
              (line.type==="hyd"&&line.hydSystemType?'<div class="muted" style="font-size:10.5px">'+esc(hydSystemTypeShortLabel(line.hydSystemType))+'</div>':'')+'</div>';
          }
        });
      }
      if(state.addingLineForTag===tag.id){
        html+=lineFormHtml(tag,null);
      } else {
        html+='<button class="secondary" style="margin-top:8px" data-addLine="'+tag.id+'">+ '+d.addLine+'</button>';
      }
      html+='</div></div>';
    });
  }
  document.getElementById("tab-library").innerHTML=html;
  bindLibraryEvents();
}

window.applyPreset=function(sel){
  var box=sel.closest(".formbox");
  var d=t();
  var hint=box.querySelector("#presetHint");
  if(sel.value===""){if(hint)hint.textContent="";return;}
  var pr=COMPONENT_PRESETS[parseInt(sel.value,10)];
  if(!pr)return;
  var typeSel=box.querySelector("#fl_type");
  typeSel.value=pr.type;
  window.toggleElecFields(typeSel);
  if(pr.type==="elec"){
    var acdcSel=box.querySelector("#fl_acdc");if(acdcSel)acdcSel.value=pr.acdc||"ac";
    var phasesSel=box.querySelector("#fl_phases");if(phasesSel)phasesSel.value=pr.phases||"3";
    var voltInp=box.querySelector("#fl_voltage");if(voltInp&&pr.voltages)voltInp.value=pr.voltages[0];
    var freqInp=box.querySelector("#fl_freq");if(freqInp)freqInp.value=(pr.acdc==="dc")?"":(pr.freqs?pr.freqs[0]:"50");
  }
  var hints=[];
  if(pr.voltages&&pr.voltages.length>1)hints.push((state.lang==="no"?"Spenning: ":"Voltage: ")+pr.voltages.join("V, ")+"V");
  if(pr.freqs&&pr.freqs.length>1)hints.push((state.lang==="no"?"Frekvens: ":"Frequency: ")+pr.freqs.join("Hz, ")+"Hz");
  if(pr.note)hints.push(pr.note);
  if(hint)hint.textContent=hints.length?d.presetOtherValues+" "+hints.join(" · "):"";
};

    zone.ondrop=function(ev){ev.preventDefault();zone.classList.remove("dragover");if(ev.dataTransfer.files&&ev.dataTransfer.files[0])handlePhotoFile(ev.dataTransfer.files[0]);};

function renderProjects(){
  var d=t();
  var html='<div class="row"><div style="margin:0;font-size:19px;font-weight:700;color:var(--ink) !important;-webkit-text-fill-color:var(--ink) !important">'+d.tabProjects+'</div><button class="primary" id="btnNewProject">+ '+d.newProject+'</button></div>';

  if(state.editingTagId==="__newproject__"){
    html+='<div class="formbox">'+
      '<label>'+d.projectName+'</label><input id="fp_name" value="">'+
      '<label>'+d.customer+'</label><input id="fp_customer" value="">'+
      '<div class="formbtns"><button class="primary" id="saveProject">'+d.save+'</button><button class="secondary" id="cancelProject">'+d.cancel+'</button></div>'+
      '</div>';
  }

  if(state.projects.length===0){
    html+='<div class="card empty">'+d.emptyProjects+'</div>';
  } else {
    state.projects.forEach(function(p){
      var open=state.expandedProject===p.id;
      html+='<div class="card">';
      html+='<div class="row" style="cursor:pointer" data-toggleProject="'+p.id+'"><div><div style="font-weight:600">'+esc(p.name)+'</div>'+(p.customer?'<div class="muted">'+esc(p.customer)+'</div>':'')+'</div><div class="muted">'+p.tagLinks.length+' '+ (state.lang==="no"?"linjer":"lines") +'</div></div>';
      if(open){
        html+='<div class="sys-fields"><div class="muted" style="font-weight:600;margin-bottom:6px">'+d.editProjectInfo+'</div>'+
          '<label>'+d.projectName+'</label><input id="fp_editName" value="'+esc(p.name)+'">'+
          '<label>'+d.customer+'</label><input id="fp_editCustomer" value="'+esc(p.customer)+'">'+
          '<div class="flexend"><button class="secondary" id="saveProjectInfo" data-pid="'+p.id+'">'+d.save+'</button></div></div>';

        html+='<div class="sys-fields"><div class="muted" style="font-weight:600;margin-bottom:6px">'+d.systemLevel+'</div>'+
          '<label>'+d.sysCapacity+'</label><input id="fp_sysCap" value="'+esc(p.sysCapacity)+'">'+
          '<label>'+d.sysMaxLoad+'</label><input id="fp_sysMax" value="'+esc(p.sysMaxLoad)+'">'+
          '<label>'+d.sysChar+'</label><input id="fp_sysChar" value="'+esc(p.sysChar)+'">'+
          '<div class="flexend"><button class="secondary" id="saveSysFields" data-pid="'+p.id+'">'+d.save+'</button></div></div>';

        html+='<div style="margin-top:12px"><div class="row"><div class="muted" style="font-weight:600">'+d.assignTags+'</div>'+
          '<button class="secondary" id="btnAddTags" data-pid="'+p.id+'">+ '+d.addTagsFromLibrary+'</button></div>';

        if(state.editingLineFor==="__pickTags__"){
          html+=tagPickerHtml(p);
        }

        if(p.tagLinks.length===0){
          html+='<div class="muted" style="padding:6px 0">'+d.noTagsAssigned+'</div>';
        } else {
          p.tagLinks.forEach(function(tl){
            var tag=findTag(tl.tagId);
            if(!tag)return;
            var line=findLine(tag,tl.lineId);
            if(!line)return;
            var ov=tl.overrides||{};
            var isOverridden=Object.keys(ov).length>0;
            var eff={min:ov.min!==undefined?ov.min:line.min,normal:ov.normal!==undefined?ov.normal:line.normal,max:ov.max!==undefined?ov.max:line.max,unit:ov.unit!==undefined?ov.unit:line.unit,mode:ov.mode!==undefined?ov.mode:line.mode};
            var key=tl.tagId+"|"+tl.lineId;
            var cdProj=consumptionDisplay(line,eff);
            var treeOpts='<option value="">'+d.structUnassigned+'</option>'+(p.structureTree||[]).map(function(n){return '<option value="'+n.id+'"'+(tl.structureNodeId===n.id?" selected":"")+'>'+esc(n.name)+'</option>';}).join("");
            html+='<div class="line-item"><div class="row"><div><span class="tagno">'+esc(tag.tagNo)+'</span> '+esc(tag.name)+' – '+esc(typeLabel(line.type))+
              '<div class="muted">'+cdProj.text+(eff.mode?' · '+esc(modeLabel(eff.mode)):'')+'</div>'+
              (cdProj.detail?'<div class="muted" style="font-size:11px">'+esc(cdProj.detail)+'</div>':(line.quality?'<div class="muted" style="font-size:11px">'+esc(line.quality)+'</div>':''))+
              '<div class="muted" style="font-size:10px;margin-top:6px">'+d.structPlacementLabel+'</div>'+
              '<select data-assignNode="'+p.id+'|'+key+'" style="margin-top:2px;font-size:11px;padding:4px 6px">'+treeOpts+'</select></div>'+
              '<div style="text-align:right"><span class="pill'+(isOverridden?" override":"")+'">'+(isOverridden?d.overrideVal:d.useLibVal)+'</span><br>'+
              '<button class="ghost" data-toggleOverride="'+p.id+'|'+key+'">'+(state.editingLineFor2===key?d.cancel:d.overrideBtn)+'</button> '+
              (isOverridden?'<button class="ghost" data-resetOverride="'+p.id+'|'+key+'">'+d.resetOverride+'</button> ':'')+
              '<button class="danger-btn" data-removeTagLink="'+p.id+'|'+key+'">'+d.del+'</button></div></div>';
            if(state.overrideFormFor===p.id+"|"+key){
              html+=overrideFormHtml(p,tl,line);
            }
            html+='</div>';
          });
        }
        html+='</div>';
      }
      html+='</div>';
    });
  }
  document.getElementById("tab-projects").innerHTML=html;
  bindProjectEvents();
}

function tagPickerHtml(p){

      var already=p.tagLinks.some(function(tl){return tl.tagId===tag.id&&tl.lineId===line.id;});
      var key=tag.id+"__"+line.id;
      html+='<div class="chk-row"><input type="checkbox" id="pick_'+key+'" data-picktag="'+tag.id+'" data-pickline="'+line.id+'"'+(already?" checked disabled":"")+'>'+

function effLine(line,tl){
  var ov=(tl&&tl.overrides)||{};
  return {min:ov.min!==undefined?ov.min:line.min,normal:ov.normal!==undefined?ov.normal:line.normal,
    max:ov.max!==undefined?ov.max:line.max,unit:ov.unit!==undefined?ov.unit:line.unit,mode:ov.mode!==undefined?ov.mode:line.mode,
    voltage:ov.voltage!==undefined?ov.voltage:line.voltage,acdc:ov.acdc!==undefined?ov.acdc:line.acdc,
    phases:ov.phases!==undefined?ov.phases:line.phases,powerFactor:ov.powerFactor!==undefined?ov.powerFactor:line.powerFactor};
}

function fmtNum(n){if(n===null||n===undefined||n===""||isNaN(n))return "";return String(Math.round(n*100)/100);}

function exportFileBaseName(p){
  var base=(p.docNo||"").trim();
  base=base?base.replace(/[^a-zA-Z0-9\-_]+/g,"_"):"utility-consumption-data";
  if(p.revision&&p.revision.trim())base+="_Rev"+p.revision.trim().replace(/[^a-zA-Z0-9]+/g,"");
  return base;
}

function calcPower(line,eff){
  if(line.type!=="elec")return null;
  eff=eff||{};
  var V=parseFloat(eff.voltage!==undefined?eff.voltage:line.voltage);
  if(!V||isNaN(V))return null;
  var acdc=(eff.acdc!==undefined?eff.acdc:line.acdc)||"ac";
  var phases=(eff.phases!==undefined?eff.phases:line.phases)||"3";
  function num(x){var n=parseFloat(x);return isNaN(n)?null:n;}
  function calcOne(Iraw){
    var I=num(Iraw);
    if(I===null)return null;
    var s;
    if(acdc==="dc"){s=V*I;}
    else if(phases==="3"){s=Math.sqrt(3)*V*I;}
    else{s=V*I;}
    return s/1000;
  }
  var sMin=calcOne(eff.min),sNorm=calcOne(eff.normal),sMax=calcOne(eff.max);
  var pf=num(eff.powerFactor!==undefined?eff.powerFactor:line.powerFactor);
  function act(s){return (s!==null&&pf!==null)?s*pf:null;}
  var formula;
  if(acdc==="dc")formula="P = V × I";
  else if(phases==="3")formula="S = √3 × V × I"+(pf!==null?" ; P = S × cosφ":"");
  else formula="S = V × I"+(pf!==null?" ; P = S × cosφ":"");
  return {dc:acdc==="dc",phases:phases,s:{min:sMin,normal:sNorm,max:sMax},
    p:pf!==null?{min:act(sMin),normal:act(sNorm),max:act(sMax)}:null,pf:pf,formula:formula};
}

function consumptionDisplay(line,eff){
  var calc=calcPower(line,eff);
  if(calc){
    var unitLbl=calc.dc?"kW":"kVA";
    var text=fmtNum(calc.s.min)+" / "+fmtNum(calc.s.normal)+" / "+fmtNum(calc.s.max)+" "+unitLbl;
    if(calc.p)text+=" (P "+fmtNum(calc.p.min)+"/"+fmtNum(calc.p.normal)+"/"+fmtNum(calc.p.max)+" kW)";
    var detail=(eff.voltage!==undefined?eff.voltage:line.voltage)+"V"+(calc.dc?" DC":" AC "+(calc.phases==="3"?"3-fas":"1-fas"))+", "+
      (eff.normal||eff.max||eff.min||"")+"A"+(calc.pf!==null?", cosφ "+calc.pf:"")+" · "+calc.formula;
    return {text:text,detail:detail,calc:calc};
  }
  return {text:esc(eff.min)+" / "+esc(eff.normal)+" / "+esc(eff.max)+" "+esc(eff.unit),detail:null,calc:null};
}

function assemblySubtotal(p,tagsInGroup){
  var ids={};tagsInGroup.forEach(function(tg){ids[tg.id]=true;});
  var elecAC=0,elecDC=0,hyd=0,hydUnit="",any={ac:false,dc:false,hyd:false};
  p.tagLinks.forEach(function(tl){
    if(!ids[tl.tagId])return;
    var tag=findTag(tl.tagId);if(!tag)return;
    var line=findLine(tag,tl.lineId);if(!line)return;
    var eff=effLine(line,tl);
    if(line.type==="elec"){
      var calc=calcPower(line,eff);
      if(calc&&calc.s.max!==null){
        if(calc.dc){elecDC+=calc.s.max;any.dc=true;}else{elecAC+=calc.s.max;any.ac=true;}
      } else if(eff.max){
        var nE=parseFloat(eff.max);
        if(!isNaN(nE)){
          var uE=(eff.unit||"").toLowerCase();
          var kW=uE==="va"||uE==="w"?nE/1000:nE;
          if(line.acdc==="dc"){elecDC+=kW;any.dc=true;}else{elecAC+=kW;any.ac=true;}
        }
      }
    } else if(line.type==="hyd"&&eff.max){
      var n=parseFloat(eff.max);if(!isNaN(n)){hyd+=n;hydUnit=eff.unit;any.hyd=true;}
    }
  });
  return {elecAC:any.ac?elecAC:0,elecDC:any.dc?elecDC:0,hyd:any.hyd?hyd:0,hydUnit:hydUnit};
}

function nodeChildren(tree,parentId){return (tree||[]).filter(function(n){return n.parentId===parentId;});}

function subtreeTagLinks(p,nodeId){
  var ids={};
  function collect(id){ids[id]=true;nodeChildren(p.structureTree,id).forEach(function(c){collect(c.id);});}
  collect(nodeId);
  return p.tagLinks.filter(function(tl){return tl.structureNodeId&&ids[tl.structureNodeId];});
}

function nodeSubtotal(p,nodeId){
  var links=subtreeTagLinks(p,nodeId);
  var elecAC=0,elecDC=0,hyd=0,hydUnit="",any={ac:false,dc:false,hyd:false};
  links.forEach(function(tl){
    var tag=findTag(tl.tagId);if(!tag)return;
    var line=findLine(tag,tl.lineId);if(!line)return;
    var eff=effLine(line,tl);
    if(line.type==="elec"){
      var calc=calcPower(line,eff);
      if(calc&&calc.s.max!==null){if(calc.dc){elecDC+=calc.s.max;any.dc=true;}else{elecAC+=calc.s.max;any.ac=true;}}
      else if(eff.max){var n=parseFloat(eff.max);if(!isNaN(n)){var u=(eff.unit||"").toLowerCase();var kW=(u==="va"||u==="w")?n/1000:n;if(line.acdc==="dc"){elecDC+=kW;any.dc=true;}else{elecAC+=kW;any.ac=true;}}}
    } else if(line.type==="hyd"&&eff.max){
      var n2=parseFloat(eff.max);if(!isNaN(n2)){hyd+=n2;hydUnit=eff.unit;any.hyd=true;}
    }
  });
  return {elecAC:any.ac?elecAC:0,elecDC:any.dc?elecDC:0,hyd:any.hyd?hyd:0,hydUnit:hydUnit};
}

function bindStructureDragEvents(p,rerenderFn){
  var container=document.querySelector('[data-structContainer="'+p.id+'"]');
  if(!container)return;
  var dragId=null;
  function clearHighlights(){
    document.querySelectorAll(".drop-target").forEach(function(x){x.classList.remove("drop-target");});
  }
  function isDescendant(ancestorId,candidateId){
    var node=(p.structureTree||[]).find(function(n){return n.id===candidateId;});
    while(node){
      if(node.parentId===ancestorId)return true;
      node=(p.structureTree||[]).find(function(n){return n.id===node.parentId;});
    }
    return false;
  }
  container.querySelectorAll("[data-dragHandle]").forEach(function(h){
    h.onpointerdown=function(e){
      e.preventDefault();
      dragId=h.getAttribute("data-dragHandle");
      var el=container.querySelector('[data-nodeId="'+dragId+'"]');
      if(el)el.classList.add("dragging");
      try{h.setPointerCapture(e.pointerId);}catch(err){}
    };
  });
  var root=document.getElementById("tab-document")||document;
  root.onpointermove=function(e){
    if(!dragId)return;
    clearHighlights();
    var el=document.elementFromPoint(e.clientX,e.clientY);
    var dropEl=el&&el.closest?el.closest("[data-nodeId],[data-rootDrop]"):null;
    if(dropEl&&dropEl.getAttribute("data-nodeId")===dragId)dropEl=null;
    if(dropEl)dropEl.classList.add("drop-target");
  };
  root.onpointerup=function(e){
    if(!dragId)return;
    var draggedId=dragId;dragId=null;
    var el=document.elementFromPoint(e.clientX,e.clientY);
    var dropEl=el&&el.closest?el.closest("[data-nodeId],[data-rootDrop]"):null;
    clearHighlights();
    var draggingEl=container.querySelector('[data-nodeId="'+draggedId+'"]');
    if(draggingEl)draggingEl.classList.remove("dragging");
    if(!dropEl)return;
    var newParentId=dropEl.hasAttribute("data-rootDrop")?null:dropEl.getAttribute("data-nodeId");
    if(newParentId===draggedId)return;
    if(newParentId&&isDescendant(draggedId,newParentId)){alert(t().structCannotMoveIntoSelf);return;}
    var node=(p.structureTree||[]).find(function(n){return n.id===draggedId;});
    if(node&&node.parentId!==newParentId){node.parentId=newParentId;rerenderFn();}
  };
}

      var n=parseFloat(eff.max);if(!isNaN(n)){hyd+=n;hydUnit=eff.unit;any.hyd=true;}

  });

function capacityDemand(p,utilRow){
  var total=0,unit="",any=false;
  p.tagLinks.forEach(function(tl){
    var tag=findTag(tl.tagId);if(!tag)return;
    var line=findLine(tag,tl.lineId);if(!line)return;
    var match=false;
    if(utilRow.utilName==="elecAC"&&line.type==="elec"&&line.acdc!=="dc")match=true;
    if(utilRow.utilName==="elecDC"&&line.type==="elec"&&line.acdc==="dc")match=true;
    if(utilRow.utilName==="hydOil"&&line.type==="hyd")match=true;
    if(utilRow.utilName==="coolWater"&&line.type==="cool")match=true;
    if(utilRow.utilName==="instrAir"&&line.type==="air")match=true;
    if(!match)return;
    var eff=effLine(line,tl);
    var calc=calcPower(line,eff);
    if(calc&&calc.s.max!==null){total+=calc.s.max;unit=calc.dc?"kW":"kVA";any=true;}
    else if(eff.max){var n=parseFloat(eff.max);if(!isNaN(n)){total+=n;unit=eff.unit;any=true;}}
  });
  return any?{total:total,unit:unit}:null;
}

function buildDocxDoc(p,d){
  var X=window.docx;
  function txt(s,opts){opts=opts||{};return new X.TextRun(Object.assign({text:String(s==null?"":s)},opts));}
  function para(children,opts){opts=opts||{};if(typeof children==="string")children=[txt(children)];return new X.Paragraph(Object.assign({children:children},opts));}
  function heading(text,level){return new X.Paragraph({text:text,heading:level,spacing:{before:200,after:100}});}
  function labelValue(label,value){return para([txt(label+": ",{bold:true}),txt(value||"—")]);}
  function cellText(v){return new X.TableCell({children:[para(String(v==null?"":v))],margins:{top:60,bottom:60,left:80,right:80}});}
  function headerCell(v){return new X.TableCell({shading:{fill:"EEF1F2"},children:[para([txt(v,{bold:true})])]},{margins:{top:60,bottom:60,left:80,right:80}});}
  function dataTable(headers,rows){
    var hdrRow=new X.TableRow({tableHeader:true,children:headers.map(headerCell)});
    var bodyRows=rows.map(function(r){return new X.TableRow({children:r.map(cellText)});});
    return new X.Table({width:{size:100,type:X.WidthType.PERCENTAGE},rows:[hdrRow].concat(bodyRows)});
  }

  var children=[];

  if(p.logoDataUrl){
    try{
      var b64=p.logoDataUrl.split(",")[1];
      var bin=atob(b64);var bytes=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      children.push(para([new X.ImageRun({data:bytes,transformation:{width:130,height:44}})]));
    }catch(e){}
  }
  children.push(heading(p.companyName||"—",X.HeadingLevel.HEADING_3));
  children.push(dataTable([d.docNo,d.revision,d.docDate,d.preparedBy],[[p.docNo,p.revision,p.docDate,p.preparedBy]]));
  children.push(heading(d.genTitle,X.HeadingLevel.TITLE));
  children.push(para(p.name+(p.customer?" · "+p.customer:"")));
  if(p.purpose)children.push(labelValue(d.docPurpose,p.purpose));
  if(p.description)children.push(labelValue(d.docDescription,p.description));
  if(p.supplier)children.push(labelValue(d.docSupplier,p.supplier));

  children.push(heading(d.regDefinitions,X.HeadingLevel.HEADING_2));
  children.push(labelValue(d.defUtility,d.defUtilityText));
  children.push(labelValue(d.defConsumer,d.defConsumerText));
  children.push(labelValue(d.defDisciplineOwner,d.defDisciplineOwnerText));

  if(p.sysCapacity||p.sysMaxLoad||p.sysChar){
    children.push(heading(d.systemLevel,X.HeadingLevel.HEADING_2));
    if(p.sysCapacity)children.push(labelValue(d.sysCapacity,p.sysCapacity));
    if(p.sysMaxLoad)children.push(labelValue(d.sysMaxLoad,p.sysMaxLoad));
    if(p.sysChar)children.push(labelValue(d.sysChar,p.sysChar));
  }

  if((p.structureTree||[]).length){
    children.push(heading(d.regProductStructure,X.HeadingLevel.HEADING_2));
    (function walk(parentId,depth){
      nodeChildren(p.structureTree,parentId).forEach(function(node){
        children.push(para([txt(node.name,{bold:true})],{indent:{left:depth*300}}));
        var seenT={};
        p.tagLinks.filter(function(tl){return tl.structureNodeId===node.id;}).forEach(function(tl){
          var tag=findTag(tl.tagId);if(!tag||seenT[tag.id])return;seenT[tag.id]=true;
          children.push(para("• "+tag.tagNo+" ("+(tag.component||tag.name)+")",{indent:{left:depth*300+300}}));
        });
        var sub=nodeSubtotal(p,node.id);
        var subParts=[];
        if(sub.elecAC)subParts.push("AC: "+fmtNum(sub.elecAC)+" kVA");
        if(sub.elecDC)subParts.push("DC: "+fmtNum(sub.elecDC)+" kW");
        if(sub.hyd)subParts.push("Hyd: "+fmtNum(sub.hyd)+" "+sub.hydUnit);
        if(subParts.length)children.push(para("Σ "+subParts.join(" · "),{indent:{left:depth*300+300}}));
        walk(node.id,depth+1);
      });
    })(null,0);
  }

  if(p.tagLinks.length>0){
    var seenTags={};var crRows=[];
    p.tagLinks.forEach(function(tl){var tag=findTag(tl.tagId);if(tag&&!seenTags[tag.id]){seenTags[tag.id]=true;crRows.push(tag);}});
    children.push(heading(d.regConsumerRegister,X.HeadingLevel.HEADING_2));
    children.push(dataTable([d.colTag,d.tagName,d.crAssembly,d.crComponent,d.crDiscipline,d.crOperatingMode,d.crLocation,d.crDataOwner],
      crRows.map(function(tag){return [tag.tagNo,tag.name,tag.assembly,tag.component,tag.discipline,tag.operatingMode,tag.location,tag.dataOwner];})));

    children.push(heading(d.regRequiredConsumption,X.HeadingLevel.HEADING_2));
    var consRows=[];
    p.tagLinks.forEach(function(tl){
      var tag=findTag(tl.tagId);if(!tag)return;
      var line=findLine(tag,tl.lineId);if(!line)return;
      var eff=effLine(line,tl);var cd=consumptionDisplay(line,eff);
      var qualityCell=line.quality||"";if(cd.detail)qualityCell=qualityCell?qualityCell+" · "+cd.detail:cd.detail;
      consRows.push([tag.tagNo,typeLabel(line.type),contIntLabel(line.contInt),cd.text,modeLabel(eff.mode),qualityCell,line.notes]);
    });
    children.push(dataTable([d.colTag,d.colType,d.colContInt,d.colConsumption,d.colMode,d.colQuality,d.colNotes],consRows));
  }

  if(p.utilityRegister&&p.utilityRegister.length>0){
    children.push(heading(d.regCapacitySummary,X.HeadingLevel.HEADING_2));
    var utilLbl2={elecDC:d.utilElecDC,elecAC:d.utilElecAC,hydOil:d.utilHydOil,coolWater:d.utilCoolWater,instrAir:d.utilInstrAir,nitrogen:d.utilNitrogen,other:d.utilOther};
    var capRows=p.utilityRegister.map(function(u){
      var demand=capacityDemand(p,u);
      var avail=parseFloat(u.availCap);
      var demandTxt=demand?fmtNum(demand.total)+" "+demand.unit:d.capNoData;
      var marginTxt="";if(demand&&!isNaN(avail))marginTxt=fmtNum(avail-demand.total)+" "+(u.capacityUnit||demand.unit);
      return [u.utilId,utilLbl2[u.utilName]||u.utilName,(u.availCap||"")+" "+(u.capacityUnit||""),demandTxt,marginTxt,u.remarks];
    });
    children.push(dataTable([d.utilId,d.utilName,d.capAvailable,d.capDemand,d.capMargin,d.regNotes],capRows));
  }

  if(p.loadCases&&p.loadCases.length>0){
    children.push(heading(d.regLoadCases,X.HeadingLevel.HEADING_2));
    var lcRows=p.loadCases.map(function(lc){
      var demand=loadCaseDemand(p,lc);
      var modeNames=lcModeNames(lc);
      return [lc.caseId,lc.name,modeNames,demand.elecAC?fmtNum(demand.elecAC)+" kVA":"—",demand.elecDC?fmtNum(demand.elecDC)+" kW":"—",demand.hyd?fmtNum(demand.hyd)+" "+demand.hydUnit:"—",lc.basis];
    });
    children.push(dataTable([d.lcCaseId,d.lcName,d.lcModesIncluded,d.lcSumAC,d.lcSumDC,d.lcSumHyd,d.lcBasis],lcRows));
  }

  ["operatingModes","products","utilityRegister","utilityRequirements","assumptions","openItems","references","revisions","dataQuality"].forEach(function(key){
    var cfg=regCfg(key);
    var rows=p[key]||[];
    if(rows.length===0)return;
    children.push(heading(cfg.title,X.HeadingLevel.HEADING_2));
    var headers=cfg.fields.map(function(f){return f.label;});
    var dataRows=rows.map(function(row){return cfg.fields.map(function(f){var v=row[f.k]||"";return f.type==="select"?f.optLabel(v):v;});});
    children.push(dataTable(headers,dataRows));
  });




  return new X.Document({sections:[{properties:{},children:children}]});
}

    out+='<table class="doc"><thead><tr><th>'+d.colType+'</th><th>'+d.colContInt+'</th><th>'+d.colConsumption+'</th><th>'+d.colMode+'</th><th>'+d.colQuality+'</th><th>'+d.colNotes+'</th></tr></thead><tbody>';
    lines.forEach(function(line){
      var eff={min:line.min,normal:line.normal,max:line.max,unit:line.unit,mode:line.mode,voltage:line.voltage,acdc:line.acdc,phases:line.phases,powerFactor:line.powerFactor};
      var cd=consumptionDisplay(line,eff);
      var qualityCell=line.quality||"";if(cd.detail)qualityCell=qualityCell?qualityCell+" · "+cd.detail:cd.detail;
      if(line.type==="hyd"&&line.hydSystemType){var sysLbl=hydSystemTypeShortLabel(line.hydSystemType);qualityCell=qualityCell?sysLbl+" · "+qualityCell:sysLbl;}
      out+='<tr><td>'+esc(typeLabel(line.type))+'</td><td>'+esc(contIntLabel(line.contInt))+'</td><td>'+cd.text+'</td><td>'+esc(modeLabel(line.mode))+'</td><td>'+esc(qualityCell)+'</td><td>'+esc(line.notes)+'</td></tr>';
    });
    out+='</tbody></table>';
    return out;
  }

  if(elecLines.length)html+=linesTable(elecLines,d.dsElectrical);
  if(hydLines.length)html+=linesTable(hydLines,d.dsHydraulic);
  if(otherLines.length)html+=linesTable(otherLines,d.dsOtherUtil);

  if(tag.notes)html+='<div style="margin-top:10px;font-size:11px"><b>'+d.tagNotes+':</b> '+esc(tag.notes)+'</div>';

  return html;
}

function bindDocumentEvents(){
  var sel=document.getElementById("docProject");
  if(sel)sel.onchange=function(){state.docProjectId=sel.value||null;renderDocument();};

  var saveInfoBtn=document.getElementById("saveDocInfo");
  if(saveInfoBtn)saveInfoBtn.onclick=function(){
    var p=findProject(state.docProjectId);
    p.companyName=val("fd_company");p.docNo=val("fd_docNo");p.revision=val("fd_rev");p.docDate=val("fd_date");p.preparedBy=val("fd_prep");
    p.supplier=val("fd_supplier");p.purpose=val("fd_purpose");p.description=val("fd_description");
    renderDocument();
  };

  function handleLogoFile(p,file){
    if(!file||file.type.indexOf("image/")!==0)return;
    var reader=new FileReader();
    reader.onload=function(e){p.logoDataUrl=e.target.result;renderDocument();};
    reader.readAsDataURL(file);
  }

  var logoInput=document.getElementById("fd_logo");
  if(logoInput)logoInput.onchange=function(){
    var p=findProject(state.docProjectId);
    if(logoInput.files&&logoInput.files[0])handleLogoFile(p,logoInput.files[0]);
  };
  var removeLogoBtn=document.getElementById("removeLogo");
  if(removeLogoBtn)removeLogoBtn.onclick=function(){
    var p=findProject(state.docProjectId);
    p.logoDataUrl="";renderDocument();
  };
  var dropzone=document.getElementById("logoDropzone");
  if(dropzone){
    dropzone.onclick=function(e){if(e.target!==logoInput)logoInput.click();};
    dropzone.ondragover=function(e){e.preventDefault();dropzone.classList.add("dragover");};
    dropzone.ondragleave=function(){dropzone.classList.remove("dragover");};
    dropzone.ondrop=function(e){
      e.preventDefault();dropzone.classList.remove("dragover");
      var p=findProject(state.docProjectId);
      if(e.dataTransfer.files&&e.dataTransfer.files[0])handleLogoFile(p,e.dataTransfer.files[0]);
    };
  }

  bindRegisterEvents(renderDocument);
  bindLoadCaseEvents(renderDocument);
  bindStructureEvents(renderDocument);
  var pForDrag=findProject(state.docProjectId);
  if(pForDrag)bindStructureDragEvents(pForDrag,renderDocument);

  var pdfBtn=document.getElementById("btnExportPdf");
  if(pdfBtn)pdfBtn.onclick=function(){
    var p=findProject(state.docProjectId);
    if(!p)return;
    var w=window.open("","_blank");
    w.document.write(buildPrintableHtml(p));
    w.document.close();
    w.focus();
    setTimeout(function(){w.print();},300);
  };

  var wordBtn=document.getElementById("btnExportWord");
  if(wordBtn)wordBtn.onclick=function(){
    var p=findProject(state.docProjectId);
    if(!p)return;
    var d=t();
    function fallbackDoc(){
      var html=buildPrintableHtml(p).replace("<html>","<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>");
      var blob=new Blob(['\ufeff',html],{type:"application/msword"});
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download=exportFileBaseName(p)+".doc";
      document.body.appendChild(a);a.click();document.body.removeChild(a);
    }
    if(!window.docx||!window.docx.Document){
      alert(state.lang==="no"?"Kunne ikke laste docx-biblioteket (ingen nett?) — laster ned HTML-basert .doc i stedet.":"Could not load the docx library (no internet?) — downloading HTML-based .doc instead.");
      fallbackDoc();return;
    }
    try{
      var doc=buildDocxDoc(p,d);
      window.docx.Packer.toBlob(doc).then(function(blob){
        var a=document.createElement("a");
        a.href=URL.createObjectURL(blob);
        a.download=exportFileBaseName(p)+".docx";
        document.body.appendChild(a);a.click();document.body.removeChild(a);
      }).catch(function(err){
        console.error(err);
        alert(state.lang==="no"?"Feil under generering av .docx — laster ned HTML-basert .doc i stedet.":"Error generating .docx — downloading HTML-based .doc instead.");
        fallbackDoc();
      });
    }catch(err){
      console.error(err);
      fallbackDoc();
    }
  };

  var xlsBtn=document.getElementById("btnExportExcel");
  if(xlsBtn)xlsBtn.onclick=function(){
    var d=t();
    var p=findProject(state.docProjectId);
    if(!p)return;
    var wb=XLSX.utils.book_new();
    function addSheet(name,rows){
      var ws=XLSX.utils.aoa_to_sheet(rows);
      XLSX.utils.book_append_sheet(wb,ws,name.substring(0,31));
    }

    addSheet("Dokumentinfo",[
      [d.companyName,p.companyName||""],
      [d.docNo,p.docNo||""],[d.revision,p.revision||""],[d.docDate,p.docDate||""],[d.preparedBy,p.preparedBy||""],
      [d.docSupplier,p.supplier||""],[d.docPurpose,p.purpose||""],[d.docDescription,p.description||""],
      [d.sysCapacity,p.sysCapacity||""],[d.sysMaxLoad,p.sysMaxLoad||""],[d.sysChar,p.sysChar||""]
    ]);

    if((p.structureTree||[]).length){
      var psRows=[[d.structNodeName,"Level","Tags"]];
      (function walk(parentId,depth){
        nodeChildren(p.structureTree,parentId).forEach(function(node){
          var tagNames=[];var seenT={};
          p.tagLinks.filter(function(tl){return tl.structureNodeId===node.id;}).forEach(function(tl){
            var tag=findTag(tl.tagId);if(tag&&!seenT[tag.id]){seenT[tag.id]=true;tagNames.push(tag.tagNo);}
          });
          psRows.push([new Array(depth+1).join("  ")+node.name,depth,tagNames.join(", ")]);
          walk(node.id,depth+1);
        });
      })(null,0);
      addSheet(d.regProductStructure,psRows);
    }

    var seenCR={};var crRows=[[d.colTag,d.tagName,d.crAssembly,d.crComponent,d.crDiscipline,d.crOperatingMode,d.crLocation,d.crDataOwner]];
    p.tagLinks.forEach(function(tl){var tag=findTag(tl.tagId);if(tag&&!seenCR[tag.id]){seenCR[tag.id]=true;crRows.push([tag.tagNo,tag.name,tag.assembly,tag.component,tag.discipline,tag.operatingMode,tag.location,tag.dataOwner]);}});
    if(crRows.length>1)addSheet(d.regConsumerRegister,crRows);

    var consRows=[[d.colTag,d.colType,d.colContInt,d.colMin,d.colNormal,d.colMax,d.colUnit,d.colMode,
      d.acdc,d.phases,d.voltage,"S min","S normal","S maks","S enhet","P min","P normal","P maks","Formel",d.colQuality,d.colNotes]];
    p.tagLinks.forEach(function(tl){
      var tag=findTag(tl.tagId);if(!tag)return;
      var line=findLine(tag,tl.lineId);if(!line)return;
      var eff=effLine(line,tl);
      var calc=calcPower(line,eff);
      consRows.push([tag.tagNo,typeLabel(line.type),contIntLabel(line.contInt),eff.min,eff.normal,eff.max,eff.unit,modeLabel(eff.mode),
        line.type==="elec"?(line.acdc||""):"",line.type==="elec"&&line.acdc!=="dc"?(line.phases||""):"",line.type==="elec"?(line.voltage||""):"",
        calc?fmtNum(calc.s.min):"",calc?fmtNum(calc.s.normal):"",calc?fmtNum(calc.s.max):"",calc?(calc.dc?"kW":"kVA"):"",
        calc&&calc.p?fmtNum(calc.p.min):"",calc&&calc.p?fmtNum(calc.p.normal):"",calc&&calc.p?fmtNum(calc.p.max):"",
        calc?calc.formula:"",line.quality,line.notes]);
    });
    addSheet(d.regRequiredConsumption,consRows);

    if(p.utilityRegister&&p.utilityRegister.length>0){
      var utilLbl2={elecDC:d.utilElecDC,elecAC:d.utilElecAC,hydOil:d.utilHydOil,coolWater:d.utilCoolWater,instrAir:d.utilInstrAir,nitrogen:d.utilNitrogen,other:d.utilOther};
      var capRows=[[d.utilId,d.utilName,d.capAvailable,d.capDemand,d.capMargin,d.regNotes]];
      p.utilityRegister.forEach(function(u){
        var demand=capacityDemand(p,u);
        var avail=parseFloat(u.availCap);
        var demandTxt=demand?fmtNum(demand.total)+" "+demand.unit:d.capNoData;
        var marginTxt="";if(demand&&!isNaN(avail))marginTxt=fmtNum(avail-demand.total)+" "+(u.capacityUnit||demand.unit);
        capRows.push([u.utilId,utilLbl2[u.utilName]||u.utilName,(u.availCap||"")+" "+(u.capacityUnit||""),demandTxt,marginTxt,u.remarks]);
      });
      addSheet(d.regCapacitySummary,capRows);
    }

    if(p.loadCases&&p.loadCases.length>0){
      var lcRows=[[d.lcCaseId,d.lcName,d.regDescription,d.lcModesIncluded,d.lcSumAC,d.lcSumDC,d.lcSumHyd,d.lcBasis]];
      p.loadCases.forEach(function(lc){
        var demand=loadCaseDemand(p,lc);
        var modeNames=lcModeNames(lc);
        lcRows.push([lc.caseId,lc.name,lc.description,modeNames,demand.elecAC?fmtNum(demand.elecAC)+" kVA":"",demand.elecDC?fmtNum(demand.elecDC)+" kW":"",demand.hyd?fmtNum(demand.hyd)+" "+demand.hydUnit:"",lc.basis]);
      });
      addSheet(d.regLoadCases,lcRows);
    }

    ["operatingModes","products","utilityRegister","utilityRequirements","assumptions","openItems","references","revisions","dataQuality"].forEach(function(key){
      var cfg=regCfg(key);
      var rows=p[key]||[];
      if(rows.length===0)return;
      var headers=cfg.fields.map(function(f){return f.label;});
      var dataRows=rows.map(function(row){return cfg.fields.map(function(f){var v=row[f.k]||"";return f.type==="select"?f.optLabel(v):v;});});
      addSheet(cfg.title,[headers].concat(dataRows));
    });

    XLSX.writeFile(wb,exportFileBaseName(p)+".xlsx");
  };
}

function mergeIncomingData(payload){
  var summary={tags:0,projects:0,declarations:0,sharedDeclarations:0,directives:0,standards:0,notifiedBodies:0,skipped:0};

  function mergeByKey(localArr,incomingArr,keyFn){
    if(!Array.isArray(incomingArr))return 0;
    var existingKeys={};
    localArr.forEach(function(item){existingKeys[keyFn(item)]=true;});
    var added=0;
    incomingArr.forEach(function(item){
      var k=keyFn(item);
      if(!k||existingKeys[k])return;
      localArr.push(item);
      existingKeys[k]=true;
      added++;
    });
    return added;
  }

  summary.tags=mergeByKey(state.tags,payload.tags,function(x){return x.tagNo;});
  summary.projects=mergeByKey(state.projects,payload.projects,function(x){return x.docNo;});
  summary.declarations=mergeByKey(state.declarations,payload.declarations,function(x){return x.docNumber;});
  summary.sharedDeclarations=mergeByKey(state.sharedDeclarations,payload.sharedDeclarations,function(x){return x.docNumber;});
  if(payload.docCustom){
    summary.directives=mergeByKey(state.docCustom.directives,payload.docCustom.directives,function(x){return x.code;});
    summary.standards=mergeByKey(state.docCustom.standards,payload.docCustom.standards,function(x){return x.code;});
    summary.notifiedBodies=mergeByKey(state.docCustom.notifiedBodies,payload.docCustom.notifiedBodies,function(x){return x.name+"|"+x.ref;});
  }
  return summary;
}

function mergeSummaryText(s,d){
  var parts=[];
  if(s.tags)parts.push(s.tags+" "+d.mergeTags);
  if(s.projects)parts.push(s.projects+" "+d.mergeProjects);
  if(s.declarations)parts.push(s.declarations+" "+d.mergeDeclarations);
  if(s.sharedDeclarations)parts.push(s.sharedDeclarations+" "+d.mergeShared);
  if(s.directives)parts.push(s.directives+" "+d.mergeDirectives);
  if(s.standards)parts.push(s.standards+" "+d.mergeStandards);
  if(s.notifiedBodies)parts.push(s.notifiedBodies+" "+d.mergeNb);
  return parts.length?d.mergeDone+"\n\n"+parts.join("\n"):d.mergeNothing;
}

function autoBackupBeforeReplace(){
  try{
    var payload={version:1,backupType:"auto-before-replace",exportedAt:new Date().toISOString(),tags:state.tags,projects:state.projects,declarations:state.declarations,sharedDeclarations:state.sharedDeclarations,docCustom:state.docCustom};
    var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    var d=new Date();
    var stamp=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+"_"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0");
    a.download="utility-hub-sikkerhetskopi-"+stamp+".json";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  }catch(e){console.error("Auto-backup failed",e);}
}

function importProjectDataFile(file){
  var d=t();
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var payload=JSON.parse(e.target.result);
      if(!payload||!Array.isArray(payload.tags)||!Array.isArray(payload.projects))throw new Error("bad shape");
      autoBackupBeforeReplace();
      state.tags=payload.tags;
      state.projects=payload.projects;
      state.declarations=Array.isArray(payload.declarations)?payload.declarations:[];
      state.sharedDeclarations=Array.isArray(payload.sharedDeclarations)?payload.sharedDeclarations:[];
      state.docCustom=payload.docCustom&&typeof payload.docCustom==="object"?payload.docCustom:{directives:[],standards:[],notifiedBodies:[]};
      state.editingTagId=null;state.addingLineForTag=null;state.editingLineFor=null;
      state.expandedProject=null;state.registerAdding=null;state.lcAdding=null;
      state.docProjectId=state.projects.length?state.projects[0].id:null;
      renderShell();renderActiveTab();
      alert(d.openDataSuccess);
    }catch(err){
      alert(d.openDataError);
    }
  };
  reader.readAsText(file);
}

var appDarkBtn=document.getElementById("btnDarkToggle");
function updateThemeColorMeta(isDark){
  var m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute("content",isDark?"#0B1020":"#FFFFFF");
}
function applyDarkPref(){
  try{
    if(localStorage.getItem("uh_darkmode")==="1"){
      document.body.classList.add("dark-mode");
      if(appDarkBtn)appDarkBtn.textContent="☀";
    }
  }catch(e){}
  updateThemeColorMeta(document.body.classList.contains("dark-mode"));
}
appDarkBtn.onclick=function(){
  document.body.classList.toggle("dark-mode");
  var isDark=document.body.classList.contains("dark-mode");
  appDarkBtn.textContent=isDark?"☀":"🌙";
  updateThemeColorMeta(isDark);
  try{localStorage.setItem("uh_darkmode",isDark?"1":"0");}catch(e){}
};
applyDarkPref();
document.getElementById("fileOpenData").onchange=function(e){
  if(e.target.files&&e.target.files[0])importProjectDataFile(e.target.files[0]);

};

document.getElementById("fileMergeData").onchange=function(e){
  if(!e.target.files||!e.target.files[0]){return;}
  var file=e.target.files[0];
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var payload=JSON.parse(ev.target.result);
      var d=t();
      var summary=mergeIncomingData(payload);
      state.editingTagId=null;state.addingLineForTag=null;state.editingLineFor=null;
      state.expandedProject=null;state.registerAdding=null;state.lcAdding=null;
      renderShell();renderActiveTab();
      alert(mergeSummaryText(summary,d));
    }catch(err){alert(t().openDataError);}
  };
  reader.readAsText(file);
  e.target.value="";
};

function cloudSave(){
  if(!firebaseEnabled||!fbUser)return;
  if(!confirm(t().cloudSaveConfirm))return;
  var now=new Date().toISOString();
  Promise.all([
    sharedDocRef("library").set({tags:state.tags,updatedAt:now}),
    sharedDocRef("projects").set({projects:state.projects,updatedAt:now}),
    sharedDocRef("docCustom").set({docCustom:state.docCustom,updatedAt:now}),
    sharedDocRef("declarations").set({declarations:state.sharedDeclarations,updatedAt:now}),
    privateDocRef().set({declarations:state.declarations,updatedAt:now})
  ]).then(function(){adminLogEvent((fbUser?fbUser.email:"?")+" lagret til sky");alert(t().cloudSaveDone);})
    .catch(function(err){console.error(err);alert(t().cloudError);});
}
function cloudLoad(){
  if(!firebaseEnabled||!fbUser)return;
  if(!confirm(t().cloudLoadConfirm))return;
  autoBackupBeforeReplace();
  Promise.all([
    sharedDocRef("library").get(),
    sharedDocRef("projects").get(),
    sharedDocRef("docCustom").get(),
    sharedDocRef("declarations").get(),
    privateDocRef().get()
  ]).then(function(docs){
    var lib=docs[0].exists?docs[0].data():null;
    var proj=docs[1].exists?docs[1].data():null;
    var custom=docs[2].exists?docs[2].data():null;
    var sharedDecl=docs[3].exists?docs[3].data():null;
    var priv=docs[4].exists?docs[4].data():null;
    if(!lib&&!proj){alert(t().cloudNoData);return;}
    if(lib&&Array.isArray(lib.tags))state.tags=lib.tags;
    if(proj&&Array.isArray(proj.projects))state.projects=proj.projects;
    state.docCustom=(custom&&custom.docCustom&&typeof custom.docCustom==="object")?custom.docCustom:{directives:[],standards:[],notifiedBodies:[]};
    state.sharedDeclarations=(sharedDecl&&Array.isArray(sharedDecl.declarations))?sharedDecl.declarations:[];
    state.declarations=(priv&&Array.isArray(priv.declarations))?priv.declarations:[];
    state.editingTagId=null;state.addingLineForTag=null;state.editingLineFor=null;
    state.expandedProject=null;state.registerAdding=null;state.lcAdding=null;
    state.docProjectId=state.projects.length?state.projects[0].id:null;
    renderShell();renderActiveTab();
    adminLogEvent((fbUser?fbUser.email:"?")+" hentet fra sky");
    alert(t().cloudLoadDone);
  }).catch(function(err){console.error(err);alert(t().cloudError);});
}
function cloudMerge(){

    sharedDocRef("library").get(),
    sharedDocRef("projects").get(),

  ]).then(function(docs){

    var custom=docs[2].exists?docs[2].data():null;
    var sharedDecl=docs[3].exists?docs[3].data():null;
    var priv=docs[4].exists?docs[4].data():null;
    var payload={
      tags:(lib&&Array.isArray(lib.tags))?lib.tags:[],
      projects:(proj&&Array.isArray(proj.projects))?proj.projects:[],
      docCustom:(custom&&custom.docCustom)?custom.docCustom:null,
      sharedDeclarations:(sharedDecl&&Array.isArray(sharedDecl.declarations))?sharedDecl.declarations:[],
      declarations:(priv&&Array.isArray(priv.declarations))?priv.declarations:[]
    };
    var d=t();
    var summary=mergeIncomingData(payload);
    state.editingTagId=null;state.addingLineForTag=null;state.editingLineFor=null;
    state.expandedProject=null;state.registerAdding=null;state.lcAdding=null;
    adminLogEvent((fbUser?fbUser.email:"?")+" slo sammen fra sky");
    renderShell();renderActiveTab();
    alert(mergeSummaryText(summary,d));
  }).catch(function(err){console.error(err);alert(t().cloudError);});
}
